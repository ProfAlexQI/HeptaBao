real_candidate_operations:
  - construct three Raft<TypeConfig, Arc<MemStateMachine>> instances
  - initialize one voter then add two learners and execute joint-to-uniform membership change
  - forward append_entries, vote, pre_vote and full_snapshot through a HeptaBao-owned in-process network
  - commit ClientRequest values through the actual OpenRaft client_write API
  - perform ReadIndex linearizable-read validation
  - restart a follower with the same log store and a fresh state machine
  - isolate a follower, build a snapshot, heal the link and observe full-snapshot catch-up
  - isolate or transport-pause leaders and verify failed writes do not advance committed state
  - preserve deterministic seed, fault plan, RPC counters and replay output

cases:
  - case_id: raft-deterministic-apply-and-restart
    required: true
    actual_candidate_scope:
      - replicated client writes on a three-voter OpenRaft cluster
      - fresh state-machine reconstruction from the retained in-memory log store
      - equal post-restart application state
  - case_id: raft-committed-snapshot-conflict-rejected
    required: true
    actual_candidate_scope:
      - lagging follower isolation
      - real snapshot construction and RaftNetworkV2 full_snapshot delivery
      - monotonic committed index and state convergence after heal
    remaining_blocker: hostile conflicting-snapshot injection is not executed because the candidate API documents panic on inconsistent local committed state
  - case_id: raft-joint-membership-single-writer
    required: true
    actual_candidate_scope:
      - add_learner for nodes 2 and 3
      - change_membership to voters 1,2,3
      - one reported leader and successful ReadIndex
  - case_id: raft-process-pause-plus-partition
    required: true
    actual_candidate_scope:
      - in-process transport pause of the old leader
      - election among the remaining majority
      - old-leader write rejection and new-leader commit
    remaining_blocker: operating-system process suspension and disk scheduling pause are not executed
  - case_id: raft-quorum-loss-fail-closed
    required: true
    actual_candidate_scope:
      - isolate the active leader from both followers
      - bound the write attempt with a deadline
      - verify local committed index does not advance
  - case_id: raft-incomplete-run-replay-diagnostics
    required: true
    actual_candidate_scope:
      - deterministic SplitMix64 fault plan
      - fixed seed and last-event index
      - protocol RPC counters retained in evidence

