  - openraft-memstore is test-only and is not a production durable storage selection
  - hostile conflicting-snapshot injection is not executed
  - operating-system process pause, disk stall and clock fault are not executed
  - no external linearizability checker history
  - no package/SBOM/advisory/license/unsafe/native/build-script/effective-MSRV closure
  - no independent distributed-systems and security approval
  - no signed bounded prototype-selection receipt

invariants:
  - All candidate and transport types remain inside probes/h02.
  - The HeptaBao core workspace does not depend on OpenRaft or openraft-memstore.
  - A successful six-case run remains unreviewed evidence and cannot select a candidate.
  - Any missing, blocked, timed-out, malformed or replay-divergent case fails closed.
  - The test memstore never creates a production durability claim.
  - qualification remains false and every authority effect remains NONE.
