hostile_snapshot_case:
  case_id: raft-hostile-stale-committed-snapshot-isolated
  process_model:
    parent:
      - resolves the exact current executable
      - starts an isolated child with piped stdout and stderr
      - enforces a 25 second parent deadline
      - kills the child on future drop
      - parses JSON phase and result records
    child:
      - constructs a real three-voter OpenRaft cluster
      - commits a stale base record and six later records
      - waits for all three voters to apply the latest committed index
      - builds a real candidate snapshot
      - rewrites only snapshot.meta.last_log_id to the older committed log id
      - emits and flushes ABOUT_TO_INSTALL_STALE_COMMITTED_SNAPSHOT immediately before injection
      - calls the target candidate Raft::install_full_snapshot API
  classification:
    EXECUTED_PASS:
      - explicit candidate rejection after the injection marker
      - isolated process fatality after the injection marker
    EXECUTED_FAIL:
      - candidate returns success for the stale committed snapshot
    BLOCKED:
      - child fails before the injection marker
      - parent cannot start or observe the child
      - child or candidate exceeds a bounded deadline
      - child exits without a recognized outcome
  availability_boundary:
    - a process-fatal rejection may preserve safety for this case
    - process fatality is not an availability pass
    - production promotion remains blocked even when this safety case passes

linearizability_case:
  case_id: raft-readindex-single-register-external-check
  history_schema: schemas/heptabao_h02_linearizability_history_v1.schema.json
  result_schema: schemas/heptabao_h02_linearizability_result_v1.schema.json
  real_candidate_scope:
    - three real OpenRaft voters using the exact candidate package
    - two overlapping client_write operations against one logical register
    - one overlapping ReadIndex read
    - one final ReadIndex read invoked after all overlapping operations complete
    - process-local monotonic invocation and completion sequence numbers
    - candidate RPC counters retained as metadata
  checker:
    model: single-register-v1
    algorithm: bounded-real-time-precedence-backtracking
    max_operations: 64
    real_time_rule: operation A precedes B when A.complete is strictly less than B.invoke
    write_rule: a write changes the register to its input value
    read_rule: a read must return the current register value
    fail_closed_inputs:
      - failed or unknown operation
      - duplicate operation id
      - invalid invocation/completion interval
      - unsupported operation kind
      - more than 64 operations
      - forged qualification, selection or authority field
      - malformed candidate, version, profile, seed, scope or durability binding
  classification:
    EXECUTED_PASS: a legal witness order exists
    EXECUTED_FAIL: a well-formed executed history has no legal witness
    BLOCKED: the history or checker input is malformed, incomplete or outside contract

evidence:
  hostile_result_schema: schemas/heptabao_h02_openraft_hostile_snapshot_result_v1.schema.json
  combined_schema: schemas/heptabao_h02_openraft_fault_lab_evidence_v1.schema.json
  combined_status:
