name: apply-h02-validit-lock-binding

on:
  push:
    branches: ["codex/h02-durable-multiprocess-closure-v2"]
    paths: [".github/workflows/apply-h02-validit-lock-binding.yml"]

permissions:
  contents: write

concurrency:
  group: apply-h02-validit-lock-binding
  cancel-in-progress: false

jobs:
  bind-lock:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/h02-durable-multiprocess-closure-v2
          fetch-depth: 0
          persist-credentials: true
      - name: Bind only validit to the audited immutable source
        shell: bash
        env:
          EXPECTED_BRANCH: codex/h02-durable-multiprocess-closure-v2
          VALIDIT_REV: 7016fa5e072a86092928144b3a3040381e6964e9
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          rustup toolchain install 1.88.0 --profile minimal
          python3 - <<'PY'
          from pathlib import Path

          path = Path("probes/h02/openraft-tokio/Cargo.lock")
          text = path.read_text(encoding="utf-8")
          old = '''[[package]]
          name = "validit"
          version = "0.2.6"
          source = "registry+https://github.com/rust-lang/crates.io-index"
          checksum = "4417835826b78aa6265724624d424df2b1e6e71a33329227d8b04a88950780dc"
          dependencies = [
           "anyerror",
          ]
          '''
          new = '''[[package]]
          name = "validit"
          version = "0.2.5"
          source = "git+https://github.com/drmingdrmer/validit.git?rev=7016fa5e072a86092928144b3a3040381e6964e9#7016fa5e072a86092928144b3a3040381e6964e9"
          dependencies = [
           "anyerror",
          ]
          '''
          assert text.count(old) == 1, "expected exactly one stale validit lock stanza"
          updated = text.replace(old, new, 1)
          assert updated.count('name = "validit"') == 1
          path.write_text(updated, encoding="utf-8")
          PY
          rustup run 1.88.0 cargo metadata --locked --format-version 1 \
            --manifest-path probes/h02/openraft-tokio/Cargo.toml \
            >"$RUNNER_TEMP/metadata.json"
          python3 - "$RUNNER_TEMP/metadata.json" "$VALIDIT_REV" <<'PY'
          import json
          import sys

          metadata = json.load(open(sys.argv[1], encoding="utf-8"))
          revision = sys.argv[2]
          packages = [package for package in metadata["packages"] if package["name"] == "validit"]
          assert len(packages) == 1, packages
          package = packages[0]
          assert package["version"] == "0.2.5", package
          source = package.get("source") or ""
          assert source == f"git+https://github.com/drmingdrmer/validit.git?rev={revision}#{revision}", source
          PY
          git diff --check
          git diff -- probes/h02/openraft-tokio/Cargo.lock
          rm .github/workflows/apply-h02-validit-lock-binding.yml
          git add probes/h02/openraft-tokio/Cargo.lock .github/workflows/apply-h02-validit-lock-binding.yml
          git config user.name "heptabao-closure-bot"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git commit -m "fix(h02): bind lockfile to audited validit revision"
          git push origin "HEAD:$EXPECTED_BRANCH"
