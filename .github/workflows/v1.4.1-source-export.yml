name: v1.4.1-source-export

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - codex/v1.4-durable-single-node-foundation-v1
    paths:
      - .github/workflows/v1.4.1-source-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind and archive source
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/heptabao-v1.4.1-source"
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/heptabao-v1.4.1-source"
          printf '%s\n' "$expected" >"$RUNNER_TEMP/heptabao-v1.4.1-source/EXACT_HEAD"
          printf '%s\n' "$(git rev-parse HEAD^{tree})" >"$RUNNER_TEMP/heptabao-v1.4.1-source/EXACT_TREE"
      - name: Upload exact source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v1.4.1-exact-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/heptabao-v1.4.1-source/
          if-no-files-found: error
          retention-days: 3
