# Maintenance epoch: deterministic source repair after temporarily closing stacked PR #25.
name: apply-repository-identity-closure

on:
  push:
    branches: ["codex/h02-final-gap-closure-v1"]
    paths:
      - ".github/workflows/apply-repository-identity-closure.yml"

permissions:
  contents: write

concurrency:
  group: apply-repository-identity-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replace-and-verify:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout branch commit with write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify event commit is the checked-out branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Apply exact repository identity, Oracle and evidence-binding repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path

          owner_old = ("ProfAlex" + "QI").encode("utf-8")
          owner_new = b"ProfHepta"
          surface_old = ("HB-SURFACE-" + "CLI").encode("utf-8")
          surface_new = b"HB-SURFACE-CLI-ROOT"
          surface_pattern = re.compile(
              rb"(?<![A-Z0-9._-])" + re.escape(surface_old) + rb"(?![A-Z0-9._-])"
          )
          config_old = ("HB-CONFIG-ITEM-" + "UI").encode("utf-8")
          config_new = b"HB-CONFIG-ITEM-UI-ROOT"
          config_pattern = re.compile(
              rb"(?<![A-Z0-9._-])" + re.escape(config_old) + rb"(?![A-Z0-9._-])"
          )

          tracked = [
              Path(item.decode("utf-8"))
              for item in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
              if item
          ]
          changed: list[str] = []
          owner_occurrences = 0
          surface_occurrences = 0
          config_occurrences = 0

          for path in tracked:
              data = path.read_bytes()
              owner_count = data.count(owner_old)
              repaired = data.replace(owner_old, owner_new)
              surface_count = len(surface_pattern.findall(repaired))
              repaired = surface_pattern.sub(surface_new, repaired)
              config_count = len(config_pattern.findall(repaired))
              repaired = config_pattern.sub(config_new, repaired)
              if repaired == data:
                  continue
              path.write_bytes(repaired)
              changed.append(path.as_posix())
              owner_occurrences += owner_count
              surface_occurrences += surface_count
              config_occurrences += config_count

          required_owner_paths = {
              ".github/CODEOWNERS",
              "schemas/heptabao_dependency_probe_evidence_v1.schema.json",
              "schemas/heptabao_qualification_receipt_v2.schema.json",
              "scripts/h02_dependency_probe_v1.py",
              "scripts/validate_plan_v2.py",
          }
          missing_owner_paths = sorted(required_owner_paths - set(changed))
          if missing_owner_paths:
              raise SystemExit(
                  f"expected deprecated owner bindings were absent: {missing_owner_paths}"
              )
          if owner_occurrences < len(required_owner_paths):
              raise SystemExit(
                  f"unexpectedly shallow owner replacement count: {owner_occurrences}"
              )

          required_surface_path = "oracle/inventory/openbao-v2.6.2/surface-catalog.yaml"
          if required_surface_path not in changed:
              raise SystemExit(
                  f"expected invalid Oracle surface identity was absent: {required_surface_path}"
              )
          if surface_occurrences != 1:
              raise SystemExit(
                  f"expected one Oracle surface replacement, observed {surface_occurrences}"
              )

          required_config_path = "oracle/inventory/openbao-v2.6.2/config-core-seed.yaml"
          if required_config_path not in changed:
              raise SystemExit(
                  f"expected invalid Oracle config identity was absent: {required_config_path}"
              )
          if config_occurrences < 1:
              raise SystemExit("expected at least one Oracle config identity replacement")

          endpoint_path = Path("oracle/inventory/openbao-v2.6.2/endpoint-seed.yaml")
          endpoint_text = endpoint_path.read_text(encoding="utf-8")
          endpoint_old = (
              "  - id: HB-ENDPOINT-RAFT-SNAPSHOT-READ\n"
              "    path_template: /v1/sys/storage/raft/snapshot\n"
              "    methods: [GET]\n"
              "    operation_class: CLUSTER_OPERATION\n"
              "    exposure: PUBLIC_AUTHENTICATED\n"
              "    criticality: DATA_DURABILITY_CRITICAL\n"
              "    authentication_mode: TOKEN_REQUIRED\n"
              "    policy_capability: sudo\n"
              "    request_audit: REQUIRED\n"
              "    response_audit: REQUIRED\n"
              "    side_effects: [STORAGE, CLUSTER]\n"
              "    secret_response: true\n"
          )
          endpoint_new = endpoint_old.replace(
              "    response_audit: REQUIRED\n",
              "    response_audit: REQUIRED_BEFORE_SECRET_RELEASE\n",
          )
          endpoint_count = endpoint_text.count(endpoint_old)
          if endpoint_count != 1:
              raise SystemExit(
                  f"snapshot-read audit anchor drift: expected=1 observed={endpoint_count}"
              )
          endpoint_path.write_text(
              endpoint_text.replace(endpoint_old, endpoint_new, 1),
              encoding="utf-8",
              newline="\n",
          )
          changed.append(endpoint_path.as_posix())

          validator_path = Path("scripts/validate_oracle_foundation_v1.py")
          validator_text = validator_path.read_text(encoding="utf-8")
          validator_replacements = [
              (
                  'status.get("work_status") != "SAFE_PUBLIC_FOUNDATION_ACTIVE"',
                  'status.get("work_status") != "SAFE_PUBLIC_AND_SYNTHETIC_FOUNDATION_ACTIVE"',
              ),
              (
                  '("raw_restricted_fixtures", "sanitized_repository_fixtures", "signed_provenance_transfers", "reviewed_normalization_rules", "qualified_fixtures")',
                  '("raw_restricted_fixtures", "black_box_sanitized_fixtures", "signed_provenance_transfers", "reviewed_normalization_rules", "qualified_fixtures")',
              ),
              (
                  '        fail("H01 implementation status count mismatch")\n    capture = status.get("capture_evidence", {})',
                  '        fail("H01 implementation status count mismatch")\n    if delivered.get("synthetic_side_effect_contracts") != 1:\n        fail("H01 status must bind exactly one synthetic side-effect contract")\n    capture = status.get("capture_evidence", {})',
              ),
              (
                  '        fail("H01 status falsely claims capture/review/qualification evidence")\n    if status.get("qualification", {}).get("status") != "NOT_QUALIFIED":',
                  '        fail("H01 status falsely claims capture/review/qualification evidence")\n    if capture.get("synthetic_contract_fixtures") != 1:\n        fail("H01 status must bind exactly one synthetic contract fixture")\n    if status.get("qualification", {}).get("status") != "NOT_QUALIFIED":',
              ),
          ]
          for old, new in validator_replacements:
              observed = validator_text.count(old)
              if observed != 1:
                  raise SystemExit(
                      f"Oracle validator anchor drift: expected=1 observed={observed} anchor={old!r}"
                  )
              validator_text = validator_text.replace(old, new, 1)
          validator_path.write_text(
              validator_text,
              encoding="utf-8",
              newline="\n",
          )
          changed.append(validator_path.as_posix())

          evidence_paths = {
              "RUNTIME": Path("planning/evidence/h02/reference-model/local/runtime-5eed20260828cafe.json"),
              "TLS": Path("planning/evidence/h02/reference-model/local/tls-5eed20260828cafe.json"),
              "RAFT": Path("planning/evidence/h02/reference-model/local/raft-5eed20260828cafe.json"),
          }
          status_path = Path("qualifications/H02/H02-SEEDED-BEHAVIOR-IMPLEMENTATION-STATUS.json")
          status = json.loads(status_path.read_text(encoding="utf-8"))
          rows = status.get("local_execution", {}).get("reference_models", [])
          rows_by_domain = {row.get("domain"): row for row in rows}
          if set(rows_by_domain) != set(evidence_paths):
              raise SystemExit(
                  f"reference-model hash binding drift: {sorted(rows_by_domain)}"
              )
          for domain, path in evidence_paths.items():
              rows_by_domain[domain]["file_sha256"] = hashlib.sha256(path.read_bytes()).hexdigest()
          status_path.write_text(
              json.dumps(status, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          remaining_owner = [
              path.as_posix() for path in tracked if owner_old in path.read_bytes()
          ]
          if remaining_owner:
              raise SystemExit(
                  f"deprecated owner remains in tracked files: {remaining_owner}"
              )

          remaining_surface = [
              path.as_posix()
              for path in tracked
              if surface_pattern.search(path.read_bytes()) is not None
          ]
          if remaining_surface:
              raise SystemExit(
                  f"invalid Oracle surface identity remains in tracked files: {remaining_surface}"
              )

          remaining_config = [
              path.as_posix()
              for path in tracked
              if config_pattern.search(path.read_bytes()) is not None
          ]
          if remaining_config:
              raise SystemExit(
                  f"invalid Oracle config identity remains in tracked files: {remaining_config}"
              )

          print(
              "applied deterministic source repairs: "
              f"files={len(set(changed))} owner_occurrences={owner_occurrences} "
              f"surface_occurrences={surface_occurrences} config_occurrences={config_occurrences} "
              "endpoint_audit_repairs=1 oracle_validator_repairs=4 reference_hash_bindings=3"
          )
          for path in sorted(set(changed)):
              print(path)
          PY
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-plan.txt

      - name: Validate identity, plan, evidence and H01/H02 semantics
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          run_check() {
            echo "::group::$*"
            if "$@"; then
              echo "PASS: $*"
            else
              failures=$((failures + 1))
              echo "FAIL: $*" >&2
            fi
            echo "::endgroup::"
          }
          run_check python scripts/validate_repository_identity_v1.py
          run_check python scripts/validate_plan_v2.py
          run_check python scripts/validate_plan_v2_extensions.py
          run_check python scripts/validate_provenance_v1.py
          run_check python scripts/validate_evidence_objects_v1.py
          run_check python scripts/validate_oracle_foundation_v1.py
          run_check python scripts/validate_h01_h02_next_v1.py
          run_check python scripts/validate_dependency_bakeoff_v1.py
          run_check python scripts/validate_dependency_research_captures_v1.py
          run_check python scripts/h02_dependency_probe_v1.py validate-matrix
          run_check python -m unittest discover -s tests/oracle -p 'test_*.py' -v
          run_check python -m unittest discover -s tests/platform -p 'test_*.py' -v
          if (( failures != 0 )); then
            echo "validation failures: ${failures}" >&2
            exit 1
          fi

      - name: Retire one-shot workflow and commit exact repair batch
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/apply-repository-identity-closure.yml
          test -n "$(git status --porcelain)"
          git config user.name "heptabao-maintenance-bot"
          git config user.email "heptabao-maintenance-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix(evidence): close identity and Oracle safety blockers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
