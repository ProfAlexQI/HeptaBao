name: tmp-v1-2-2-rustfmt-macos-arm

on:
  push:
    branches: ["codex/tmp-v1.2.2-rustfmt-macos-arm"]
    paths:
      - ".github/workflows/tmp-v1-2-2-rustfmt-macos-arm.yml"
      - "bootstrap/v1-2-2-rustfmt.patch"

permissions:
  contents: write

concurrency:
  group: tmp-v1-2-2-rustfmt-macos-arm
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: macos-15-arm64
    timeout-minutes: 10
    steps:
      - name: Checkout exact transition head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply verified format patch and self-remove
        shell: bash
        env:
          EXACT_BASE: 65a32638b4c2ed677a293b26dc8c0c2ed1ad5cc6
          PATCH_SHA256: dc65bd6e0ff7f2e319648ae96777fabbb9b166ebbf4d6aedf12d861a0f124641
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$EXACT_BASE" HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf '%s  %s\n' "$PATCH_SHA256" bootstrap/v1-2-2-rustfmt.patch | shasum -a 256 -c -
          test "$(git hash-object probes/h02/openraft-tokio/src/bin/durable_store_lab/cluster.rs)" = "1ac36a2bd03b4cd7050296bbcda4ac624024ded4"
          test "$(git hash-object probes/h02/openraft-tokio/src/bin/durable_store_lab/store.rs)" = "e4c2021df0709b5a294e5a5f8648d752056a84e4"
          git apply --check bootstrap/v1-2-2-rustfmt.patch
          git apply bootstrap/v1-2-2-rustfmt.patch
          test "$(git hash-object probes/h02/openraft-tokio/src/bin/durable_store_lab/cluster.rs)" = "0fccaf0d9f3bfe358c75300a8564e0e9ba81eb63"
          test "$(git hash-object probes/h02/openraft-tokio/src/bin/durable_store_lab/store.rs)" = "a4f90d29f981175637668f7fd44e758d6aa9c63c"
          rm -f bootstrap/v1-2-2-rustfmt.patch
          rm -f .github/workflows/tmp-v1-2-2-rustfmt-macos-arm.yml
          git add -A
          git diff --cached --check
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual-paths"
          cat > "$RUNNER_TEMP/expected-paths" <<'PATHS'
          .github/workflows/tmp-v1-2-2-rustfmt-macos-arm.yml
          bootstrap/v1-2-2-rustfmt.patch
          probes/h02/openraft-tokio/src/bin/durable_store_lab/cluster.rs
          probes/h02/openraft-tokio/src/bin/durable_store_lab/store.rs
          PATHS
          sort -o "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/expected-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(h02): normalize durable lifecycle sources"
          git push origin HEAD:codex/tmp-v1.2.2-rustfmt-macos-arm
