name: plan-integrity-v4

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "planning/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "probes/h02/openraft-tokio/**"
      - ".github/workflows/**"
  push:
    branches:
      - "codex/plan-v1.2-execution-contracts-gap-closure-v1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-integrity-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan-and-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact immutable source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'repository=%s\nref=%s\ncommit=%s\ntree=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF" "$SOURCE_SHA" "$(git rev-parse 'HEAD^{tree}')" \
            | tee "$RUNNER_TEMP/source-binding.txt"
      - name: Install exact Python validation dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt
      - run: python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt
      - name: Validate V1.1 history and V1.2 current contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_plan_v2.py
          python3 scripts/validate_plan_v2_extensions.py
          python3 scripts/validate_plan_v1_2.py
          python3 scripts/validate_h01_h02_next_v1.py
          python3 scripts/validate_h02_candidate_adapters_v1.py
          python3 scripts/validate_h02_openraft_inmemory_cluster_v1.py
          python3 scripts/validate_h02_openraft_fault_lab_v1.py
          python3 scripts/validate_h02_blocker_closure_v1.py
      - name: Execute every Python regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python3 -m unittest discover -s tests/platform -p 'test_*.py' -v
          python3 -m unittest discover -s tests/plan -p 'test_*.py' -v
      - name: Resolve canonical project state
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/render_canonical_project_state_v1.py \
            --root . \
            --repository "$GITHUB_REPOSITORY" \
            --ref "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
            --commit "$SOURCE_SHA" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --environment-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --runner-name "$RUNNER_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --job-id "$GITHUB_JOB" \
            --require-clean \
            --output "$RUNNER_TEMP/canonical-project-state.resolved.json"
          python3 -m json.tool "$RUNNER_TEMP/canonical-project-state.resolved.json" >/dev/null
      - name: Upload exact V1.2 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-v1.2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-binding.txt
            ${{ runner.temp }}/canonical-project-state.resolved.json
          if-no-files-found: warn
          retention-days: 30

  root-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.98
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Format, test and lint root workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  openraft-exact-graph-and-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      TOOLCHAINS: "1.88.0 1.98.0"
      SEEDS: "0x5eed20260828cafe 0x8badf00d12345678 0xd15ea5e5cafef00d"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact effective toolchains
        shell: bash
        run: |
          set -euo pipefail
          for toolchain in $TOOLCHAINS; do
            rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          done
      - name: Bind committed dependency graph
        shell: bash
        run: |
          set -euo pipefail
          manifest=probes/h02/openraft-tokio/Cargo.toml
          lock=probes/h02/openraft-tokio/Cargo.lock
          test -s "$lock"
          cargo +1.88.0 metadata --locked --format-version 1 --manifest-path "$manifest" \
            > "$RUNNER_TEMP/openraft-metadata.json"
          python3 scripts/validate_plan_v1_2.py
      - name: Compile, test and lint exact graph
        shell: bash
        run: |
          set -euo pipefail
          manifest=probes/h02/openraft-tokio/Cargo.toml
          cargo +1.98.0 fmt --manifest-path "$manifest" --all -- --check
          for toolchain in $TOOLCHAINS; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/openraft-target-$toolchain"
            cargo +"$toolchain" test --locked --all-targets --manifest-path "$manifest"
            cargo +"$toolchain" clippy --locked --all-targets --manifest-path "$manifest" -- -D warnings
          done
      - name: Execute candidate, cluster, fault and durable matrices
        shell: bash
        run: |
          set -euo pipefail
          manifest=probes/h02/openraft-tokio/Cargo.toml
          mkdir -p "$RUNNER_TEMP/results"
          for toolchain in $TOOLCHAINS; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/openraft-target-$toolchain"
            for seed in $SEEDS; do
              suffix="${toolchain}-${seed#0x}"
              cargo +"$toolchain" run --quiet --locked --manifest-path "$manifest" \
                --bin heptabao-h02-openraft-inmemory-cluster -- --seed "$seed" \
                > "$RUNNER_TEMP/results/inmemory-$suffix.jsonl"
              cargo +"$toolchain" run --quiet --locked --manifest-path "$manifest" \
                --bin heptabao-h02-openraft-fault-lab -- --mode hostile-snapshot-parent --seed "$seed" \
                > "$RUNNER_TEMP/results/hostile-$suffix.json"
              cargo +"$toolchain" run --quiet --locked --manifest-path "$manifest" \
                --bin heptabao-h02-openraft-blocker-closure-lab -- --mode all --seed "$seed" \
                > "$RUNNER_TEMP/results/blocker-$suffix.json"
              cargo +"$toolchain" run --quiet --locked --manifest-path "$manifest" \
                --bin heptabao-h02-openraft-durable-store-lab -- --seed "$seed" \
                > "$RUNNER_TEMP/results/durable-$suffix.json"
              python3 - "$RUNNER_TEMP/results/durable-$suffix.json" <<'PY'
          import json
          import sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          assert value["status"] == "EXECUTED_PASS", value
          assert len(value["cases"]) == 7, value
          assert all(case["status"] == "PASS" for case in value["cases"]), value
          assert value["scope"]["state_publish_after_durable_write"] is True
          assert value["scope"]["snapshot_state_atomic_bundle_publish"] is True
          assert value["qualification"] is False
          assert value["selection_effect"] == "NONE"
          assert value["authority_effect"] == "NONE"
          PY
            done
          done
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Upload exact diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openraft-v1.2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openraft-metadata.json
            ${{ runner.temp }}/results/
          if-no-files-found: warn
          retention-days: 30

  authority-sentinel:
    needs: [plan-and-python, root-rust, openraft-exact-graph-and-runtime]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require technical lanes and keep authority closed
        env:
          PLAN: ${{ needs.plan-and-python.result }}
          ROOT_RUST: ${{ needs.root-rust.result }}
          OPENRAFT: ${{ needs.openraft-exact-graph-and-runtime.result }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          test "$ROOT_RUST" = success
          test "$OPENRAFT" = success
          echo "V1.2 exact-head technical gates passed; qualification=false compatibility=false selection=0 authority=NONE"
