name: v1.4.2-bootstrap-import-fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - codex/plan-v1.4-full-gap-closure-v1
    paths:
      - .github/workflows/v1.4.2-bootstrap-import-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-verify-publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact staged head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact staged source
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test "${{ github.event.pull_request.head.ref }}" = "codex/plan-v1.4.2-recovery-foundation-v1"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf '%s\n' "$expected" >"$RUNNER_TEMP/source-head.txt"

      - name: Install exact Python dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Extract the audited rescue scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/v1.4.2-bootstrap-test-fix.yml')
              .read_text(encoding='utf-8')
          )
          steps = workflow['jobs']['repair-verify-publish']['steps']
          required = {
              'prepare': 'Install dependencies and extract audited bootstrap scripts',
              'materialize': 'Materialize digest-bound candidate and repair Drop-safe tests',
              'freeze': 'Format and freeze exact clean candidate',
              'delta': 'Verify exact 18-path final delta',
              'current': 'Validate current V1.4.2 source and regressions',
              'frozen': 'Replay frozen V1.4.1 Python and Rust gates',
              'publish': 'Confirm non-authority and fast-forward publish',
          }
          by_name = {step.get('name'): step for step in steps}
          root = Path(os.environ['RUNNER_TEMP'])
          for key, name in required.items():
              step = by_name.get(name)
              if not isinstance(step, dict) or not isinstance(step.get('run'), str):
                  raise SystemExit(f'missing audited rescue script: {name}')
              (root / f'v142-overlay-{key}.sh').write_text(
                  step['run'], encoding='utf-8'
              )
          PY
          bash "$RUNNER_TEMP/v142-overlay-prepare.sh"

      - name: Materialize candidate and move test-only anchor error import
        shell: bash
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/v142-overlay-materialize.sh"
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/heptabao-recovery-core/src/lib.rs')
          source = path.read_text(encoding='utf-8')
          before_top = (
              '    AnchorAuthenticatorId, AnchorContractError, AnchorRevision, '
              'CheckpointDigest,\n'
          )
          after_top = (
              '    AnchorAuthenticatorId, AnchorRevision, CheckpointDigest,\n'
          )
          before_test = (
              '        AnchorAdvanceReceipt, AnchorCoordinator, '
              'CheckpointAuthenticator, RollbackAnchor,\n'
          )
          after_test = (
              '        AnchorAdvanceReceipt, AnchorContractError, AnchorCoordinator,\n'
              '        CheckpointAuthenticator, RollbackAnchor,\n'
          )
          if source.count(before_top) != 1:
              raise SystemExit('top-level anchor import shape drifted')
          if source.count(before_test) != 1:
              raise SystemExit('test anchor import shape drifted')
          source = source.replace(before_top, after_top, 1)
          source = source.replace(before_test, after_test, 1)
          path.write_text(source, encoding='utf-8')
          PY
          rm -f .github/workflows/v1.4.2-bootstrap-import-fix.yml
          test ! -e .github/workflows/v1.4.2-bootstrap-exact-candidate.yml
          test ! -e .github/workflows/v1.4.2-bootstrap-test-fix.yml
          test ! -e .github/workflows/v1.4.2-bootstrap-import-fix.yml
          test ! -e .bootstrap/v1.4.2

      - name: Format and freeze exact clean candidate
        shell: bash
        run: bash "$RUNNER_TEMP/v142-overlay-freeze.sh"

      - name: Verify exact 18-path final delta
        shell: bash
        run: bash "$RUNNER_TEMP/v142-overlay-delta.sh"

      - name: Validate current V1.4.2 source and regressions
        shell: bash
        run: bash "$RUNNER_TEMP/v142-overlay-current.sh"

      - name: Replay frozen V1.4.1 Python and Rust gates
        shell: bash
        run: bash "$RUNNER_TEMP/v142-overlay-frozen.sh"

      - name: Capture current V1.4.2 Rust diagnostics
        id: current_rust
        continue-on-error: true
        shell: bash
        run: |
          set +e
          bash "$RUNNER_TEMP/v142-rust.sh" >"$RUNNER_TEMP/v142-rust.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/v142-rust.log"
          printf 'status=%s\n' "$status" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact Rust diagnostic package
        if: ${{ always() && steps.current_rust.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v1.4.2-rust-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/v142-rust.log
            crates/heptabao-key-lifecycle/src/lib.rs
            crates/heptabao-rollback-anchor/src/lib.rs
            crates/heptabao-recovery-core/src/lib.rs
          if-no-files-found: error
          retention-days: 3

      - name: Require current V1.4.2 Rust success
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.current_rust.outputs.status }}" = "0"

      - name: Confirm non-authority and fast-forward publish
        shell: bash
        run: bash "$RUNNER_TEMP/v142-overlay-publish.sh"

      - name: Emit exact result
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## V1.4.2 exact clean candidate published'
            echo
            echo "- commit: `$(git rev-parse HEAD)`"
            echo "- tree: `$(git rev-parse HEAD^{tree})`"
            echo '- exact additive paths: 18'
            echo '- current and frozen Python regressions: PASS'
            echo '- current and frozen Rust 1.98 gates: PASS'
            echo '- bootstrap inputs and write workflows: absent'
            echo '- authority effect: NONE'
          } >>"$GITHUB_STEP_SUMMARY"
