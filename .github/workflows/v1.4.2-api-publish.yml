name: v1.4.2-api-publish

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - codex/plan-v1.4-full-gap-closure-v1
    paths:
      - .github/workflows/v1.4.2-api-publish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact staged head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact staged source
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test "${{ github.event.pull_request.head.ref }}" = "codex/plan-v1.4.2-recovery-foundation-v1"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf '%s\n' "$expected" >"$RUNNER_TEMP/source-head.txt"

      - name: Install exact Python dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Extract audited import-fix scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/v1.4.2-bootstrap-import-fix.yml')
              .read_text(encoding='utf-8')
          )
          steps = workflow['jobs']['repair-verify-publish']['steps']
          required = {
              'prepare': 'Extract the audited rescue scripts',
              'materialize': 'Materialize candidate and move test-only anchor error import',
              'freeze': 'Format and freeze exact clean candidate',
              'delta': 'Verify exact 18-path final delta',
              'current': 'Validate current V1.4.2 source and regressions',
              'frozen': 'Replay frozen V1.4.1 Python and Rust gates',
          }
          by_name = {step.get('name'): step for step in steps}
          root = Path(os.environ['RUNNER_TEMP'])
          for key, name in required.items():
              step = by_name.get(name)
              if not isinstance(step, dict) or not isinstance(step.get('run'), str):
                  raise SystemExit(f'missing audited import-fix script: {name}')
              (root / f'v142-api-{key}.sh').write_text(
                  step['run'], encoding='utf-8'
              )
          PY
          bash "$RUNNER_TEMP/v142-api-prepare.sh"

      - name: Materialize fully repaired clean candidate
        shell: bash
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/v142-api-materialize.sh"
          rm -f .github/workflows/v1.4.2-api-publish.yml
          test ! -e .github/workflows/v1.4.2-bootstrap-exact-candidate.yml
          test ! -e .github/workflows/v1.4.2-bootstrap-test-fix.yml
          test ! -e .github/workflows/v1.4.2-bootstrap-import-fix.yml
          test ! -e .github/workflows/v1.4.2-api-publish.yml
          test ! -e .bootstrap/v1.4.2

      - name: Format and freeze exact clean candidate
        shell: bash
        run: bash "$RUNNER_TEMP/v142-api-freeze.sh"

      - name: Verify exact 18-path final delta
        shell: bash
        run: bash "$RUNNER_TEMP/v142-api-delta.sh"

      - name: Validate current V1.4.2 source and regressions
        shell: bash
        run: bash "$RUNNER_TEMP/v142-api-current.sh"

      - name: Replay frozen V1.4.1 Python and Rust gates
        shell: bash
        run: bash "$RUNNER_TEMP/v142-api-frozen.sh"

      - name: Test and strictly lint current V1.4.2 workspace
        shell: bash
        run: bash "$RUNNER_TEMP/v142-rust.sh"

      - name: Confirm non-authority and publish through Git data API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request
          from pathlib import Path
          import yaml

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          branch = 'codex/plan-v1.4.2-recovery-foundation-v1'
          base_tree = 'a83b78d1f2312f495ed82c2af1071342676380f2'
          source_head = Path(os.environ['RUNNER_TEMP'], 'source-head.txt').read_text(
              encoding='utf-8'
          ).strip()
          expected_paths = [
              'Cargo.toml',
              'Cargo.lock',
              'crates/heptabao-key-lifecycle/Cargo.toml',
              'crates/heptabao-key-lifecycle/src/lib.rs',
              'crates/heptabao-rollback-anchor/Cargo.toml',
              'crates/heptabao-rollback-anchor/src/lib.rs',
              'crates/heptabao-recovery-core/Cargo.toml',
              'crates/heptabao-recovery-core/src/lib.rs',
              'docs/plan/HEPTABAO_PLAN_V1_4_2_KEY_LIFECYCLE_ROLLBACK_AND_RECOVERY.md',
              'docs/recovery/HEPTABAO_ANCHORED_RECOVERY_CONTRACT_V1.md',
              'planning/HEPTABAO_BLOCKER_REGISTER_V1_4_2.yaml',
              'planning/HEPTABAO_NORMATIVE_DOCUMENT_MANIFEST_V1_4_2.yaml',
              'planning/HEPTABAO_V1_4_2_ANCHORED_RECOVERY_STATUS.yaml',
              'schemas/heptabao_normative_document_manifest_v1_4_2.schema.json',
              'scripts/validate_plan_v1_4_2.py',
              'scripts/validate_v1_4_2_inherited_surface.py',
              'tests/plan/test_plan_v1_4_2.py',
              '.github/workflows/plan-v1.4.2-anchored-recovery.yml',
          ]

          status = yaml.safe_load(
              Path('planning/HEPTABAO_V1_4_2_ANCHORED_RECOVERY_STATUS.yaml')
              .read_text(encoding='utf-8')
          )
          expected_claims = {
              'qualification': False,
              'compatibility_claim': False,
              'selected_candidates': [],
              'selection_effect': 'NONE',
              'production_authority': False,
              'migration_authority': False,
              'release_authority': False,
              'authority_effect': 'NONE',
          }
          if status.get('claims') != expected_claims:
              raise SystemExit('V1.4.2 authority boundary drifted')

          def api(path: str, method: str = 'GET', payload=None):
              data = None
              if payload is not None:
                  data = json.dumps(payload, separators=(',', ':')).encode('utf-8')
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}{path}',
                  data=data,
                  method=method,
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.loads(response.read().decode('utf-8'))
              except urllib.error.HTTPError as error:
                  body = error.read().decode('utf-8', errors='replace')
                  raise SystemExit(
                      f'GitHub API {method} {path} failed: {error.code}: {body}'
                  ) from error

          remote = api(f'/git/ref/heads/{branch}')
          if remote.get('object', {}).get('sha') != source_head:
              raise SystemExit('remote branch moved before exact API publication')

          tree_entries = []
          for path in expected_paths:
              data = Path(path).read_bytes()
              blob = api(
                  '/git/blobs',
                  'POST',
                  {
                      'content': base64.b64encode(data).decode('ascii'),
                      'encoding': 'base64',
                  },
              )
              sha = blob.get('sha')
              local_sha = subprocess.check_output(
                  ['git', 'hash-object', path], text=True
              ).strip()
              if sha != local_sha:
                  raise SystemExit(f'GitHub blob SHA mismatch for {path}')
              tree_entries.append(
                  {'path': path, 'mode': '100644', 'type': 'blob', 'sha': sha}
              )

          tree = api(
              '/git/trees',
              'POST',
              {'base_tree': base_tree, 'tree': tree_entries},
          )
          tree_sha = tree.get('sha')
          expected_tree = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^{tree}'], text=True
          ).strip()
          if tree_sha != expected_tree:
              raise SystemExit(
                  f'GitHub tree mismatch: expected {expected_tree}, got {tree_sha}'
              )

          commit = api(
              '/git/commits',
              'POST',
              {
                  'message': (
                      'feat(v1.4.2): add anchored recovery and key lifecycle foundation\n\n'
                      'Exact current and frozen Python/Rust 1.98 gates passed.\n\n'
                      'qualification=false\n'
                      'compatibility_claim=false\n'
                      'selection_effect=NONE\n'
                      'authority_effect=NONE'
                  ),
                  'tree': tree_sha,
                  'parents': [source_head],
              },
          )
          commit_sha = commit.get('sha')
          if not isinstance(commit_sha, str) or len(commit_sha) != 40:
              raise SystemExit('GitHub did not return the exact candidate commit SHA')

          api(
              f'/git/refs/heads/{branch}',
              'PATCH',
              {'sha': commit_sha, 'force': False},
          )
          final_ref = api(f'/git/ref/heads/{branch}')
          if final_ref.get('object', {}).get('sha') != commit_sha:
              raise SystemExit('published branch does not point to exact candidate commit')
          print(f'published_commit={commit_sha}')
          print(f'published_tree={tree_sha}')
          PY

      - name: Emit exact result
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## V1.4.2 exact clean candidate published through Git data API'
            echo
            echo "- local candidate tree: `$(git rev-parse HEAD^{tree})`"
            echo '- exact additive paths: 18'
            echo '- current and frozen Python regressions: PASS'
            echo '- current and frozen Rust 1.98 gates: PASS'
            echo '- bootstrap inputs and write workflows: absent'
            echo '- authority effect: NONE'
          } >>"$GITHUB_STEP_SUMMARY"
