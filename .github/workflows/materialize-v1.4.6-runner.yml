name: Materialize V1.4.6 authoritative recovery runner

on:
  push:
    branches:
      - codex/plan-v1.4.6-authoritative-recovery-closure-v1

permissions:
  contents: write

jobs:
  diagnose:
    if: "${{ github.event.head_commit.message == 'chore(bootstrap): [diagnose-v1.4.6-storage-intent]' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply patch and capture compiler diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_v1_4_6_storage_intent.py
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo +1.98.0 fmt --all
          set +e
          cargo +1.98.0 test --locked --workspace --all-targets > /tmp/v146-storage-intent.log 2>&1
          status=$?
          set -e
          mkdir -p .diagnostics
          {
            printf 'exit_status=%s\n' "$status"
            cat /tmp/v146-storage-intent.log
          } > .diagnostics/v1.4.6-storage-intent.txt
          git config user.name "heptabao-v1.4.6-diagnostics"
          git config user.email "heptabao-v1.4.6-diagnostics@users.noreply.github.com"
          git add .diagnostics/v1.4.6-storage-intent.txt
          git commit -m "chore(diagnostics): capture V1.4.6 storage intent failure"
          git push origin HEAD:codex/plan-v1.4.6-authoritative-recovery-closure-v1
          exit "$status"
