name: Materialize V1.4.6 authoritative recovery runner

on:
  push:
    branches:
      - codex/plan-v1.4.6-authoritative-recovery-closure-v1

permissions:
  contents: write

jobs:
  validate:
    if: "${{ github.event.head_commit.message == 'chore(bootstrap): [run-v1.4.6-file-provider-matrix-1]' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate real-provider crash matrix and persist formatting or diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          python3 -m pip install --disable-pip-version-check pyyaml
          cargo +1.98.0 generate-lockfile
          cargo +1.98.0 fmt --all
          mkdir -p .diagnostics
          log=.diagnostics/v1.4.6-file-provider-matrix-1.txt
          : > "$log"
          failed=0
          run_check() {
            label="$1"
            shift
            (
              printf '\n===== %s =====\n' "$label"
              "$@"
              status=$?
              printf 'exit_status=%s\n' "$status"
              exit "$status"
            ) >> "$log" 2>&1 || failed=1
          }
          run_check cargo-fmt cargo +1.98.0 fmt --all -- --check
          run_check cargo-test cargo +1.98.0 test --locked --workspace --all-targets
          run_check cargo-clippy cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          run_check validator-v145 python3 scripts/validate_plan_v1_4_5.py --root .
          run_check hostile-v145 python3 tests/plan/test_plan_v1_4_5.py
          git config user.name "heptabao-v1.4.6-materializer"
          git config user.email "heptabao-v1.4.6-materializer@users.noreply.github.com"
          if [ "$failed" -eq 0 ]; then
            rm -f "$log"
            git add Cargo.lock crates/heptabao-journaled-core
            git commit -m "test(v1.4.6): verify file-provider recovery across reopen"
          else
            git add "$log"
            git commit -m "chore(diagnostics): capture V1.4.6 file-provider matrix failure"
          fi
          git push origin HEAD:codex/plan-v1.4.6-authoritative-recovery-closure-v1
          exit "$failed"
