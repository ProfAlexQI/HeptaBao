name: Materialize V1.4.6 authoritative recovery runner

on:
  push:
    branches:
      - codex/plan-v1.4.6-authoritative-recovery-closure-v1

permissions:
  contents: write

jobs:
  diagnose:
    if: "${{ github.event.head_commit.message == 'chore(bootstrap): [diagnose-v1.4.6-operation-recovery-1]' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Capture materializer precondition failure
        shell: bash
        run: |
          set -u
          mkdir -p .diagnostics
          log=.diagnostics/v1.4.6-operation-recovery-materializer-1.txt
          set +e
          python3 scripts/apply_v1_4_6_operation_recovery.py > "$log" 2>&1
          status=$?
          set -e
          printf '\nexit_status=%s\n' "$status" >> "$log"
          git config user.name "heptabao-v1.4.6-diagnostics"
          git config user.email "heptabao-v1.4.6-diagnostics@users.noreply.github.com"
          git add "$log"
          git commit -m "chore(diagnostics): capture V1.4.6 operation materializer failure"
          git push origin HEAD:codex/plan-v1.4.6-authoritative-recovery-closure-v1
          exit "$status"
