name: h02-closure-macos-v2

on:
  push:
    branches: ["exec/h02-closure-macos-v2"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h02-closure-macos-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: "312e0ef9c98cd3152359dcf53b74505a94e96647"
  SEEDS: "0x5eed20260828cafe 0x8badf00d12345678 0xd15ea5e5cafef00d"

jobs:
  macos-arm64-independent:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Checkout exact technical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/results"
          printf 'source_commit=%s\nsource_tree=%s\nrunner=%s\nos=%s\narch=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" \
            | tee "$RUNNER_TEMP/results/source-binding.txt"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-plan.txt

      - name: Validate plan and evidence contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_plan_v2.py
          python scripts/validate_plan_v2_extensions.py
          python scripts/validate_provenance_v1.py
          python scripts/validate_evidence_objects_v1.py
          python scripts/validate_oracle_foundation_v1.py
          python scripts/validate_h01_h02_next_v1.py
          python scripts/validate_dependency_bakeoff_v1.py
          python scripts/validate_dependency_research_captures_v1.py
          python scripts/validate_dependency_registry_evidence_v1.py
          python scripts/validate_dependency_execution_profiles_v1.py
          python scripts/validate_h02_candidate_adapters_v1.py
          python scripts/validate_h02_openraft_inmemory_cluster_v1.py
          python scripts/validate_h02_openraft_fault_lab_v1.py
          python scripts/validate_h02_blocker_closure_v1.py
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v

      - name: Install exact Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          for toolchain in 1.71.0 1.85.0 1.98.0; do
            rustup toolchain install "$toolchain" --profile minimal
            rustup run "$toolchain" rustc --version --verbose
            rustup run "$toolchain" cargo --version --verbose
          done

      - name: Validate main Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.98.0 cargo fmt --all --check
          rustup run 1.98.0 cargo test --workspace --all-targets --locked
          rustup run 1.98.0 cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Copy full probe tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/h02-probes"
          mkdir -p "$RUNNER_TEMP/h02-probes"
          cp -a probes/h02/. "$RUNNER_TEMP/h02-probes/"
          test -f "$RUNNER_TEMP/h02-probes/rustls-public-fixtures.rs"

      - name: Compile and execute exact candidate profiles
        shell: bash
        run: |
          set -euo pipefail
          profiles=(
            'tokio-minimal:1.71.0'
            'tokio-minimal:1.98.0'
            'rustls-ring:1.71.0'
            'rustls-ring:1.98.0'
            'rustls-aws-lc:1.71.0'
            'rustls-aws-lc:1.98.0'
            'openraft-tokio:1.85.0'
            'openraft-tokio:1.98.0'
          )
          for item in "${profiles[@]}"; do
            subdir="${item%%:*}"
            toolchain="${item##*:}"
            manifest="$RUNNER_TEMP/h02-probes/$subdir/Cargo.toml"
            export CARGO_TARGET_DIR="$RUNNER_TEMP/targets/$subdir-$toolchain"
            rm -f "$RUNNER_TEMP/h02-probes/$subdir/Cargo.lock"
            rustup run "$toolchain" cargo generate-lockfile --manifest-path "$manifest"
            rustup run "$toolchain" cargo test --locked --all-targets --manifest-path "$manifest"
            for seed in $SEEDS; do
              seed_name="${seed#0x}"
              out="$RUNNER_TEMP/results/$subdir-$toolchain-$seed_name.jsonl"
              rustup run "$toolchain" cargo run --quiet --locked --manifest-path "$manifest" -- --seed "$seed" >"$out"
              test -s "$out"
            done
          done

      - name: Execute real OpenRaft cluster, hostile snapshot and linearizability cases
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/h02-probes/openraft-tokio/Cargo.toml"
          for toolchain in 1.85.0 1.98.0; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/targets/openraft-tokio-$toolchain"
            for seed in $SEEDS; do
              seed_name="${seed#0x}"
              rustup run "$toolchain" cargo run --quiet --locked --manifest-path "$manifest" \
                --bin heptabao-h02-openraft-inmemory-cluster -- --seed "$seed" \
                >"$RUNNER_TEMP/results/cluster-$toolchain-$seed_name.jsonl"
              rustup run "$toolchain" cargo run --quiet --locked --manifest-path "$manifest" \
                --bin heptabao-h02-openraft-fault-lab -- --mode hostile-snapshot-parent --seed "$seed" \
                >"$RUNNER_TEMP/results/hostile-$toolchain-$seed_name.json"
              rustup run "$toolchain" cargo run --quiet --locked --manifest-path "$manifest" \
                --bin heptabao-h02-openraft-fault-lab -- --mode linearizability-history --seed "$seed" \
                >"$RUNNER_TEMP/results/history-$toolchain-$seed_name.json"
              python scripts/h02_linearizability_checker_v1.py check \
                --history "$RUNNER_TEMP/results/history-$toolchain-$seed_name.json" \
                --output "$RUNNER_TEMP/results/linear-$toolchain-$seed_name.json"
              rustup run "$toolchain" cargo run --quiet --locked --manifest-path "$manifest" \
                --bin heptabao-h02-openraft-blocker-closure-lab -- --mode durable-faults --seed "$seed" \
                >"$RUNNER_TEMP/results/durable-$toolchain-$seed_name.json"
              rustup run "$toolchain" cargo run --quiet --locked --manifest-path "$manifest" \
                --bin heptabao-h02-openraft-blocker-closure-lab -- --mode clock-faults --seed "$seed" \
                >"$RUNNER_TEMP/results/clock-$toolchain-$seed_name.json"
            done
          done

      - name: Rehash public dependency packages
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r package version expected; do
            file="$RUNNER_TEMP/$package-$version.crate"
            curl --fail --location --proto '=https' --max-redirs 5 --max-time 180 \
              --output "$file" "https://static.crates.io/crates/$package/$package-$version.crate"
            actual="$(python - "$file" <<'PY'
          import hashlib, sys
          h = hashlib.sha256()
          with open(sys.argv[1], 'rb') as f:
              for chunk in iter(lambda: f.read(1024 * 1024), b''):
                  h.update(chunk)
          print(h.hexdigest())
          PY
          )"
            test "$actual" = "$expected"
            printf '{"package":"%s","version":"%s","sha256":"%s","matches_registry":true,"runner":"%s","os":"%s","arch":"%s","qualification":false,"selection_effect":"NONE","authority_effect":"NONE"}\n' \
              "$package" "$version" "$actual" "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" \
              >"$RUNNER_TEMP/results/rehash-$package-$version.json"
            rm -f "$file"
          done <<'EOF'
          tokio	1.53.1	202caea871b69668250d242070849eb495be178ed697a3e98aebce5bc81a0bed
          rustls	0.23.43	0283386ce02abc0151e1761d08802dfe86c173b0b494af5cbc086574e453da06
          openraft	0.10.0-alpha.33	ba6e911fb3c97faeecb8324b803a37d77a7387d02ee7019fc2a9777569e7f7b8
          EOF

      - name: Assert no qualification or authority is inferred
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, yaml
          flags = yaml.safe_load(open('planning/AUTHORITY_FLAGS_V2.yaml', encoding='utf-8'))['flags']
          assert not [name for name, value in flags.items() if value and name != 'implementation_started']
          h02 = json.load(open('qualifications/H02/H02-IMPLEMENTATION-STATUS.json', encoding='utf-8'))
          assert h02['qualification']['status'] == 'NOT_QUALIFIED'
          assert h02['authority_effect'] == 'NONE'
          print('independent technical reproduction complete; qualification and authority remain closed')
          PY

      - name: Upload independent diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h02-closure-macos-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: warn
          retention-days: 30
