name: execute-v1.3.1-final-repository-closure-arm64

on:
  push:
    branches:
      - "exec/v1-3-1-final-repository-closure-arm64-v1"

permissions:
  contents: write

concurrency:
  group: execute-v1.3.1-final-repository-closure-arm64
  cancel-in-progress: true

env:
  TARGET_BRANCH: codex/plan-v1.3-gap-closure-v2
  EXPECTED_TARGET_HEAD: 41245f24f09c67a3da76d1a37c119d447e41383c

jobs:
  close:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Checkout exact executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact target lease and apply final repository closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TARGET_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_TARGET_HEAD"
          git checkout --detach "$EXPECTED_TARGET_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              value = read(path)
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:100]!r}")
              write(path, value.replace(old, new, 1))

          def append_once(path: str, token: str, addition: str) -> None:
              value = read(path)
              if token in value:
                  return
              write(path, value.rstrip() + "\n\n" + addition.strip() + "\n")

          # ----- Protocol audit phases -----
          replace_once(
              "crates/heptabao-protocol/src/lib.rs",
              """pub enum AuditPhase {
              RequestAccepted,
              RequestRejected,
              ResponsePrepared,
              ResponseCommitted,
              ResponseAuditFailedAfterCommit,
          }
          """,
              """pub enum AuditPhase {
              RequestAccepted,
              RequestRejected,
              ResponsePrepared,
              ResponseCommitted,
              ResponseAuditFailedAfterCommit,
              ResponseDelivered,
              ResponseDeliveryFailed,
          }
          """,
          )

          # ----- Audit correlation and byte-owned LIST response -----
          replace_once(
              "crates/heptabao-p0-server/src/lib.rs",
              """pub trait AuditSink: fmt::Debug + Send {
              fn record(&mut self, event: &AuditEvent) -> Result<(), AuditError>;
          }
          """,
              """pub trait AuditSink: fmt::Debug + Send {
              fn record(&mut self, event: &AuditEvent) -> Result<(), AuditError>;

              fn record_request_correlation(
                  &mut self,
