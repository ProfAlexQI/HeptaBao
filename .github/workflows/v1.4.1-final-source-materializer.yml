name: v1.4.1-final-source-materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - codex/v1.4-durable-single-node-foundation-v1
    paths:
      - .github/workflows/v1.4.1-final-source-materializer.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-publish-exact-source:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind source and head branch
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "${{ github.event.pull_request.head.ref }}" = "codex/plan-v1.4-full-gap-closure-v1"

      - name: Apply bounded semantic repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          journal = Path('crates/heptabao-single-node-journal/src/lib.rs')
          source = journal.read_text(encoding='utf-8')
          before = '            let metadata = entry.metadata().map_err(FileJournalError::Io)?;'
          after = (
              '            let metadata = fs::symlink_metadata(entry.path())\n'
              '                .map_err(FileJournalError::Io)?;'
          )
          if source.count(before) != 1:
              raise SystemExit('directory metadata source shape drifted')
          source = source.replace(before, after, 1)
          symlink_call = 'fs::symlink_metadata(entry.path())?.file_type().is_symlink()'
          if source.count(symlink_call) != 2:
              raise SystemExit('symlink guard source shape drifted')
          source = source.replace(symlink_call, 'metadata.file_type().is_symlink()')
          before_parse = (
              '            let sequence = parse_entry_file_name(name)?\n'
              '                .ok_or(FileJournalError::UnexpectedEntry)?;'
          )
          after_parse = (
              '            let sequence = parse_entry_file_name(name)\n'
              '                .map_err(|_| FileJournalError::CorruptJournal)?\n'
              '                .ok_or(FileJournalError::UnexpectedEntry)?;'
          )
          if source.count(before_parse) != 1:
              raise SystemExit('entry-name call source shape drifted')
          source = source.replace(before_parse, after_parse, 1)
          helper_pattern = re.compile(
              r'fn parse_entry_file_name\(name: &str\).*?\n}\n\nfn encode_marker',
              re.DOTALL,
          )
          helper_replacement = '''fn parse_entry_file_name(name: &str) -> Result<Option<JournalSequence>, DecodeError> {
              let Some(digits) = name
                  .strip_prefix("entry-")
                  .and_then(|value| value.strip_suffix(".hbj"))
              else {
                  return Ok(None);
              };
              if digits.len() != 20 || !digits.bytes().all(|byte| byte.is_ascii_digit()) {
                  return Err(DecodeError::InvalidLength);
              }
              let value = digits
                  .parse::<u64>()
                  .map_err(|_| DecodeError::InvalidSequence)?;
              let sequence =
                  JournalSequence::new(value).map_err(|_| DecodeError::InvalidSequence)?;
              if entry_file_name(sequence) != name {
                  return Err(DecodeError::InvalidSequence);
              }
              Ok(Some(sequence))
          }

          fn encode_marker'''
          source, substitutions = helper_pattern.subn(helper_replacement, source, count=1)
          if substitutions != 1:
              raise SystemExit('entry-name helper source shape drifted')
          journal.write_text(source, encoding='utf-8')

          core = Path('crates/heptabao-journaled-core/src/lib.rs')
          source = core.read_text(encoding='utf-8')
          source, call_count = re.subn(
              r'detail_code\(([^)\n]+)\)\?',
              r'detail_code(\1).map_err(JournaledCoreError::OperationContract)?',
              source,
          )
          if call_count < 4:
              raise SystemExit(f'detail-code call count drifted: {call_count}')
          detail_pattern = re.compile(
              r'fn detail_code<S, B, J>\(.*?\n}\n\n#\[derive\(Clone, Debug, Eq, PartialEq\)\]',
              re.DOTALL,
          )
          detail_replacement = '''fn detail_code(value: &str) -> Result<StableDetailCode, OperationContractError> {
              StableDetailCode::new(value.to_owned())
          }

          #[derive(Clone, Debug, Eq, PartialEq)]'''
          source, substitutions = detail_pattern.subn(detail_replacement, source, count=1)
          if substitutions != 1:
              raise SystemExit('generic detail-code helper source shape drifted')
          core.write_text(source, encoding='utf-8')
          PY

      - name: Install exact Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Format test and strictly lint exact candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Remove all temporary source-export and materializer workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/v1.4.1-source-export.yml \
            .github/workflows/v1.4.1-rust-materializer.yml \
            .github/workflows/v1.4.1-rust-materializer-v2.yml \
            .github/workflows/v1.4.1-final-source-materializer.yml

      - name: Publish exact verified development source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "$(printf '%s\n' \
            .github/workflows/v1.4.1-final-source-materializer.yml \
            .github/workflows/v1.4.1-rust-materializer-v2.yml \
            .github/workflows/v1.4.1-rust-materializer.yml \
            .github/workflows/v1.4.1-source-export.yml \
            crates/heptabao-journal-api/src/lib.rs \
            crates/heptabao-journaled-core/src/lib.rs \
            crates/heptabao-operation-ledger/src/lib.rs \
            crates/heptabao-single-node-journal/src/lib.rs | sort | tr '\n' ' ')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(v1.4.1): publish Rust 1.98-verified journal ledger source"
          git push origin HEAD:codex/plan-v1.4-full-gap-closure-v1
