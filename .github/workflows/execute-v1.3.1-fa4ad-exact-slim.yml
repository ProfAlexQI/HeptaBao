name: execute-v1.3.1-fa4ad-exact-slim

on:
  push:
    branches:
      - "exec/v1-3-1-fa4ad-exact-slim-v1"

permissions:
  contents: read

concurrency:
  group: execute-v1.3.1-fa4ad-exact-slim
  cancel-in-progress: true

env:
  SOURCE_SHA: fa4ad47f15783bfe43492246f68ad922e6aa3bed
  SOURCE_TREE: b20ebc3a9cfb13fecc76d0eee7d90321eef93ca8
  WRAPPER_PATH: .github/workflows/execute-v1.3.1-fa4ad-exact-slim.yml

jobs:
  root-and-python:
    runs-on: ubuntu-slim
    timeout-minutes: 240
    steps:
      - name: Checkout execution wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind wrapper and detach exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA" "$GITHUB_SHA")
          test "${#changed[@]}" = 1
          test "${changed[0]}" = "$WRAPPER_PATH"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/root-evidence"
          printf 'repository=%s\nwrapper=%s\nsource_commit=%s\nsource_tree=%s\nrunner=%s\nos=%s\narch=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$SOURCE_SHA" "$SOURCE_TREE" \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" \
            | tee "$RUNNER_TEMP/root-evidence/source-binding.txt"

      - name: Install exact Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
            sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustc +1.98.0 --version --verbose | tee "$RUNNER_TEMP/root-evidence/rustc.txt"
          cargo +1.98.0 --version --verbose | tee "$RUNNER_TEMP/root-evidence/cargo.txt"

      - name: Execute root Rust gates without early abort
        shell: bash
        run: |
          set +e
          cargo +1.98.0 fmt --all -- --check >"$RUNNER_TEMP/root-evidence/fmt.log" 2>&1
          printf '%s\n' "$?" >"$RUNNER_TEMP/root-evidence/fmt.exit"
          cargo +1.98.0 test --locked --workspace --all-targets >"$RUNNER_TEMP/root-evidence/test.log" 2>&1
          printf '%s\n' "$?" >"$RUNNER_TEMP/root-evidence/test.exit"
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings >"$RUNNER_TEMP/root-evidence/clippy.log" 2>&1
          printf '%s\n' "$?" >"$RUNNER_TEMP/root-evidence/clippy.exit"
          cat "$RUNNER_TEMP/root-evidence/fmt.log"
          cat "$RUNNER_TEMP/root-evidence/test.log"
          cat "$RUNNER_TEMP/root-evidence/clippy.log"
          exit 0

      - name: Install exact Python validation dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Execute all semantic and Python gates without early abort
        shell: bash
        run: |
          set +e
          python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt \
            >"$RUNNER_TEMP/root-evidence/pip.log" 2>&1
          pip_rc=$?
          {
            python3 scripts/validate_plan_v2.py &&
            python3 scripts/validate_plan_v2_extensions.py &&
            python3 scripts/validate_plan_v1_2.py &&
            python3 scripts/validate_plan_v1_2_1.py &&
            python3 scripts/validate_plan_v1_2_2.py &&
            python3 scripts/validate_plan_v1_3.py &&
            python3 scripts/validate_plan_v1_3_1.py &&
            python3 scripts/validate_h01_h02_next_v1.py &&
            python3 scripts/validate_h02_candidate_adapters_v1.py &&
            python3 scripts/validate_h02_openraft_inmemory_cluster_v1.py &&
            python3 scripts/validate_h02_openraft_fault_lab_v1.py &&
            python3 scripts/validate_h02_blocker_closure_v1.py &&
            python3 scripts/validate_h02_exact_head_matrix_contract_v1.py &&
            python3 scripts/validate_h02_pr40_reconciliation_v1.py &&
            python3 -m unittest discover -s tests/oracle -p 'test_*.py' -v &&
            python3 -m unittest discover -s tests/platform -p 'test_*.py' -v &&
            python3 -m unittest discover -s tests/plan -p 'test_*.py' -v
          } >"$RUNNER_TEMP/root-evidence/python.log" 2>&1
          python_rc=$?
          test "$pip_rc" = 0 || python_rc=$pip_rc
          printf '%s\n' "$python_rc" >"$RUNNER_TEMP/root-evidence/python.exit"
          cat "$RUNNER_TEMP/root-evidence/pip.log"
          cat "$RUNNER_TEMP/root-evidence/python.log"
          exit 0

      - name: Upload complete root evidence before gate
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1.3.1-fa4ad-root-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/root-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Require complete root PASS
        shell: bash
        run: |
          set -euo pipefail
          for gate in fmt test clippy python; do
            test "$(cat "$RUNNER_TEMP/root-evidence/$gate.exit")" = 0
          done
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "Exact source root/Python gates PASS; qualification=false authority=NONE"

  p0-transport:
    runs-on: ubuntu-slim
    timeout-minutes: 120
    steps:
      - name: Checkout execution wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind wrapper and detach exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA" "$GITHUB_SHA")
          test "${#changed[@]}" = 1
          test "${changed[0]}" = "$WRAPPER_PATH"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/p0-evidence"
          printf 'repository=%s\nwrapper=%s\nsource_commit=%s\nsource_tree=%s\nrunner=%s\nos=%s\narch=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$SOURCE_SHA" "$SOURCE_TREE" \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" \
            | tee "$RUNNER_TEMP/p0-evidence/source-binding.txt"

      - name: Install exact Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
            sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.98.0 --profile minimal

      - name: Execute complete P0 transport matrix
        shell: bash
        env:
          HEPTABAO_P0_BIND: 127.0.0.1:0
          HEPTABAO_P0_DEV_TOKEN: v1-3-1-development-root-token-000001
          HEPTABAO_P0_DEV_UNSEAL_KEY: v1-3-1-development-unseal-key-00001
          HEPTABAO_P0_AUDIT_PATH: ${{ runner.temp }}/p0-evidence/audit.log
        run: |
          set +e
          stderr="$RUNNER_TEMP/p0-evidence/server.stderr"
          stdout="$RUNNER_TEMP/p0-evidence/server.stdout"
          cargo +1.98.0 run --quiet --locked -p heptabao-p0-server >"$stdout" 2>"$stderr" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          python3 - "$stderr" "$HEPTABAO_P0_AUDIT_PATH" >"$RUNNER_TEMP/p0-evidence/matrix.log" 2>&1 <<'PY'
          import re
          import socket
          import sys
          import time
          from pathlib import Path

          stderr_path = Path(sys.argv[1])
          audit_path = Path(sys.argv[2])
          address = None
          for _ in range(900):
              text = stderr_path.read_text(encoding="utf-8", errors="replace") if stderr_path.exists() else ""
              match = re.search(r"listening on (127\.0\.0\.1:\d+)", text)
              if match:
                  address = match.group(1)
                  break
              time.sleep(0.1)
          assert address is not None, stderr_path.read_text(encoding="utf-8", errors="replace")
          host, port_text = address.rsplit(":", 1)
          port = int(port_text)

          def exchange(raw: bytes, timeout: float = 10.0) -> bytes:
              with socket.create_connection((host, port), timeout=timeout) as stream:
                  stream.settimeout(timeout)
                  stream.sendall(raw)
                  chunks = []
                  while True:
                      block = stream.recv(8192)
                      if not block:
                          break
                      chunks.append(block)
                  return b"".join(chunks)

          def parse_response(raw: bytes):
              head, body = raw.split(b"\r\n\r\n", 1)
              lines = head.split(b"\r\n")
              status = int(lines[0].split(b" ", 2)[1])
              headers = {}
              for line in lines[1:]:
                  name, value = line.split(b":", 1)
                  headers[name.strip().lower()] = value.strip()
              assert int(headers[b"content-length"]) == len(body), raw
              return status, headers, body

          def request(method: str, target: str, body: bytes = b"", token=None, request_id=None):
              headers = [f"{method} {target} HTTP/1.1", f"Host: {address}"]
              if token is not None:
                  headers.append(f"X-Vault-Token: {token}")
              if request_id is not None:
                  headers.append(f"X-HeptaBao-Request-Id: {request_id}")
              if body:
                  headers.append(f"Content-Length: {len(body)}")
              return parse_response(exchange(("\r\n".join(headers) + "\r\n\r\n").encode() + body))

          assert request("GET", "/v1/sys/health")[0] == 501
          assert request("POST", "/v1/sys/init", b"{}")[0] == 200
          unseal_body = b'{"key":"v1-3-1-development-unseal-key-00001"}'
          assert request("POST", "/v1/sys/unseal", unseal_body)[0] == 200
          token = "v1-3-1-development-root-token-000001"
          status, headers, body = request(
              "POST", "/v1/secret/exact-head", b'{"value":"development-only"}', token=token
          )
          assert status == 204 and headers[b"content-length"] == b"0" and body == b""
          status, _, body = request("GET", "/v1/secret/exact-head", token=token)
          assert status == 200 and b"development-only" in body
          assert request("GET", "/v1/secret/exact-head", body=b"x", token=token)[0] == 400

          bad_host = parse_response(exchange(
              b"GET /v1/sys/health HTTP/1.1\r\nHost: attacker.invalid\r\n\r\n"
          ))
          assert bad_host[0] == 400
          duplicate_host = parse_response(exchange(
              (f"GET /v1/sys/health HTTP/1.1\r\nHost: {address}\r\nhost: {address}\r\n\r\n").encode()
          ))
          assert duplicate_host[0] == 400

          request_id = "client-request-id-000000000001"
          assert request("GET", "/v1/sys/health", request_id=request_id)[0] == 200
          assert request("GET", "/v1/sys/health", request_id=request_id)[0] == 409

          held = []
          try:
              for _ in range(32):
                  stream = socket.create_connection((host, port), timeout=3)
                  stream.sendall(b"G")
                  held.append(stream)
              time.sleep(0.5)
              assert request("GET", "/v1/sys/health")[0] == 429
          finally:
              for stream in held:
                  stream.close()
          time.sleep(0.5)

          started = time.monotonic()
          with socket.create_connection((host, port), timeout=3) as stream:
              stream.settimeout(8)
              stream.sendall(f"GET /v1/sys/health HTTP/1.1\r\nHost:".encode())
              chunks = []
              while True:
                  block = stream.recv(8192)
                  if not block:
                      break
                  chunks.append(block)
          elapsed = time.monotonic() - started
          slow = parse_response(b"".join(chunks))
          assert slow[0] == 408 and elapsed < 8, (slow, elapsed)

          for _ in range(100):
              if audit_path.exists() and audit_path.stat().st_size:
                  break
              time.sleep(0.05)
          audit = audit_path.read_text(encoding="utf-8")
          for marker in [
              "host-listener-mismatch",
              "protocol-duplicate-header",
              "client-request-id-replayed",
              "connection-capacity-exhausted",
              "request-read-deadline-exceeded",
              "operation-body-forbidden",
          ]:
              assert marker in audit, (marker, audit)
          print("P0 exact-source transport matrix PASS")
          PY
          rc=$?
          printf '%s\n' "$rc" >"$RUNNER_TEMP/p0-evidence/matrix.exit"
          cat "$RUNNER_TEMP/p0-evidence/matrix.log"
          exit 0

      - name: Upload complete P0 evidence before gate
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1.3.1-fa4ad-p0-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p0-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Require P0 PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/p0-evidence/matrix.exit")" = 0
          test -s "$RUNNER_TEMP/p0-evidence/audit.log"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "Exact source P0 transport PASS; qualification=false authority=NONE"

  h02-exact-head:
    runs-on: ubuntu-slim
    timeout-minutes: 360
    steps:
      - name: Checkout execution wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind wrapper and detach exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA" "$GITHUB_SHA")
          test "${#changed[@]}" = 1
          test "${changed[0]}" = "$WRAPPER_PATH"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/h02-evidence"
          printf 'repository=%s\nwrapper=%s\nsource_commit=%s\nsource_tree=%s\nrunner=%s\nos=%s\narch=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$SOURCE_SHA" "$SOURCE_TREE" \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" \
            | tee "$RUNNER_TEMP/h02-evidence/source-binding.txt"

      - name: Install exact Python and Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
            sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          for toolchain in 1.88.0 1.98.0; do
            rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          done

      - name: Compile test lint and execute complete 24-entry matrix
        shell: bash
        run: |
          set +e
          manifest=probes/h02/openraft-tokio/Cargo.toml
          cargo +1.88.0 metadata --locked --format-version 1 --manifest-path "$manifest" \
            >"$RUNNER_TEMP/h02-evidence/metadata.json" 2>"$RUNNER_TEMP/h02-evidence/metadata.stderr"
          metadata_rc=$?
          cargo +1.98.0 fmt --manifest-path "$manifest" --all -- --check \
            >"$RUNNER_TEMP/h02-evidence/fmt.log" 2>&1
          fmt_rc=$?
          compile_rc=0
          for toolchain in 1.88.0 1.98.0; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/h02-target-$toolchain"
            cargo +"$toolchain" test --locked --all-targets --manifest-path "$manifest" \
              >"$RUNNER_TEMP/h02-evidence/test-$toolchain.log" 2>&1
            test_rc=$?
            cargo +"$toolchain" clippy --locked --all-targets --manifest-path "$manifest" -- -D warnings \
              >"$RUNNER_TEMP/h02-evidence/clippy-$toolchain.log" 2>&1
            clippy_rc=$?
            if [ "$test_rc" != 0 ] || [ "$clippy_rc" != 0 ]; then compile_rc=1; fi
            rm -rf "$CARGO_TARGET_DIR"
          done
          python3 scripts/h02_exact_head_matrix_v1.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$SOURCE_SHA" \
            --commit "$SOURCE_SHA" \
            --tree "$SOURCE_TREE" \
            --manifest "$manifest" \
            --output-dir "$RUNNER_TEMP/h02-evidence/matrix" \
            --cargo-target-root "$RUNNER_TEMP/h02-matrix-target" \
            --entry-timeout-seconds 240 \
            >"$RUNNER_TEMP/h02-evidence/matrix-runner.log" 2>&1
          matrix_rc=$?
          printf 'metadata=%s\nfmt=%s\ncompile=%s\nmatrix=%s\n' \
            "$metadata_rc" "$fmt_rc" "$compile_rc" "$matrix_rc" \
            >"$RUNNER_TEMP/h02-evidence/exit-summary.txt"
          cat "$RUNNER_TEMP/h02-evidence/metadata.stderr"
          cat "$RUNNER_TEMP/h02-evidence/fmt.log"
          cat "$RUNNER_TEMP/h02-evidence"/test-*.log
          cat "$RUNNER_TEMP/h02-evidence"/clippy-*.log
          cat "$RUNNER_TEMP/h02-evidence/matrix-runner.log"
          exit 0

      - name: Upload complete H02 evidence before gate
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1.3.1-fa4ad-h02-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h02-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Require complete H02 PASS
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'metadata=0' "$RUNNER_TEMP/h02-evidence/exit-summary.txt"
          grep -qx 'fmt=0' "$RUNNER_TEMP/h02-evidence/exit-summary.txt"
          grep -qx 'compile=0' "$RUNNER_TEMP/h02-evidence/exit-summary.txt"
          grep -qx 'matrix=0' "$RUNNER_TEMP/h02-evidence/exit-summary.txt"
          python3 - "$RUNNER_TEMP/h02-evidence/matrix/matrix-summary.json" <<'PY'
          import json
          import sys
          summary = json.load(open(sys.argv[1], encoding="utf-8"))
          assert summary["source_binding"]["commit"] == "fa4ad47f15783bfe43492246f68ad922e6aa3bed"
          assert summary["source_binding"]["tree"] == "b20ebc3a9cfb13fecc76d0eee7d90321eef93ca8"
          assert summary["result"] == "PASS", summary
          assert summary["matrix"]["executed_entry_count"] == 24, summary
          assert summary["counts"] == {
              "pass": 24,
              "fail": 0,
              "blocked": 0,
              "unknown": 0,
              "unexecuted": 0,
          }, summary
          assert summary["qualification"] is False
          assert summary["compatibility_claim"] is False
          assert summary["selection_effect"] == "NONE"
          assert summary["authority_effect"] == "NONE"
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "Exact source H02 24-entry matrix PASS; qualification=false authority=NONE"
