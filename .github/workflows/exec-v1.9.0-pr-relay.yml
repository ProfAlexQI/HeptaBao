name: exec V1.9.0 pull-request relay

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - integration/v1.4.4-technical-candidate

permissions:
  contents: write

concurrency:
  group: exec-v1.9.0-pr-relay
  cancel-in-progress: false

jobs:
  converge:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/plan-v1.4.7-post-merge-truth-and-external-admission-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout frozen V1.9 execution controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: exec/v1.9.0-full-repository-convergence-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Bind execution controller
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "exec/v1.9.0-full-repository-convergence-v1"
          test -f .exec/run_v1_9.sh
          test -f .exec/augment_external_v2.py.gz.b64
          test -f .exec/v1_9_payload/part-00
          test -f .exec/v1_9_payload/part-05

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install exact Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustc +1.98.0 --version --verbose
          cargo +1.98.0 --version --verbose

      - name: Execute full convergence controller
        shell: bash
        run: bash .exec/run_v1_9.sh
