name: exec V1.9.0 full repository convergence

on:
  push:
    branches:
      - exec/v1.9.0-full-repository-convergence-v1
    paths:
      - .exec/trigger/v1.9.0

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout convergence controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Archive exact convergence inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v1.9.0-controller-inputs-${{ github.run_id }}
          path: |
            .exec/augment_external_v2.py.gz.b64
            .exec/v1_9_payload/part-*
          if-no-files-found: error
          retention-days: 14

      - name: Restore canonical external V2 payload
        shell: bash
        run: |
          set -euo pipefail
          python .exec/repair_external_v2_payload.py --write
          python .exec/extract_verified_gzip.py \
            --input <(tr -d '\r\n' < .exec/augment_external_v2.py.gz.b64 | base64 --decode) \
            --output "$RUNNER_TEMP/augment_external_v2.py" \
            --sha256 c97528017a6b4cb22acd32cd191fb88f26f5697015fb75035176ccb5ec98716b
          python -m py_compile "$RUNNER_TEMP/augment_external_v2.py"
          test "$(git diff --name-only)" = ".exec/augment_external_v2.py.gz.b64"
          git diff --check
          git config user.name "HeptaBao convergence controller"
          git config user.email "heptabao-convergence@users.noreply.github.com"
          git add .exec/augment_external_v2.py.gz.b64
          git commit -m "fix(exec): restore exact external V2 materializer payload"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install exact Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustc +1.98.0 --version --verbose
          cargo +1.98.0 --version --verbose

      - name: Execute full convergence controller
        shell: bash
        run: bash .exec/run_v1_9.sh

      - name: Export exact workflow admission inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v1.9.0-generated-workflows-${{ github.run_id }}
          path: planning/generated-workflows/*.yml
          if-no-files-found: error
          retention-days: 14
