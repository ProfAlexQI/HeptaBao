name: exec V1.9.0 full repository convergence

on:
  push:
    branches:
      - exec/v1.9.0-full-repository-convergence-v1
    paths:
      - .exec/trigger/v1.9.0

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout convergence controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Archive exact convergence inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v1.9.0-controller-inputs-${{ github.run_id }}
          path: |
            .exec/augment_external_v2.py.gz.b64
            .exec/v1_9_payload/part-*
          if-no-files-found: error
          retention-days: 14

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install exact Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustc +1.98.0 --version --verbose
          cargo +1.98.0 --version --verbose

      - name: Execute full convergence controller
        shell: bash
        run: bash .exec/run_v1_9.sh

      - name: Export exact workflow admission inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v1.9.0-generated-workflows-${{ github.run_id }}
          path: planning/generated-workflows/*.yml
          if-no-files-found: error
          retention-days: 14
