name: exec review-chain v2 control preflight

on:
  push:
    branches: [exec/review-chain-v2-preflight-v1]

permissions:
  contents: read

concurrency:
  group: exec-review-chain-v2-preflight-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable preflight controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install exact Python parser dependency
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate all v2 execution contracts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from typing import Any

          import yaml

          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          root = Path("/tmp/heptabao-review-chain-v2")
          root.mkdir(parents=True, exist_ok=True)

          materializers = [
              (
                  "v1.5.0",
                  "exec/v1.5.0-control-plane-materializer-v2",
                  ".github/workflows/exec-v1.5.0-control-plane-materialize-v2.yml",
                  ".exec/trigger/v1.5.0",
                  "52b7dd08160e979f72b18d76bf395017762439aa",
              ),
              (
                  "v1.6.0",
                  "exec/v1.6.0-runtime-operations-materializer-v2",
                  ".github/workflows/exec-v1.6.0-runtime-operations-materialize-v2.yml",
                  ".exec/trigger/v1.6.0",
                  "52b7dd08160e979f72b18d76bf395017762439aa",
              ),
              (
                  "v1.7.0",
                  "exec/v1.7.0-service-materializer-v2",
                  ".github/workflows/exec-v1.7.0-service-materialize.yml",
                  ".exec/trigger/v1.7.0",
                  "96409bcc6d8ef7ab7408147c92f13f4095eb5b58",
              ),
              (
                  "v1.8.0",
                  "exec/v1.8.0-operational-service-materializer-v2",
                  ".github/workflows/exec-v1.8.0-operational-service-materialize-v2.yml",
                  ".exec/trigger/v1.8.0",
                  "52b7dd08160e979f72b18d76bf395017762439aa",
              ),
              (
                  "v1.8.1",
                  "exec/v1.8.1-repository-closure-materializer-v2",
                  ".github/workflows/exec-v1.8.1-repository-closure-materialize-v2.yml",
                  ".exec/trigger/v1.8.1",
                  "52b7dd08160e979f72b18d76bf395017762439aa",
              ),
          ]
          integrators = [
              (
                  "v1.5.0",
                  "exec/v1.5.0-reviewed-integrator-v2",
                  ".github/workflows/exec-v1.5.0-reviewed-integrator-v2.yml",
                  ".exec/trigger/integrate-v1.5.0",
              ),
              (
                  "v1.6.0",
                  "exec/v1.6.0-reviewed-integrator-v2",
                  ".github/workflows/exec-v1.6.0-reviewed-integrator-v2.yml",
                  ".exec/trigger/integrate-v1.6.0",
              ),
              (
                  "v1.7.0",
                  "exec/v1.7.0-reviewed-integrator-v2",
                  ".github/workflows/exec-v1.7.0-reviewed-integrator-v2.yml",
                  ".exec/trigger/integrate-v1.7.0",
              ),
              (
                  "v1.8.0",
                  "exec/v1.8.0-reviewed-integrator-v2",
                  ".github/workflows/exec-v1.8.0-reviewed-integrator-v2.yml",
                  ".exec/trigger/integrate-v1.8.0",
              ),
              (
                  "v1.8.1",
                  "exec/v1.8.1-reviewed-integrator-v2",
                  ".github/workflows/exec-v1.8.1-reviewed-integrator-v2.yml",
                  ".exec/trigger/integrate-v1.8.1",
              ),
          ]

          def get(ref: str, path: str) -> tuple[str, bytes]:
              encoded_path = urllib.parse.quote(path, safe="/")
              query = urllib.parse.urlencode({"ref": ref})
              url = (
                  f"https://api.github.com/repos/{repository}/contents/"
                  f"{encoded_path}?{query}"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "heptabao-review-chain-v2-preflight",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload: Any = json.load(response)
              if not isinstance(payload, dict):
                  raise SystemExit(f"contents response is not an object: {ref}:{path}")
              sha = payload.get("sha")
              encoded = payload.get("content")
              if not isinstance(sha, str) or not isinstance(encoded, str):
                  raise SystemExit(f"contents response incomplete: {ref}:{path}")
              return sha, base64.b64decode(encoded)

          def parse_workflow(ref: str, path: str, trigger: str) -> str:
              _, raw = get(ref, path)
              text = raw.decode("utf-8")
              value = yaml.load(text, Loader=yaml.BaseLoader)
              if not isinstance(value, dict):
                  raise SystemExit(f"workflow is not a mapping: {ref}:{path}")
              if not {"name", "on", "permissions", "jobs"}.issubset(value):
                  raise SystemExit(f"workflow top-level contract missing: {ref}:{path}")
              events = value["on"]
              if not isinstance(events, dict) or "push" not in events:
                  raise SystemExit(f"workflow push trigger missing: {ref}:{path}")
              push = events["push"]
              if not isinstance(push, dict):
                  raise SystemExit(f"workflow push contract malformed: {ref}:{path}")
              branches = push.get("branches")
              paths = push.get("paths")
              if branches != [ref]:
                  raise SystemExit(
                      f"workflow branch trigger mismatch: {ref}:{path}:{branches}"
                  )
              if paths != [trigger]:
                  raise SystemExit(
                      f"workflow path trigger mismatch: {ref}:{path}:{paths}"
                  )
              if "git push --force" in text or "git push -f" in text:
                  raise SystemExit(f"force push admitted: {ref}:{path}")
              if re.search(r"pulls/[0-9]+", text) or re.search(r"\bpr=[0-9]+\b", text):
                  raise SystemExit(f"fixed pull-request number admitted: {ref}:{path}")
              if "current-head review admission" not in text:
                  raise SystemExit(f"post-review admission missing: {ref}:{path}")
              return text

          predecessor_sources: dict[str, bytes] = {}
          for version, ref, workflow, trigger, expected_helper_sha in materializers:
              helper_sha, helper = get(ref, ".exec/admit_reviewed_predecessor.py")
              if helper_sha != expected_helper_sha:
                  raise SystemExit(
                      f"{version} predecessor helper drift: {helper_sha} != {expected_helper_sha}"
                  )
              compile(helper, f"{ref}:admit_reviewed_predecessor.py", "exec")
              helper_text = helper.decode("utf-8")
              for token_value in (
                  "discover",
                  "APPROVED",
                  "CHANGES_REQUESTED",
                  "verification",
                  "ordered merge parents",
                  "integration head",
                  "authority_effect",
              ):
                  if token_value not in helper_text:
                      raise SystemExit(
                          f"{version} predecessor helper missing {token_value!r}"
                      )
              workflow_text = parse_workflow(ref, workflow, trigger)
              if "git merge-base --is-ancestor" not in workflow_text:
                  raise SystemExit(f"{version} fast-forward publication guard missing")
              if version == "v1.7.0" and "--pr " in workflow_text:
                  raise SystemExit("V1.7 legacy PR-number hint survived")
              predecessor_sources[version] = helper

          integrator_sources: dict[str, bytes] = {}
          for version, ref, workflow, trigger in integrators:
              helper_sha, helper = get(ref, ".exec/merge_reviewed_candidate.py")
              if helper_sha != "0aaa91197b6f1f0486d2cd15c97124bdd7b88ecb":
                  raise SystemExit(
                      f"{version} integrator helper drift: {helper_sha}"
                  )
              compile(helper, f"{ref}:merge_reviewed_candidate.py", "exec")
              helper_text = helper.decode("utf-8")
              for token_value in (
                  "latest_decisive_reviews",
                  "COMMENTED",
                  "--dry-run",
                  "current-head review admission",
                  "prospective merge is not GitHub verified",
                  "integration readback",
                  "ORDINARY_REVIEWED_MERGE_COMPLETE",
              ):
                  if token_value not in helper_text:
                      raise SystemExit(
                          f"{version} integrator helper missing {token_value!r}"
                      )
              parse_workflow(ref, workflow, trigger)
              integrator_sources[version] = helper

          if len(set(integrator_sources.values())) != 1:
              raise SystemExit("integrator helper bytes differ across versions")
          common_predecessors = {
              predecessor_sources[version]
              for version in ("v1.5.0", "v1.6.0", "v1.8.0", "v1.8.1")
          }
          if len(common_predecessors) != 1:
              raise SystemExit("common predecessor helper bytes differ")

          namespace: dict[str, Any] = {"__name__": "preflight_module"}
          exec(
              compile(
                  next(iter(integrator_sources.values())),
                  "merge_reviewed_candidate.py",
                  "exec",
              ),
              namespace,
          )
          reducer = namespace["latest_decisive_reviews"]
          reviews = [
              {
                  "submitted_at": "2026-09-03T00:00:00Z",
                  "state": "APPROVED",
                  "commit_id": "head",
                  "user": {"login": "reviewer"},
              },
              {
                  "submitted_at": "2026-09-03T00:01:00Z",
                  "state": "COMMENTED",
                  "commit_id": "head",
                  "user": {"login": "reviewer"},
              },
          ]
          reduced = reducer(reviews)
          if reduced["reviewer"]["state"] != "APPROVED":
              raise SystemExit("COMMENTED incorrectly superseded APPROVED")
          reviews.append(
              {
                  "submitted_at": "2026-09-03T00:02:00Z",
                  "state": "CHANGES_REQUESTED",
                  "commit_id": "head",
                  "user": {"login": "reviewer"},
              }
          )
          reduced = reducer(reviews)
          if reduced["reviewer"]["state"] != "CHANGES_REQUESTED":
              raise SystemExit("latest decisive review was not retained")

          print("PASS five dynamic materializers")
          print("PASS five byte-identical dynamic integrators")
          print("PASS path gates, no fixed PR numbers, no force push")
          print("PASS review-state reduction and fail-closed merge contracts")
          PY
