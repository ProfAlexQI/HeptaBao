name: exec review-chain v2 control preflight

on:
  push:
    branches: [exec/review-chain-v2-preflight-v1]

permissions:
  contents: read

concurrency:
  group: exec-review-chain-v2-preflight-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable preflight controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate all v2 execution contracts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from typing import Any

          import yaml

          REPOSITORY = os.environ["REPOSITORY"]
          TOKEN = os.environ["GH_TOKEN"]
          PREDECESSOR_SHA = "eb9f56b47dd47799e49ab0e8d360fc2f5ba66f28"
          INTEGRATOR_SHA = "0aaa91197b6f1f0486d2cd15c97124bdd7b88ecb"

          MATERIALIZERS = [
              (
                  "v1.5.0",
                  "exec/v1.5.0-control-plane-materializer-v2",
                  ".github/workflows/exec-v1.5.0-control-plane-materialize-v2.yml",
                  ".exec/trigger/v1.5.0",
              ),
              (
                  "v1.6.0",
                  "exec/v1.6.0-runtime-operations-materializer-v2",
                  ".github/workflows/exec-v1.6.0-runtime-operations-materialize-v2.yml",
                  ".exec/trigger/v1.6.0",
              ),
              (
                  "v1.7.0",
                  "exec/v1.7.0-service-materializer-v2",
                  ".github/workflows/exec-v1.7.0-service-materialize.yml",
                  ".exec/trigger/v1.7.0",
              ),
              (
                  "v1.8.0",
                  "exec/v1.8.0-operational-service-materializer-v2",
                  ".github/workflows/exec-v1.8.0-operational-service-materialize-v2.yml",
                  ".exec/trigger/v1.8.0",
              ),
              (
                  "v1.8.1",
                  "exec/v1.8.1-repository-closure-materializer-v2",
                  ".github/workflows/exec-v1.8.1-repository-closure-materialize-v2.yml",
                  ".exec/trigger/v1.8.1",
              ),
          ]
          INTEGRATORS = [
              (
                  "v1.5.0",
                  "exec/v1.5.0-reviewed-integrator-v2",
                  ".github/workflows/exec-v1.5.0-reviewed-integrator-v2.yml",
                  ".exec/trigger/integrate-v1.5.0",
              ),
              (
                  "v1.6.0",
                  "exec/v1.6.0-reviewed-integrator-v2",
                  ".github/workflows/exec-v1.6.0-reviewed-integrator-v2.yml",
                  ".exec/trigger/integrate-v1.6.0",
              ),
              (
                  "v1.7.0",
                  "exec/v1.7.0-reviewed-integrator-v2",
                  ".github/workflows/exec-v1.7.0-reviewed-integrator-v2.yml",
                  ".exec/trigger/integrate-v1.7.0",
              ),
              (
                  "v1.8.0",
                  "exec/v1.8.0-reviewed-integrator-v2",
                  ".github/workflows/exec-v1.8.0-reviewed-integrator-v2.yml",
                  ".exec/trigger/integrate-v1.8.0",
              ),
              (
                  "v1.8.1",
                  "exec/v1.8.1-reviewed-integrator-v2",
                  ".github/workflows/exec-v1.8.1-reviewed-integrator-v2.yml",
                  ".exec/trigger/integrate-v1.8.1",
              ),
          ]

          def get(ref: str, path: str) -> tuple[str, bytes]:
              url = (
                  f"https://api.github.com/repos/{REPOSITORY}/contents/"
                  f"{urllib.parse.quote(path, safe='/')}?"
                  f"{urllib.parse.urlencode({'ref': ref})}"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "heptabao-review-chain-v2-preflight",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  value: Any = json.load(response)
              if not isinstance(value, dict):
                  raise SystemExit(f"contents response is not an object: {ref}:{path}")
              sha = value.get("sha")
              encoded = value.get("content")
              if not isinstance(sha, str) or not isinstance(encoded, str):
                  raise SystemExit(f"contents response incomplete: {ref}:{path}")
              return sha, base64.b64decode(encoded)

          def workflow(ref: str, path: str, trigger: str) -> str:
              _, raw = get(ref, path)
              text = raw.decode("utf-8")
              value = yaml.load(text, Loader=yaml.BaseLoader)
              if not isinstance(value, dict):
                  raise SystemExit(f"workflow is not a mapping: {ref}:{path}")
              if not {"name", "on", "permissions", "jobs"}.issubset(value):
                  raise SystemExit(f"workflow top-level contract missing: {ref}:{path}")
              events = value["on"]
              push = events.get("push") if isinstance(events, dict) else None
              if not isinstance(push, dict):
                  raise SystemExit(f"workflow push contract malformed: {ref}:{path}")
              if push.get("branches") != [ref] or push.get("paths") != [trigger]:
                  raise SystemExit(f"workflow trigger mismatch: {ref}:{path}:{push}")
              if "git push --force" in text or "git push -f" in text:
                  raise SystemExit(f"force push admitted: {ref}:{path}")
              if re.search(r"pulls/[0-9]+", text) or re.search(r"\bpr=[0-9]+\b", text):
                  raise SystemExit(f"fixed PR number admitted: {ref}:{path}")
              if "current-head review admission" not in text:
                  raise SystemExit(f"post-review admission missing: {ref}:{path}")
              return text

          predecessor_sources: dict[str, bytes] = {}
          for version, ref, path, trigger in MATERIALIZERS:
              sha, source = get(ref, ".exec/admit_reviewed_predecessor.py")
              if sha != PREDECESSOR_SHA:
                  raise SystemExit(f"{version} predecessor helper drift: {sha}")
              compile(source, f"{ref}:admit_reviewed_predecessor.py", "exec")
              text = source.decode("utf-8")
              for token in (
                  "latest_decisive_reviews",
                  "paged",
                  "current-head review admission",
                  "reviewThreads",
                  "merge tree",
                  "ordered merge parents",
                  "authority_effect",
              ):
                  if token not in text:
                      raise SystemExit(f"{version} predecessor helper missing {token!r}")
              flow = workflow(ref, path, trigger)
              if "git merge-base --is-ancestor" not in flow:
                  raise SystemExit(f"{version} fast-forward publication guard missing")
              if "--pr " in flow:
                  raise SystemExit(f"{version} retained a PR-number hint")
              predecessor_sources[version] = source

          integrator_sources: dict[str, bytes] = {}
          for version, ref, path, trigger in INTEGRATORS:
              sha, source = get(ref, ".exec/merge_reviewed_candidate.py")
              if sha != INTEGRATOR_SHA:
                  raise SystemExit(f"{version} integrator helper drift: {sha}")
              compile(source, f"{ref}:merge_reviewed_candidate.py", "exec")
              text = source.decode("utf-8")
              for token in (
                  "latest_decisive_reviews",
                  "--dry-run",
                  "current-head review admission",
                  "prospective merge is not GitHub verified",
                  "integration readback",
                  "ORDINARY_REVIEWED_MERGE_COMPLETE",
              ):
                  if token not in text:
                      raise SystemExit(f"{version} integrator helper missing {token!r}")
              workflow(ref, path, trigger)
              integrator_sources[version] = source

          if len(set(predecessor_sources.values())) != 1:
              raise SystemExit("predecessor helper bytes differ across versions")
          if len(set(integrator_sources.values())) != 1:
              raise SystemExit("integrator helper bytes differ across versions")

          def reducer(source: bytes):
              namespace: dict[str, Any] = {"__name__": "preflight_module"}
              exec(compile(source, "review-helper.py", "exec"), namespace)
              return namespace["latest_decisive_reviews"]

          cases = [
              {
                  "submitted_at": "2026-09-03T00:00:00Z",
                  "state": "APPROVED",
                  "commit_id": "head",
                  "user": {"login": "reviewer"},
              },
              {
                  "submitted_at": "2026-09-03T00:01:00Z",
                  "state": "COMMENTED",
                  "commit_id": "head",
                  "user": {"login": "reviewer"},
              },
          ]
          for source in (
              next(iter(predecessor_sources.values())),
              next(iter(integrator_sources.values())),
          ):
              reduce_reviews = reducer(source)
              if reduce_reviews(cases)["reviewer"]["state"] != "APPROVED":
                  raise SystemExit("COMMENTED incorrectly superseded APPROVED")
              changed = cases + [
                  {
                      "submitted_at": "2026-09-03T00:02:00Z",
                      "state": "CHANGES_REQUESTED",
                      "commit_id": "head",
                      "user": {"login": "reviewer"},
                  }
              ]
              if reduce_reviews(changed)["reviewer"]["state"] != "CHANGES_REQUESTED":
                  raise SystemExit("latest decisive review was not retained")

          print("PASS five byte-identical dynamic materializers")
          print("PASS five byte-identical dynamic integrators")
          print("PASS Python YAML path gates pagination and review reduction")
          print("PASS no fixed PR numbers no force push and fail-closed merge contracts")
          PY
