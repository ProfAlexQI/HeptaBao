name: v1.4.4-module-doc-closure-exec-v2

on:
  push:
    branches:
      - exec/v1.4.4-module-doc-closure-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v1.4.4-module-doc-closure-exec-v2
  cancel-in-progress: false

jobs:
  generate-validate-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_BRANCH: codex/plan-v1.4.3-descriptor-fencing-clean-v1
      TARGET_BRANCH: codex/plan-v1.4.4-module-documentation-closure-v2
      GENERATOR_REF: exec/v1.4.4-module-doc-closure-v1
      GENERATOR_PATH: .github/workflows/v1.4.4-module-doc-closure-exec.yml
    steps:
      - name: Checkout exact hardened executor head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Resolve clean V1.4.3 source
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if git ls-remote --exit-code origin "refs/heads/$SOURCE_BRANCH" >/dev/null 2>&1; then
              git fetch --no-tags origin "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
              exit 0
            fi
            sleep 10
          done
          echo "clean V1.4.3 source branch was not published" >&2
          exit 1

      - name: Extract, harden and execute audited generator
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$GENERATOR_REF:refs/remotes/origin/$GENERATOR_REF"
          git show "refs/remotes/origin/$GENERATOR_REF:$GENERATOR_PATH" >"$RUNNER_TEMP/generator.yml"
          python - <<'PY'
          import os
          from pathlib import Path

          source = Path(os.environ['RUNNER_TEMP'], 'generator.yml').read_text(encoding='utf-8')
          start = "      - name: Generate complete module documentation closure\n        run: |\n"
          end = "\n      - name: Upload documentation closure receipt\n"
          if source.count(start) != 1 or source.count(end) != 1:
              raise SystemExit('audited generator step boundaries are missing or ambiguous')
          body = source.split(start, 1)[1].split(end, 1)[0]
          filtered = []
          deindent_rewrites = {
              'validator': "validator = '\\n'.join(validator.splitlines()) + '\\n'",
              'tests': "tests = '\\n'.join(tests.splitlines()) + '\\n'",
              'workflow': "workflow = '\\n'.join(workflow.splitlines()) + '\\n'",
          }
          rewrites_seen = set()
          for raw in body.splitlines():
              line = raw[10:] if raw.startswith('          ') else raw
              if "find . -path './.git'" in line and 'TODO|TBD|PLACEHOLDER' in line:
                  filtered.append(': # historical documents are outside the V1.4.4 generated-surface scan')
                  continue
              rewritten = False
              for name, replacement in deindent_rewrites.items():
                  if line.startswith(f"{name} = '\\n'.join(line[10:]"):
                      filtered.append(replacement)
                      rewrites_seen.add(name)
                      rewritten = True
                      break
              if not rewritten:
                  filtered.append(line)
          if rewrites_seen != set(deindent_rewrites):
              raise SystemExit(f'generated-template deindent contract drifted: {sorted(rewrites_seen)!r}')
          script = '\n'.join(filtered) + '\n'
          required = [
              "git worktree add --detach \"$work\" \"$source_sha\"",
              "python scripts/validate_module_documentation_v1_4_4.py",
              "cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings",
              "git commit -m 'docs(v1.4.4): close current workspace module documentation gaps'",
              "git push origin \"+HEAD:refs/heads/$TARGET_BRANCH\"",
          ]
          missing = [item for item in required if item not in script]
          if missing:
              raise SystemExit(f'audited generator contract drifted: {missing!r}')
          target = Path(os.environ['RUNNER_TEMP'], 'run-v1.4.4-module-doc-generator.sh')
          target.write_text(script, encoding='utf-8')
          target.chmod(0o700)
          PY
          bash "$RUNNER_TEMP/run-v1.4.4-module-doc-generator.sh"

      - name: Upload hardened closure receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptabao-v1.4.4-module-doc-closure-v2-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/v1.4.4-module-doc-receipt.txt
