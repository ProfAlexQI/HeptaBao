name: exec V1.8.1 repository closure materializer

on:
  push:
    branches: [exec/v1.8.1-repository-closure-materializer-v1]

permissions:
  contents: write

concurrency:
  group: exec-v1.8.1-repository-closure-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 320
    steps:
      - name: Checkout execution controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Freeze generator and switch to current integration
        shell: bash
        run: |
          set -euo pipefail
          cp .exec/materialize_v1_8_1.py "$RUNNER_TEMP/materialize_v1_8_1.py"
          python -m py_compile "$RUNNER_TEMP/materialize_v1_8_1.py"
          git fetch origin integration/v1.4.4-technical-candidate
          git switch --detach origin/integration/v1.4.4-technical-candidate
          git switch -C codex/plan-v1.8.1-repository-scope-closure-v1
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'baseline=%s\ntree=%s\nparents=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$(git rev-list --parents -n 1 HEAD)"

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Materialize repository-scope closure
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python "$RUNNER_TEMP/materialize_v1_8_1.py" .
          git diff --check

      - name: Validate current and all inherited contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_plan_v1_8_1.py
          python scripts/validate_plan_v1_8_0.py
          python scripts/validate_plan_v1_7_0.py
          python scripts/validate_plan_v1_6_0.py
          python scripts/validate_plan_v1_5_0.py
          python scripts/validate_plan_v1_4_7.py
          python scripts/validate_plan_v1_4_6.py
          python scripts/validate_plan_v1_4_5.py
          python scripts/validate_module_documentation_v1_4_4.py
          python -m unittest discover -s tests/plan -p 'test_*.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python scripts/build_release_bundle_v1_8.py --output "$RUNNER_TEMP/release-one.tar.gz"
          python scripts/build_release_bundle_v1_8.py --output "$RUNNER_TEMP/release-two.tar.gz"
          cmp "$RUNNER_TEMP/release-one.tar.gz" "$RUNNER_TEMP/release-two.tar.gz"

      - name: Install exact Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustc +1.98.0 --version --verbose
          cargo +1.98.0 --version --verbose

      - name: Validate locked 42-crate workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Publish clean closure candidate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .exec
          test ! -e .github/workflows/exec-v1.8.1-repository-closure-materialize.yml
          git config user.name "HeptaBao execution controller"
          git config user.email "heptabao-exec@users.noreply.github.com"
          git add --all
          git commit -m "chore(v1.8.1): close all repository-controlled blockers"
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          git push --force origin HEAD:refs/heads/codex/plan-v1.8.1-repository-scope-closure-v1
          {
            echo '## V1.8.1 clean repository-closure candidate published'
            echo
            echo "- branch: \`codex/plan-v1.8.1-repository-scope-closure-v1\`"
            echo "- commit: \`$candidate_sha\`"
            echo "- tree: \`$candidate_tree\`"
            echo '- repository blockers closed on reviewed merge: HB-BLK-REPO-049..093'
            echo '- repository blockers open: none'
            echo '- external/control blockers: authentic evidence still required'
            echo '- authority effect: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
