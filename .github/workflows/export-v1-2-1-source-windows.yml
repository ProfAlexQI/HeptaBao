name: export-v1-2-1-source-windows

on:
  push:
    branches: ["exec/v1-2-1-source-export-windows-v1"]
    paths:
      - ".github/workflows/export-v1-2-1-source-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-v1-2-1-source-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind and archive exact source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'source head mismatch' }
          if ((git status --porcelain=v1 --untracked-files=all)) { throw 'dirty source tree' }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          "repository=$env:GITHUB_REPOSITORY`ncommit=$env:GITHUB_SHA`ntree=$tree" | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\source-binding.txt"
          git archive --format=zip --prefix=HeptaBao/ --output="$env:RUNNER_TEMP\heptabao-v1-2-1-source.zip" $env:GITHUB_SHA
          (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP\heptabao-v1-2-1-source.zip").Hash.ToLower() | Set-Content -Encoding ascii "$env:RUNNER_TEMP\heptabao-v1-2-1-source.zip.sha256"
      - name: Upload exact source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heptabao-v1-2-1-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}\source-binding.txt
            ${{ runner.temp }}\heptabao-v1-2-1-source.zip
            ${{ runner.temp }}\heptabao-v1-2-1-source.zip.sha256
          if-no-files-found: error
          retention-days: 1
