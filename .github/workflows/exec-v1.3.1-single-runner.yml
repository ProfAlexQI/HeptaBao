name: v1.3.1-isolated-exact-executor

on:
  push:
    branches:
      - "exec/v1.3.1-77c64bd-single-runner"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1.3.1-isolated-exact-executor-77c64bd
  cancel-in-progress: true

jobs:
  execute-exact-source:
    name: exact-${{ matrix.source_kind }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - source_kind: head
            source_sha: 77c64bd31c2bb6c3ae8f5110aadfa1b0aa656bc8
          - source_kind: merge
            source_sha: 69cde48ffcf227994f574ff177f02d4cf8500ff2
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      EXPECTED_HEAD_SHA: 77c64bd31c2bb6c3ae8f5110aadfa1b0aa656bc8
      EXPECTED_BASE_SHA: 6d95a231f99d310ec87fa25acf93ab44bbc548a5
      EXPECTED_MERGE_SHA: 69cde48ffcf227994f574ff177f02d4cf8500ff2
      EXPECTED_TREE_SHA: e49ca4ef9b0da3104b6ae4725ead40233baa042c
      SOURCE_KIND: ${{ matrix.source_kind }}
      SOURCE_SHA: ${{ matrix.source_sha }}
      HEPTABAO_P0_BIND: 127.0.0.1:0
      HEPTABAO_P0_DEV_TOKEN: v1-3-1-isolated-development-root-token-000001
      HEPTABAO_P0_DEV_UNSEAL_KEY: v1-3-1-isolated-development-unseal-key-00001

    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source and merge topology
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          if [[ "$SOURCE_KIND" == "head" ]]; then
            test "$SOURCE_SHA" = "$EXPECTED_HEAD_SHA"
          else
            test "$SOURCE_SHA" = "$EXPECTED_MERGE_SHA"
            read -r merge parent_one parent_two extra <<<"$(git rev-list --parents -n 1 HEAD)"
            test "$merge" = "$EXPECTED_MERGE_SHA"
            test "$parent_one" = "$EXPECTED_BASE_SHA"
            test "$parent_two" = "$EXPECTED_HEAD_SHA"
            test -z "${extra:-}"
          fi
          evidence="$RUNNER_TEMP/heptabao-v1.3.1-$SOURCE_KIND"
          mkdir -p "$evidence/root" "$evidence/p0" "$evidence/h02"
          printf 'repository=%s\nsource_kind=%s\ncommit=%s\ntree=%s\nbase=%s\nhead=%s\nmerge=%s\n' \
            "$GITHUB_REPOSITORY" "$SOURCE_KIND" "$SOURCE_SHA" "$EXPECTED_TREE_SHA" \
            "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA" "$EXPECTED_MERGE_SHA" \
            | tee "$evidence/root/source-binding.txt"

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install exact Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs \
              -o "$RUNNER_TEMP/rustup-init.sh"
            sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          for toolchain in 1.88.0 1.98.0; do
            rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          done

      - name: Validate every plan and Python regression
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/heptabao-v1.3.1-$SOURCE_KIND/root"
          python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt \
            >"$evidence/pip.log" 2>&1
          validators=(
            validate_plan_v2.py
            validate_plan_v2_extensions.py
            validate_plan_v1_2.py
            validate_plan_v1_2_1.py
            validate_plan_v1_2_2.py
            validate_plan_v1_3.py
            validate_plan_v1_3_1.py
            validate_v1_3_1_final_closure_v1.py
            validate_provenance_v1.py
            validate_evidence_objects_v1.py
            validate_oracle_foundation_v1.py
            validate_repository_identity_v1.py
            validate_dependency_bakeoff_v1.py
            validate_dependency_execution_profiles_v1.py
            validate_dependency_registry_evidence_v1.py
            validate_dependency_research_captures_v1.py
            validate_h01_h02_next_v1.py
            validate_h02_seeded_behavior_plan_v1.py
            validate_h02_candidate_adapters_v1.py
            validate_h02_openraft_inmemory_cluster_v1.py
            validate_h02_openraft_fault_lab_v1.py
            validate_h02_blocker_closure_v1.py
            validate_h02_exact_head_matrix_contract_v1.py
            validate_h02_pr40_reconciliation_v1.py
            validate_rust_source_surface_v1.py
          )
          for validator in "${validators[@]}"; do
            python3 "scripts/$validator" | tee -a "$evidence/validators.log"
          done
          for suite in oracle platform plan; do
            python3 -m unittest discover -s "tests/$suite" -p 'test_*.py' -v \
              >"$evidence/tests-$suite.log" 2>&1
          done
          python3 -m compileall -q scripts tests
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Format test and strictly lint root workspace
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/heptabao-v1.3.1-$SOURCE_KIND/root"
          cargo +1.98.0 fmt --all -- --check >"$evidence/rust-fmt.log" 2>&1
          cargo +1.98.0 test --locked --workspace --all-targets \
            >"$evidence/rust-test.log" 2>&1
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings \
            >"$evidence/rust-clippy.log" 2>&1
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Execute and classify P0 transport evidence
        shell: bash
        env:
          HEPTABAO_P0_AUDIT_PATH: ${{ runner.temp }}/p0-audit-${{ matrix.source_kind }}.log
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/heptabao-v1.3.1-$SOURCE_KIND/p0"
          stderr="$evidence/server.stderr"
          cargo +1.98.0 run --quiet --locked -p heptabao-p0-server \
            >"$evidence/server.stdout" 2>"$stderr" &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          set +e
          python3 scripts/p0_transport_exact_v1.py \
            --stderr "$stderr" \
            --audit "$HEPTABAO_P0_AUDIT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$SOURCE_SHA" \
            --tree "$EXPECTED_TREE_SHA" \
            >"$evidence/raw-result.json"
          raw_rc=$?
          python3 scripts/classify_p0_transport_evidence_v1.py \
            --input "$evidence/raw-result.json" \
            --output "$evidence/classified-result.json" \
            >"$evidence/classification.log" 2>&1
          classify_rc=$?
          set -e
          cp "$HEPTABAO_P0_AUDIT_PATH" "$evidence/audit.log" 2>/dev/null || true
          test "$raw_rc" -eq 0
          test "$classify_rc" -eq 0
          python3 scripts/validate_p0_transport_evidence_v2.py \
            --input "$evidence/classified-result.json" \
            --expected-commit "$SOURCE_SHA" \
            --expected-tree "$EXPECTED_TREE_SHA" \
            --expected-repository "$GITHUB_REPOSITORY" \
            | tee "$evidence/validation.log"
          test -s "$evidence/audit.log"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile lint and execute complete H02 matrix
        shell: bash
        run: |
          set +e
          evidence="$RUNNER_TEMP/heptabao-v1.3.1-$SOURCE_KIND/h02"
          manifest=probes/h02/openraft-tokio/Cargo.toml
          cargo +1.88.0 metadata --locked --format-version 1 --manifest-path "$manifest" \
            >"$evidence/metadata.json" 2>"$evidence/metadata.stderr"
          metadata_rc=$?
          cargo +1.98.0 fmt --manifest-path "$manifest" --all -- --check \
            >"$evidence/fmt.log" 2>&1
          fmt_rc=$?
          compile_rc=0
          for toolchain in 1.88.0 1.98.0; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/h02-$SOURCE_KIND-compile-$toolchain"
            cargo +"$toolchain" test --locked --all-targets --manifest-path "$manifest" \
              >"$evidence/test-$toolchain.log" 2>&1 || compile_rc=1
            cargo +"$toolchain" clippy --locked --all-targets --manifest-path "$manifest" -- -D warnings \
              >"$evidence/clippy-$toolchain.log" 2>&1 || compile_rc=1
            rm -rf "$CARGO_TARGET_DIR"
          done
          python3 scripts/h02_exact_head_matrix_v1.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref "exec-v1.3.1-$SOURCE_KIND" \
            --commit "$SOURCE_SHA" \
            --tree "$EXPECTED_TREE_SHA" \
            --manifest "$manifest" \
            --output-dir "$evidence/matrix" \
            --cargo-target-root "$RUNNER_TEMP/h02-$SOURCE_KIND-matrix-target" \
            --entry-timeout-seconds 240 \
            >"$evidence/matrix-runner.log" 2>&1
          matrix_rc=$?
          printf 'metadata=%s\nfmt=%s\ncompile=%s\nmatrix=%s\n' \
            "$metadata_rc" "$fmt_rc" "$compile_rc" "$matrix_rc" \
            >"$evidence/exits.txt"
          rm -rf "$RUNNER_TEMP/h02-$SOURCE_KIND-matrix-target"
          set -e
          grep -qx 'metadata=0' "$evidence/exits.txt"
          grep -qx 'fmt=0' "$evidence/exits.txt"
          grep -qx 'compile=0' "$evidence/exits.txt"
          grep -qx 'matrix=0' "$evidence/exits.txt"
          python3 - "$evidence/matrix/matrix-summary.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              summary = json.load(handle)
          assert summary["result"] == "PASS", summary
          assert summary["matrix"]["executed_entry_count"] == 24, summary
          assert summary["counts"] == {
              "pass": 24,
              "fail": 0,
              "blocked": 0,
              "unknown": 0,
              "unexecuted": 0,
          }, summary
          assert summary["qualification"] is False
          assert summary["compatibility_claim"] is False
          assert summary["selection_effect"] == "NONE"
          assert summary["authority_effect"] == "NONE"
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Emit bounded executor receipt
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/heptabao-v1.3.1-$SOURCE_KIND"
          python3 - "$evidence" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          def digest(path: Path) -> str:
              return "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()

          receipt = {
              "schema": "heptabao.v1-3-1-isolated-executor-receipt.v1",
              "source": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "kind": os.environ["SOURCE_KIND"],
                  "commit": os.environ["SOURCE_SHA"],
                  "tree": os.environ["EXPECTED_TREE_SHA"],
                  "head": os.environ["EXPECTED_HEAD_SHA"],
                  "base": os.environ["EXPECTED_BASE_SHA"],
                  "merge": os.environ["EXPECTED_MERGE_SHA"],
              },
              "runner": {
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "job": os.environ["GITHUB_JOB"],
                  "name": os.environ.get("RUNNER_NAME", ""),
                  "os": os.environ.get("RUNNER_OS", ""),
                  "arch": os.environ.get("RUNNER_ARCH", ""),
              },
              "evidence": {
                  "source_binding": digest(root / "root/source-binding.txt"),
                  "p0": digest(root / "p0/classified-result.json"),
                  "h02": digest(root / "h02/matrix/matrix-summary.json"),
              },
              "technical_result": "PASS",
              "independent_review": False,
              "qualification": False,
              "compatibility_claim": False,
              "selected_candidates": [],
              "selection_effect": "NONE",
              "production_authority": False,
              "migration_authority": False,
              "release_authority": False,
              "authority_effect": "NONE",
          }
          (root / "isolated-executor-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload complete diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1.3.1-isolated-${{ matrix.source_kind }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/heptabao-v1.3.1-${{ matrix.source_kind }}/
          if-no-files-found: error
          retention-days: 30
