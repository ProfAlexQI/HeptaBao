name: export-final-closure-executor-slim

on:
  push:
    branches:
      - "exec/v1-3-1-final-repository-closure-v2"

permissions:
  contents: read

concurrency:
  group: export-final-closure-executor-slim
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout exact executor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind and archive exact executor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'repository=%s\ncommit=%s\ntree=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$(git rev-parse 'HEAD^{tree}')" \
            > "$RUNNER_TEMP/executor-binding.txt"
          tar -cf "$RUNNER_TEMP/final-closure-executor.tar" \
            bootstrap/v1.3.1-final-repository-closure
          sha256sum "$RUNNER_TEMP/final-closure-executor.tar" \
            > "$RUNNER_TEMP/final-closure-executor.tar.sha256"

      - name: Upload exact executor snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-closure-executor-${{ github.sha }}
          path: |
            ${{ runner.temp }}/executor-binding.txt
            ${{ runner.temp }}/final-closure-executor.tar
            ${{ runner.temp }}/final-closure-executor.tar.sha256
          if-no-files-found: error
          retention-days: 1
