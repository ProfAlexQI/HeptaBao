name: apply-h02-remaining-blocker-fixes-v4-linux-arm

on:
  push:
    branches: ["codex/h02-final-gap-closure-v1"]
    paths:
      - ".github/workflows/apply-h02-remaining-blocker-fixes-v3-linux-arm.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-h02-remaining-blocker-fixes-v4
  cancel-in-progress: true

jobs:
  apply-verify-and-commit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Checkout exact closure branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/h02-final-gap-closure-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install plan validation dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt

      - name: Syntax-check and apply audited repairs
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/apply_h02_remaining_blocker_fixes_v4.py \
            scripts/verify_h02_remaining_blocker_fixes_v4.py
          python3 scripts/apply_h02_remaining_blocker_fixes_v4.py

      - name: Validate plans, schemas and evidence semantics
        run: |
          set -euo pipefail
          python3 scripts/validate_h02_candidate_adapters_v1.py
          python3 scripts/validate_h02_openraft_inmemory_cluster_v1.py
          python3 scripts/validate_h02_openraft_fault_lab_v1.py
          python3 scripts/validate_h02_blocker_closure_v1.py
          python3 scripts/h02_dependency_probe_v1.py validate-matrix
          python3 -m unittest \
            tests/platform/test_h02_dependency_probe_v1.py \
            tests/platform/test_h02_candidate_adapter_harness_v1.py \
            tests/platform/test_h02_openraft_inmemory_cluster_v1.py \
            tests/platform/test_h02_linearizability_checker_v1.py \
            tests/platform/test_h02_openraft_fault_lab_evidence_v1.py \
            tests/platform/test_h02_blocker_closure_evidence_v1.py \
            -v

      - name: Install Rust qualification toolchains
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rustup component add rustfmt --toolchain 1.85.0
          rustup toolchain install 1.98.0 --profile minimal
          rustup component add rustfmt --toolchain 1.98.0

      - name: Resolve and verify exact OpenRaft source graph
        run: |
          set -euo pipefail
          manifest=probes/h02/openraft-tokio/Cargo.toml
          cargo +1.85.0 generate-lockfile --manifest-path "$manifest"
          python3 scripts/verify_h02_remaining_blocker_fixes_v4.py \
            lock probes/h02/openraft-tokio/Cargo.lock
          cargo +1.85.0 fmt --manifest-path "$manifest" -- --check

      - name: Execute repaired probes on Rust 1.85
        run: |
          set -euo pipefail
          manifest=probes/h02/openraft-tokio/Cargo.toml
          cargo +1.85.0 test --locked --all-targets --manifest-path "$manifest"
          cargo +1.85.0 run --quiet --locked --manifest-path "$manifest" --bin heptabao-h02-openraft-inmemory-cluster -- --seed 0x5eed20260828cafe > /tmp/inmemory-1.85.jsonl
          python3 scripts/verify_h02_remaining_blocker_fixes_v4.py inmemory /tmp/inmemory-1.85.jsonl
          cargo +1.85.0 run --quiet --locked --manifest-path "$manifest" --bin heptabao-h02-openraft-fault-lab -- --mode hostile-snapshot-parent --seed 0x5eed20260828cafe > /tmp/hostile-1.85.json
          python3 scripts/verify_h02_remaining_blocker_fixes_v4.py hostile /tmp/hostile-1.85.json
          cargo +1.85.0 run --quiet --locked --manifest-path "$manifest" --bin heptabao-h02-openraft-blocker-closure-lab -- --mode all --seed 0x5eed20260828cafe > /tmp/blocker-1.85.json
          python3 scripts/verify_h02_remaining_blocker_fixes_v4.py blocker /tmp/blocker-1.85.json

      - name: Execute repaired probes on Rust 1.98
        run: |
          set -euo pipefail
          manifest=probes/h02/openraft-tokio/Cargo.toml
          cargo +1.98.0 fmt --manifest-path "$manifest" -- --check
          cargo +1.98.0 test --locked --all-targets --manifest-path "$manifest"
          cargo +1.98.0 run --quiet --locked --manifest-path "$manifest" --bin heptabao-h02-openraft-inmemory-cluster -- --seed 0xc0ffee123456789a > /tmp/inmemory-1.98.jsonl
          python3 scripts/verify_h02_remaining_blocker_fixes_v4.py inmemory /tmp/inmemory-1.98.jsonl
          cargo +1.98.0 run --quiet --locked --manifest-path "$manifest" --bin heptabao-h02-openraft-fault-lab -- --mode hostile-snapshot-parent --seed 0xc0ffee123456789a > /tmp/hostile-1.98.json
          python3 scripts/verify_h02_remaining_blocker_fixes_v4.py hostile /tmp/hostile-1.98.json
          cargo +1.98.0 run --quiet --locked --manifest-path "$manifest" --bin heptabao-h02-openraft-blocker-closure-lab -- --mode all --seed 0xc0ffee123456789a > /tmp/blocker-1.98.json
          python3 scripts/verify_h02_remaining_blocker_fixes_v4.py blocker /tmp/blocker-1.98.json

      - name: Commit repaired source and remove one-shot maintenance surface
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-h02-remaining-blocker-fixes-v3.yml \
            .github/workflows/apply-h02-remaining-blocker-fixes-v3-macos.yml \
            .github/workflows/apply-h02-remaining-blocker-fixes-v3-macos-intel.yml \
            .github/workflows/apply-h02-remaining-blocker-fixes-v3-linux-arm.yml \
            scripts/apply_h02_remaining_blocker_fixes_v4.py \
            scripts/verify_h02_remaining_blocker_fixes_v4.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(h02): close OpenRaft execution and source-binding blockers"
          git push origin HEAD:codex/h02-final-gap-closure-v1
