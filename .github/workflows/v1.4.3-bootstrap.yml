name: v1.4.3-bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - codex/plan-v1.4.2-recovery-foundation-v1
    paths:
      - .bootstrap/v1.4.3/**
      - .github/workflows/v1.4.3-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1.4.3-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout exact staged head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact staged source
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test "${{ github.event.pull_request.head.ref }}" = "codex/plan-v1.4.3-descriptor-fencing-v1"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'repository=%s\nstaged_commit=%s\nstaged_tree=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$GITHUB_REPOSITORY" "$expected" "$(git rev-parse HEAD^{tree})" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            >"$RUNNER_TEMP/v1.4.3-source-binding.txt"

      - name: Install exact Python dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install Python and Rust 1.98 dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustc +1.98.0 --version --verbose
          cargo +1.98.0 --version --verbose

      - name: Safely materialize exact V1.4.3 candidate
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/heptabao-v1.4.3-candidate.tar.gz"
          cat \
            .bootstrap/v1.4.3/part-00.b64 \
            .bootstrap/v1.4.3/part-01.b64 \
            .bootstrap/v1.4.3/part-02.b64 \
            .bootstrap/v1.4.3/part-03.b64 \
            .bootstrap/v1.4.3/part-04.b64 \
            | tr -d '\r\n' \
            | base64 --decode >"$archive"
          echo "df44545eae17432e584fb5743089ebadd7a17347716beadcc5da702972bd225d  $archive" \
            | sha256sum --check --strict
          python - "$archive" <<'PY'
          import os
          import stat
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          expected = {
              '.github/workflows/plan-v1.4.3-descriptor-fencing.yml',
              'Cargo.lock',
              'Cargo.toml',
              'crates/heptabao-filesystem-guard/Cargo.toml',
              'crates/heptabao-filesystem-guard/src/lib.rs',
              'crates/heptabao-single-node-journal/Cargo.toml',
              'crates/heptabao-single-node-journal/src/lib.rs',
              'crates/heptabao-single-node-store/Cargo.toml',
              'crates/heptabao-single-node-store/src/lib.rs',
              'docs/plan/HEPTABAO_PLAN_V1_4_3_DESCRIPTOR_ANCHOR_AND_WRITER_FENCING.md',
              'docs/storage/HEPTABAO_DESCRIPTOR_ANCHOR_AND_WRITER_FENCE_V1.md',
              'planning/HEPTABAO_BLOCKER_REGISTER_V1_4_3.yaml',
              'planning/HEPTABAO_NORMATIVE_DOCUMENT_MANIFEST_V1_4_3.yaml',
              'planning/HEPTABAO_V1_4_3_DESCRIPTOR_FENCING_STATUS.yaml',
              'schemas/heptabao_normative_document_manifest_v1_4_3.schema.json',
              'scripts/validate_plan_v1_4_3.py',
              'scripts/validate_v1_4_3_inherited_surface.py',
              'tests/plan/test_plan_v1_4_3.py',
          }
          root = Path.cwd().resolve()
          archive = Path(sys.argv[1])
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              names = [member.name for member in members]
              if len(names) != len(expected) or set(names) != expected:
                  raise SystemExit(f'archive member set drifted: {names!r}')
              if len(names) != len(set(names)):
                  raise SystemExit('archive contains duplicate paths')
              total = 0
              for member in members:
                  pure = PurePosixPath(member.name)
                  if pure.is_absolute() or '..' in pure.parts or '.' in pure.parts:
                      raise SystemExit(f'unsafe archive path: {member.name!r}')
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(
                          f'archive member is not a regular file: {member.name!r}'
                      )
                  if member.size < 0 or member.size > 2 * 1024 * 1024:
                      raise SystemExit(f'archive member size is invalid: {member.name!r}')
                  total += member.size
              if total > 8 * 1024 * 1024:
                  raise SystemExit('archive expands beyond the candidate budget')
              by_name = {member.name: member for member in members}
              for name in sorted(expected):
                  pure = PurePosixPath(name)
                  target = root.joinpath(*pure.parts)
                  current = root
                  for part in pure.parts[:-1]:
                      current = current / part
                      if current.exists():
                          mode = os.lstat(current).st_mode
                          if stat.S_ISLNK(mode) or not stat.S_ISDIR(mode):
                              raise SystemExit(f'unsafe candidate parent: {current}')
                      else:
                          current.mkdir()
                  resolved_parent = target.parent.resolve()
                  if root != resolved_parent and root not in resolved_parent.parents:
                      raise SystemExit(f'candidate target escapes repository: {name!r}')
                  if target.exists() and stat.S_ISLNK(os.lstat(target).st_mode):
                      raise SystemExit(f'candidate target is a symlink: {name!r}')
                  stream = handle.extractfile(by_name[name])
                  if stream is None:
                      raise SystemExit(f'cannot read archive member: {name!r}')
                  data = stream.read()
                  if len(data) != by_name[name].size:
                      raise SystemExit(f'truncated archive member: {name!r}')
                  target.write_bytes(data)
          PY
          rm -rf .bootstrap/v1.4.3
          rm -f .github/workflows/v1.4.3-bootstrap.yml
          test ! -e .bootstrap/v1.4.3
          test ! -e .github/workflows/v1.4.3-bootstrap.yml

      - name: Run all current and frozen gates
        id: gates
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cat >"$RUNNER_TEMP/run-v1.4.3-gates.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          baseline="34e8dc0caceb84288d4ef61f79cd7ca062718b63"

          cargo +1.98.0 fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(v1.4.3): add descriptor anchoring and writer fencing"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git diff --name-status --no-renames "$baseline" HEAD \
            >"$RUNNER_TEMP/v1.4.3-delta.tsv"
          python - "$RUNNER_TEMP/v1.4.3-delta.tsv" <<'PY'
          import sys
          from pathlib import Path

          expected = {
              '.github/workflows/plan-v1.4.3-descriptor-fencing.yml': 'A',
              'Cargo.lock': 'M',
              'Cargo.toml': 'M',
              'crates/heptabao-filesystem-guard/Cargo.toml': 'A',
              'crates/heptabao-filesystem-guard/src/lib.rs': 'A',
              'crates/heptabao-single-node-journal/Cargo.toml': 'M',
              'crates/heptabao-single-node-journal/src/lib.rs': 'M',
              'crates/heptabao-single-node-store/Cargo.toml': 'M',
              'crates/heptabao-single-node-store/src/lib.rs': 'M',
              'docs/plan/HEPTABAO_PLAN_V1_4_3_DESCRIPTOR_ANCHOR_AND_WRITER_FENCING.md': 'A',
              'docs/storage/HEPTABAO_DESCRIPTOR_ANCHOR_AND_WRITER_FENCE_V1.md': 'A',
              'planning/HEPTABAO_BLOCKER_REGISTER_V1_4_3.yaml': 'A',
              'planning/HEPTABAO_NORMATIVE_DOCUMENT_MANIFEST_V1_4_3.yaml': 'A',
              'planning/HEPTABAO_V1_4_3_DESCRIPTOR_FENCING_STATUS.yaml': 'A',
              'schemas/heptabao_normative_document_manifest_v1_4_3.schema.json': 'A',
              'scripts/validate_plan_v1_4_3.py': 'A',
              'scripts/validate_v1_4_3_inherited_surface.py': 'A',
              'tests/plan/test_plan_v1_4_3.py': 'A',
          }
          actual = {}
          for line in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              status, path = line.split('\t', 1)
              if path in actual:
                  raise SystemExit(f'duplicate Git delta path: {path}')
              actual[path] = status
          if actual != expected:
              raise SystemExit(f'V1.4.3 final Git delta drifted: {actual!r}')
          PY

          python scripts/validate_plan_v1_4_3.py
          python scripts/validate_v1_4_3_inherited_surface.py
          python -m unittest discover -s tests/plan -p 'test_plan_v1_4_3.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v

          historical_root="$RUNNER_TEMP/v1.4.2-baseline"
          cleanup() {
            git worktree remove --force "$historical_root" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "$historical_root" "$baseline"
          (
            cd "$historical_root"
            python scripts/validate_plan_v1_4_2.py
            python scripts/validate_v1_4_2_inherited_surface.py
            python -m unittest discover -s tests/plan -p 'test_plan_v1_4_2.py' -v
            python -m unittest discover -s tests/platform -p 'test_*.py' -v
            python -m unittest discover -s tests/oracle -p 'test_*.py' -v
            cargo +1.98.0 fmt --all -- --check
            cargo +1.98.0 test --locked --workspace --all-targets
            cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          )
          cleanup
          trap - EXIT

          cargo +1.98.0 metadata --locked --no-deps --format-version 1 \
            >"$RUNNER_TEMP/v1.4.3-cargo-metadata.json"
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings

          python - <<'PY'
          from pathlib import Path
          import yaml

          status = yaml.safe_load(
              Path('planning/HEPTABAO_V1_4_3_DESCRIPTOR_FENCING_STATUS.yaml')
              .read_text(encoding='utf-8')
          )
          expected = {
              'qualification': False,
              'compatibility_claim': False,
              'selected_candidates': [],
              'selection_effect': 'NONE',
              'production_authority': False,
              'migration_authority': False,
              'release_authority': False,
              'authority_effect': 'NONE',
          }
          if status.get('claims') != expected:
              raise SystemExit('V1.4.3 authority boundary drifted')
          PY

          printf 'candidate_commit=%s\ncandidate_tree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" \
            >>"$RUNNER_TEMP/v1.4.3-source-binding.txt"
          SH
          chmod 0700 "$RUNNER_TEMP/run-v1.4.3-gates.sh"
          "$RUNNER_TEMP/run-v1.4.3-gates.sh" \
            >"$RUNNER_TEMP/v1.4.3-gates.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/v1.4.3-gates.log"
          printf 'status=%s\n' "$status" >>"$GITHUB_OUTPUT"
          exit 0

      - name: Package exact formatted candidate and diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            .github/workflows/plan-v1.4.3-descriptor-fencing.yml
            Cargo.lock
            Cargo.toml
            crates/heptabao-filesystem-guard/Cargo.toml
            crates/heptabao-filesystem-guard/src/lib.rs
            crates/heptabao-single-node-journal/Cargo.toml
            crates/heptabao-single-node-journal/src/lib.rs
            crates/heptabao-single-node-store/Cargo.toml
            crates/heptabao-single-node-store/src/lib.rs
            docs/plan/HEPTABAO_PLAN_V1_4_3_DESCRIPTOR_ANCHOR_AND_WRITER_FENCING.md
            docs/storage/HEPTABAO_DESCRIPTOR_ANCHOR_AND_WRITER_FENCE_V1.md
            planning/HEPTABAO_BLOCKER_REGISTER_V1_4_3.yaml
            planning/HEPTABAO_NORMATIVE_DOCUMENT_MANIFEST_V1_4_3.yaml
            planning/HEPTABAO_V1_4_3_DESCRIPTOR_FENCING_STATUS.yaml
            schemas/heptabao_normative_document_manifest_v1_4_3.schema.json
            scripts/validate_plan_v1_4_3.py
            scripts/validate_v1_4_3_inherited_surface.py
            tests/plan/test_plan_v1_4_3.py
          )
          for path in "${paths[@]}"; do
            test -f "$path"
          done
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 \
            --numeric-owner --format=ustar -cf \
            "$RUNNER_TEMP/heptabao-v1.4.3-formatted-candidate.tar" \
            "${paths[@]}"
          gzip -n -f "$RUNNER_TEMP/heptabao-v1.4.3-formatted-candidate.tar"
          (
            cd "$RUNNER_TEMP"
            sha256sum heptabao-v1.4.3-formatted-candidate.tar.gz \
              >heptabao-v1.4.3-formatted-candidate.tar.gz.sha256
          )
          git status --porcelain=v1 --untracked-files=all \
            >"$RUNNER_TEMP/v1.4.3-git-status.txt"
          git diff --stat "34e8dc0caceb84288d4ef61f79cd7ca062718b63" HEAD \
            >"$RUNNER_TEMP/v1.4.3-diff-stat.txt" || true

      - name: Upload exact V1.4.3 diagnostic package
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptabao-v1.4.3-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/v1.4.3-source-binding.txt
            ${{ runner.temp }}/v1.4.3-gates.log
            ${{ runner.temp }}/v1.4.3-delta.tsv
            ${{ runner.temp }}/v1.4.3-cargo-metadata.json
            ${{ runner.temp }}/v1.4.3-git-status.txt
            ${{ runner.temp }}/v1.4.3-diff-stat.txt
            ${{ runner.temp }}/heptabao-v1.4.3-formatted-candidate.tar.gz
            ${{ runner.temp }}/heptabao-v1.4.3-formatted-candidate.tar.gz.sha256
          if-no-files-found: warn
          retention-days: 3

      - name: Require complete V1.4.3 gate success
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.gates.outputs.status }}" = "0"
