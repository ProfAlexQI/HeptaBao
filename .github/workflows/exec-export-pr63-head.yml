name: exec export exact PR63 live head

on:
  push:
    branches:
      - exec/v1.4.7-post-merge-truth-materializer-v1

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable PR63 live head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 69ba5605a76458c84fa98ad39a39432837181c5b
          fetch-depth: 0
          persist-credentials: false

      - name: Bind and archive exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "69ba5605a76458c84fa98ad39a39432837181c5b"
          test "$(git rev-parse HEAD^{tree})" = "309d658c5ad2586e4670f30ac1fc6324b907c969"
          git archive --format=tar.gz --output="$RUNNER_TEMP/heptabao-pr63-69ba5605.tar.gz" HEAD
          git bundle create "$RUNNER_TEMP/heptabao-pr63-69ba5605.bundle" HEAD
          sha256sum "$RUNNER_TEMP/heptabao-pr63-69ba5605.tar.gz" "$RUNNER_TEMP/heptabao-pr63-69ba5605.bundle"

      - name: Upload immutable source archive
        uses: actions/upload-artifact@v4
        with:
          name: heptabao-pr63-69ba5605-source
          path: |
            ${{ runner.temp }}/heptabao-pr63-69ba5605.tar.gz
            ${{ runner.temp }}/heptabao-pr63-69ba5605.bundle
          if-no-files-found: error
          retention-days: 1
