name: exec export exact PR63 live head

on:
  push:
    branches:
      - exec/v1.4.7-post-merge-truth-materializer-v1

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable PR63 live head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: d23614c05b43869c2cb8ecdd1c5148d9036886c4
          fetch-depth: 0
          persist-credentials: false

      - name: Bind and archive exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d23614c05b43869c2cb8ecdd1c5148d9036886c4"
          test "$(git rev-parse HEAD^{tree})" = "a0704cdcb3c655f8af3079e85851c822692a5351"
          git archive --format=tar.gz --output="$RUNNER_TEMP/heptabao-pr63-d23614c.tar.gz" HEAD
          git bundle create "$RUNNER_TEMP/heptabao-pr63-d23614c.bundle" HEAD
          sha256sum "$RUNNER_TEMP/heptabao-pr63-d23614c.tar.gz" "$RUNNER_TEMP/heptabao-pr63-d23614c.bundle"

      - name: Upload immutable source archive
        uses: actions/upload-artifact@v4
        with:
          name: heptabao-pr63-d23614c-source
          path: |
            ${{ runner.temp }}/heptabao-pr63-d23614c.tar.gz
            ${{ runner.temp }}/heptabao-pr63-d23614c.bundle
          if-no-files-found: error
          retention-days: 1
