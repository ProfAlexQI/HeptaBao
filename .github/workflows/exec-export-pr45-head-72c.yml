name: exec-export-pr45-head-72c-macos

on:
  push:
    branches: ["exec/export-pr45-head-72c-v1"]
    paths: [".github/workflows/exec-export-pr45-head-72c.yml"]

permissions:
  contents: read

concurrency:
  group: exec-export-pr45-head-72c-v1
  cancel-in-progress: true

jobs:
  export:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR45 head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 72c74536f6cd54b6faeca308d913ba52c21319e2
          fetch-depth: 1
          persist-credentials: false

      - name: Bind and archive exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "72c74536f6cd54b6faeca308d913ba52c21319e2"
          test "$(git rev-parse 'HEAD^{tree}')" = "43c82164210c8cf4823b81d3ebdd045b8ca3a8ea"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/export"
          printf 'repository=%s\ncommit=%s\ntree=%s\n' \
            "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" \
            > "$RUNNER_TEMP/export/source-binding.txt"
          git archive --format=tar --prefix=HeptaBao/ HEAD > "$RUNNER_TEMP/export/heptabao-pr45-head-72c.tar"
          shasum -a 256 "$RUNNER_TEMP/export/heptabao-pr45-head-72c.tar" > "$RUNNER_TEMP/export/heptabao-pr45-head-72c.tar.sha256"

      - name: Upload exact source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heptabao-pr45-head-72c
          path: ${{ runner.temp }}/export
          if-no-files-found: error
          retention-days: 1
