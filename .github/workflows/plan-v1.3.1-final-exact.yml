name: plan-v1.3.1-final-exact

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "docs/**"
      - "planning/**"
      - "probes/h02/openraft-tokio/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches: ["codex/plan-v1.3-gap-closure-v2"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-v1.3.1-final-exact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  root-and-plan:
    runs-on: ubuntu-slim
    timeout-minutes: 180
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/final-root"
          printf 'repository=%s\ncommit=%s\ntree=%s\nrunner=%s\n' \
            "$GITHUB_REPOSITORY" "$SOURCE_SHA" "$(git rev-parse 'HEAD^{tree}')" "$RUNNER_NAME" \
            | tee "$RUNNER_TEMP/final-root/source-binding.txt"
      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt
      - name: Execute every semantic and Python gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          for script in \
            validate_plan_v2.py validate_plan_v2_extensions.py validate_plan_v1_2.py \
            validate_plan_v1_2_1.py validate_plan_v1_2_2.py validate_plan_v1_3.py \
            validate_plan_v1_3_1.py validate_h01_h02_next_v1.py \
            validate_h02_candidate_adapters_v1.py validate_h02_openraft_inmemory_cluster_v1.py \
            validate_h02_openraft_fault_lab_v1.py validate_h02_blocker_closure_v1.py \
            validate_h02_exact_head_matrix_contract_v1.py validate_h02_pr40_reconciliation_v1.py; do
            python3 "scripts/$script"
          done
          for suite in oracle platform plan; do
            python3 -m unittest discover -s "tests/$suite" -p 'test_*.py' -v
          done
          python3 -m compileall -q scripts tests
      - name: Install exact Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs \
              -o "$RUNNER_TEMP/rustup-init.sh"
            sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Format test and lint complete root workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Upload root evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1.3.1-final-root-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final-root/
          if-no-files-found: error
          retention-days: 30

  p0-final-transport:
    needs: root-and-plan
    runs-on: ubuntu-slim
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs \
              -o "$RUNNER_TEMP/rustup-init.sh"
            sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.98.0 --profile minimal
      - name: Execute final socket and audit matrix
        shell: bash
        env:
          HEPTABAO_P0_BIND: 127.0.0.1:0
          HEPTABAO_P0_DEV_TOKEN: v1-3-1-development-root-token-000001
          HEPTABAO_P0_DEV_UNSEAL_KEY: v1-3-1-development-unseal-key-00001
          HEPTABAO_P0_AUDIT_PATH: ${{ runner.temp }}/p0-final/audit.log
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p0-final"
          stderr="$RUNNER_TEMP/p0-final/server.stderr"
          cargo +1.98.0 run --quiet --locked -p heptabao-p0-server \
            >"$RUNNER_TEMP/p0-final/server.stdout" 2>"$stderr" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          python3 scripts/p0_transport_exact_v1.py \
            --stderr "$stderr" --audit "$HEPTABAO_P0_AUDIT_PATH" \
            | tee "$RUNNER_TEMP/p0-final/matrix.log"
          test -s "$HEPTABAO_P0_AUDIT_PATH"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Upload P0 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1.3.1-final-p0-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p0-final/
          if-no-files-found: error
          retention-days: 30

  h02-final-exact-head:
    runs-on: ubuntu-slim
    timeout-minutes: 360
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install exact toolchains and dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs \
              -o "$RUNNER_TEMP/rustup-init.sh"
            sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          for toolchain in 1.88.0 1.98.0; do
            rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          done
      - name: Compile and retain every 24-entry outcome
        shell: bash
        run: |
          set +e
          root="$RUNNER_TEMP/h02-final"
          mkdir -p "$root"
          manifest=probes/h02/openraft-tokio/Cargo.toml
          cargo +1.88.0 metadata --locked --format-version 1 --manifest-path "$manifest" \
            >"$root/metadata.json" 2>"$root/metadata.stderr"
          metadata_rc=$?
          cargo +1.98.0 fmt --manifest-path "$manifest" --all -- --check >"$root/fmt.log" 2>&1
          fmt_rc=$?
          compile_rc=0
          for toolchain in 1.88.0 1.98.0; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/h02-final-target-$toolchain"
            cargo +"$toolchain" test --locked --all-targets --manifest-path "$manifest" \
              >"$root/test-$toolchain.log" 2>&1 || compile_rc=1
            cargo +"$toolchain" clippy --locked --all-targets --manifest-path "$manifest" -- -D warnings \
              >"$root/clippy-$toolchain.log" 2>&1 || compile_rc=1
            rm -rf "$CARGO_TARGET_DIR"
          done
          python3 scripts/h02_exact_head_matrix_v1.py \
            --repository "$GITHUB_REPOSITORY" --ref "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
            --commit "$SOURCE_SHA" --tree "$(git rev-parse 'HEAD^{tree}')" \
            --manifest "$manifest" --output-dir "$root/matrix" \
            --cargo-target-root "$RUNNER_TEMP/h02-final-matrix-target" \
            --entry-timeout-seconds 240 >"$root/matrix-runner.log" 2>&1
          matrix_rc=$?
          printf 'metadata=%s\nfmt=%s\ncompile=%s\nmatrix=%s\n' \
            "$metadata_rc" "$fmt_rc" "$compile_rc" "$matrix_rc" >"$root/exits.txt"
          exit 0
      - name: Upload H02 evidence before gate
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1.3.1-final-h02-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h02-final/
          if-no-files-found: error
          retention-days: 30
      - name: Require complete H02 PASS
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/h02-final"
          grep -qx 'metadata=0' "$root/exits.txt"
          grep -qx 'fmt=0' "$root/exits.txt"
          grep -qx 'compile=0' "$root/exits.txt"
          grep -qx 'matrix=0' "$root/exits.txt"
          python3 - "$root/matrix/matrix-summary.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1], encoding="utf-8"))
          assert summary["result"] == "PASS", summary
          assert summary["matrix"]["executed_entry_count"] == 24, summary
          assert summary["counts"] == {"pass": 24, "fail": 0, "blocked": 0, "unknown": 0, "unexecuted": 0}, summary
          assert summary["qualification"] is False
          assert summary["compatibility_claim"] is False
          assert summary["selection_effect"] == "NONE"
          assert summary["authority_effect"] == "NONE"
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  authority-sentinel:
    needs: [root-and-plan, p0-final-transport, h02-final-exact-head]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Require technical lanes and preserve authority boundary
        env:
          ROOT: ${{ needs.root-and-plan.result }}
          P0: ${{ needs.p0-final-transport.result }}
          H02: ${{ needs.h02-final-exact-head.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ROOT" = success
          test "$P0" = success
          test "$H02" = success
          echo "Technical exact-head gates PASS; qualification=false compatibility=false authority=NONE"
