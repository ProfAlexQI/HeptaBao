name: export-v1.3.1-source-slim

on:
  push:
    branches:
      - "exec/v1-3-1-source-export-slim-v1"

permissions:
  contents: read

concurrency:
  group: export-v1.3.1-source-slim
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source and create deterministic archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'repository=%s\ncommit=%s\ntree=%s\nparent=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$(git rev-parse 'HEAD^{tree}')" \
            "$(git rev-parse 'HEAD^')" > "$RUNNER_TEMP/source-binding.txt"
          git archive --format=tar --prefix=HeptaBao/ HEAD^ \
            > "$RUNNER_TEMP/heptabao-exact-source.tar"
          sha256sum "$RUNNER_TEMP/heptabao-exact-source.tar" \
            > "$RUNNER_TEMP/heptabao-exact-source.tar.sha256"

      - name: Upload exact parent source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heptabao-exact-parent-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/source-binding.txt
            ${{ runner.temp }}/heptabao-exact-source.tar
            ${{ runner.temp }}/heptabao-exact-source.tar.sha256
          if-no-files-found: error
          retention-days: 1
