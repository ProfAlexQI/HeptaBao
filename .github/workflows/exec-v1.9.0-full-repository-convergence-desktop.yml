name: exec V1.9.0 full repository convergence desktop

on:
  push:
    branches:
      - exec/v1.9.0-full-repository-convergence-v1
    paths:
      - .exec/trigger/v1.9.0-desktop

permissions:
  contents: write

concurrency:
  group: exec-v1.9.0-full-repository-convergence
  cancel-in-progress: true

jobs:
  converge:
    runs-on:
      - self-hosted
      - linux
      - x64
    timeout-minutes: 350
    steps:
      - name: Checkout exact convergence controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          clean: true

      - name: Bind trusted repository push and runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = TrillionniumFoundation/HeptaBao
          test "$GITHUB_REF" = refs/heads/exec/v1.9.0-full-repository-convergence-v1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_NAME" = desktop
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Archive exact convergence inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v1.9.0-desktop-controller-inputs-${{ github.run_id }}
          path: |
            .exec/augment_external_v2.py.gz.b64
            .exec/v1_9_payload/part-*
          if-no-files-found: error
          retention-days: 14

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Verify or restore canonical external V2 payload
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/augment_external_v2.py.gz"
          source="$RUNNER_TEMP/augment_external_v2.py"
          tr -d '\r\n' < .exec/augment_external_v2.py.gz.b64 | base64 --decode > "$archive"
          if python .exec/extract_verified_gzip.py \
              --input "$archive" \
              --output "$source" \
              --sha256 c97528017a6b4cb22acd32cd191fb88f26f5697015fb75035176ccb5ec98716b; then
            python -m py_compile "$source"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          else
            python .exec/repair_external_v2_payload.py --write
            tr -d '\r\n' < .exec/augment_external_v2.py.gz.b64 | base64 --decode > "$archive"
            python .exec/extract_verified_gzip.py \
              --input "$archive" \
              --output "$source" \
              --sha256 c97528017a6b4cb22acd32cd191fb88f26f5697015fb75035176ccb5ec98716b
            python -m py_compile "$source"
            test "$(git diff --name-only)" = ".exec/augment_external_v2.py.gz.b64"
            git diff --check
            git config user.name "HeptaBao convergence controller"
            git config user.email "heptabao-convergence@users.noreply.github.com"
            git add .exec/augment_external_v2.py.gz.b64
            git commit -m "fix(exec): restore exact external V2 materializer payload"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi

      - name: Install exact Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustc +1.98.0 --version --verbose
          cargo +1.98.0 --version --verbose

      - name: Execute full convergence controller
        shell: bash
        run: |
          set -euo pipefail
          python .exec/prepare_v1_9_controller.py \
            .exec/run_v1_9.sh "$RUNNER_TEMP/run_v1_9.sh"
          bash "$RUNNER_TEMP/run_v1_9.sh"

      - name: Export exact workflow admission inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v1.9.0-desktop-generated-workflows-${{ github.run_id }}
          path: planning/generated-workflows/*.yml
          if-no-files-found: error
          retention-days: 14
