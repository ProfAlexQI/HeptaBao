name: apply-v1-2-1-materialize-explicit-lifecycle-arm64

on:
  push:
    branches:
      - "exec/v1-2-1-lifecycle-materialize-arm64-v1"
    paths:
      - ".github/workflows/apply-v1-2-1-materialize-slim.yml"
      - ".github/workflows/explicit-generation-lifecycle.trigger"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v1-2-1-materialize-explicit-lifecycle-arm64
  cancel-in-progress: true

jobs:
  materialize-and-commit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout exact transition head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact source and install plan dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -m py_compile scripts/apply_v1_2_1_initialized_generation_guard.py
          python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt

      - name: Apply explicit lifecycle closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_v1_2_1_initialized_generation_guard.py

      - name: Remove all transition surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply_v1_2_1_initialized_generation_guard.py
          rm -f .github/workflows/apply-v1-2-1-initialized-generation-guard-arm.yml
          rm -f .github/workflows/apply-v1-2-1-initialized-generation-guard-macos.yml
          rm -f .github/workflows/apply-v1-2-1-materialize-slim.yml
          rm -f .github/workflows/explicit-generation-lifecycle.trigger

      - name: Validate materialized source and normative state
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_plan_v2.py
          python3 scripts/validate_plan_v2_extensions.py
          python3 scripts/validate_plan_v1_2.py
          python3 scripts/validate_plan_v1_2_1.py
          python3 scripts/validate_h02_exact_head_matrix_contract_v1.py
          python3 scripts/validate_h02_blocker_closure_v1.py
          python3 -m unittest discover -s tests/plan -p 'test_*.py' -v
          python3 -m unittest tests.platform.test_h02_exact_head_matrix_v1 -v
          git diff --check

      - name: Commit materialized source without authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(h02): materialize fail-closed durable lifecycle"
          git push origin HEAD:exec/v1-2-1-lifecycle-materialize-arm64-v1
