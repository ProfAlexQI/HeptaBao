name: exec-v1.3.1-repository-transfer-gap-closure

on:
  push:
    branches:
      - "exec/v1.3.1-repository-transfer-gap-closure-20260831"

permissions:
  contents: write

concurrency:
  group: exec-v1.3.1-repository-transfer-gap-closure
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET_BRANCH: codex/plan-v1.3-gap-closure-v2
      EXPECTED_PARENT: 866ceaec435b3da9f759d8dcb582252f0c48e5c4
      PATCH_B64_BYTES: "21440"
      PATCH_GZIP_SHA256: 4ab1f58f6078401a3de169419ce6b1db6318df724b9ca80001e120144ba8993d
      PATCH_SHA256: 41b794a4dcca27cd58538a81120666c54edbd84bfc79f4bd4c99f92a431abc37
    steps:
      - name: Checkout immutable execution payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: exec-source

      - name: Checkout exact target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
          path: target

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: target/requirements-plan.txt

      - name: Reconstruct, authenticate and apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/exec-v1.3.1-transfer"
          mkdir -p "$evidence"
          cat "$GITHUB_WORKSPACE"/exec-source/.heptabao-exec/patch.part-* > "$evidence/patch.gz.b64"
          test "$(wc -c < "$evidence/patch.gz.b64")" = "$PATCH_B64_BYTES"
          base64 --decode "$evidence/patch.gz.b64" > "$evidence/patch.gz"
          printf '%s  %s\n' "$PATCH_GZIP_SHA256" "$evidence/patch.gz" | sha256sum --check
          gzip --decompress --stdout "$evidence/patch.gz" > "$evidence/patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$evidence/patch" | sha256sum --check

          cd "$GITHUB_WORKSPACE/target"
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_PARENT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git apply --check "$evidence/patch"
          git apply --index "$evidence/patch"
          git diff --cached --check

          cat > "$evidence/expected-paths.txt" <<'PATHS'
          .github/workflows/plan-v1.3.1-head-and-merge-closure.yml
          docs/execution/HEPTABAO_V1_3_1_FINAL_CLOSURE_PROTOCOL.md
          docs/plan/HEPTABAO_PLAN_V1_3_1_REPOSITORY_GAP_CLOSURE.md
          planning/HEPTABAO_V1_3_1_FINAL_CLOSURE_INPUT.yaml
          planning/HEPTABAO_V1_3_1_GAP_CLOSURE_STATUS.yaml
          probes/h02/openraft-tokio/src/bin/inmemory_cluster.rs
          schemas/heptabao_h02_exact_head_matrix_summary_v1.schema.json
          schemas/heptabao_v1_3_1_lane_arbitration_v1.schema.json
          schemas/heptabao_v1_3_1_technical_completion_receipt_v1.schema.json
          scripts/arbitrate_v1_3_1_lanes_v1.py
          scripts/classify_p0_transport_evidence_v1.py
          scripts/collect_github_job_identity_v1.py
          scripts/h02_exact_head_matrix_v1.py
          scripts/p0_transport_exact_core_v1.py
          scripts/render_canonical_project_state_v1.py
          scripts/validate_p0_transport_evidence_v2.py
          scripts/validate_plan_v1_3_1_legacy.py
          scripts/validate_v1_3_1_final_closure_v1.py
          scripts/validate_v1_3_1_technical_completion_receipt_v1.py
          tests/plan/test_p0_transport_evidence_classification_v2.py
          tests/plan/test_plan_v1_2.py
          tests/plan/test_v1_3_1_final_closure.py
          tests/plan/test_v1_3_1_technical_completion_receipt.py
          tests/platform/test_h02_exact_head_matrix_v1.py
          PATHS
          git diff --cached --name-only | LC_ALL=C sort > "$evidence/actual-paths.txt"
          LC_ALL=C sort -o "$evidence/expected-paths.txt" "$evidence/expected-paths.txt"
          diff -u "$evidence/expected-paths.txt" "$evidence/actual-paths.txt"

      - name: Install locked plan dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --requirement "$GITHUB_WORKSPACE/target/requirements-plan.txt"

      - name: Execute complete Python and semantic gate
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/exec-v1.3.1-transfer"
          cd "$GITHUB_WORKSPACE/target"
          validators=(
            scripts/validate_plan_v2.py
            scripts/validate_plan_v2_extensions.py
            scripts/validate_plan_v1_2.py
            scripts/validate_plan_v1_2_1.py
            scripts/validate_plan_v1_2_2.py
            scripts/validate_plan_v1_3.py
            scripts/validate_plan_v1_3_1.py
            scripts/validate_v1_3_1_final_closure_v1.py
            scripts/validate_provenance_v1.py
            scripts/validate_evidence_objects_v1.py
            scripts/validate_oracle_foundation_v1.py
            scripts/validate_repository_identity_v1.py
            scripts/validate_dependency_bakeoff_v1.py
            scripts/validate_dependency_execution_profiles_v1.py
            scripts/validate_dependency_registry_evidence_v1.py
            scripts/validate_dependency_research_captures_v1.py
            scripts/validate_h01_h02_next_v1.py
            scripts/validate_h02_seeded_behavior_plan_v1.py
            scripts/validate_h02_candidate_adapters_v1.py
            scripts/validate_h02_openraft_inmemory_cluster_v1.py
            scripts/validate_h02_openraft_fault_lab_v1.py
            scripts/validate_h02_blocker_closure_v1.py
            scripts/validate_h02_exact_head_matrix_contract_v1.py
            scripts/validate_h02_pr40_reconciliation_v1.py
          )
          : > "$evidence/validators.log"
          for script in "${validators[@]}"; do
            python3 "$script" | tee -a "$evidence/validators.log"
          done
          for suite in oracle platform plan; do
            python3 -m unittest discover -s "tests/$suite" -p 'test_*.py' -v \
              > "$evidence/tests-$suite.log" 2>&1
          done
          python3 -m compileall -q scripts tests
          git diff --cached --check
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep -v '^M  ' || true)"

      - name: Verify exact H02 Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cd "$GITHUB_WORKSPACE/target"
          cargo +1.98.0 fmt --manifest-path probes/h02/openraft-tokio/Cargo.toml --all -- --check

      - name: Commit and fast-forward target branch
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/exec-v1.3.1-transfer"
          cd "$GITHUB_WORKSPACE/target"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_PARENT"
          git config user.name "Qian QI"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git commit -m "fix(v1.3.1): bind repository transfer and exact gate identity" \
            -m "Separate stable repository identity/current organization ownership from the designated source ratifier; update P0/H02 and receipt contracts; repair Gate-A YAML merge parsing; fix H02 rustfmt; add fail-closed transfer regressions." \
            -m "qualification=false\ncompatibility_claim=false\nselection_effect=NONE\nauthority_effect=NONE"
          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          test "$(git rev-list --parents -n 1 HEAD | awk '{print $2}')" = "$EXPECTED_PARENT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_PARENT" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
          printf 'repository=%s\nbranch=%s\nparent=%s\ncommit=%s\ntree=%s\npatch_sha256=%s\nqualification=false\nauthority_effect=NONE\n' \
            "$GITHUB_REPOSITORY" "$TARGET_BRANCH" "$EXPECTED_PARENT" "$commit" "$tree" "$PATCH_SHA256" \
            | tee "$evidence/execution-receipt.txt"
          touch "$evidence/target-pushed"

      - name: Upload execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: v1.3.1-repository-transfer-gap-closure-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exec-v1.3.1-transfer
          if-no-files-found: error
          retention-days: 30

      - name: Delete one-time execution branch after successful target push
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/exec-v1.3.1-transfer"
          if [[ -f "$evidence/target-pushed" ]]; then
            cd "$GITHUB_WORKSPACE/target"
            git push origin --delete "$GITHUB_REF_NAME" || true
          fi
