name: exec-materialize-v13-847-exact-slim

on:
  push:
    branches: ["exec/materialize-v13-a1e894-slim-v1"]

permissions:
  contents: write

concurrency:
  group: exec-materialize-v13-exact-slim-v1
  cancel-in-progress: true

env:
  TARGET_BRANCH: codex/plan-v1.3.5-exact-closure-v1
  TRANSPORT_SHA: 847b0a702a1404f60a4eccfc296544adf9eef868
  BASE_SHA: cedb6c95a5323f7004551087d75e2f57a1ec484a
  BASE_TREE: e0032b54bad2048802cd61f6bbc7d6d1f9ce4003
  ARCHIVE_SHA256: 99bea9f712ecd6dcc587b80a8d774e091f6e79184ca105c74a36d65ed8d12e05
  FINAL_TREE: e4f6c7fe363fd8b3da990642ecc9ac649ee7652d

jobs:
  materialize:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Checkout immutable transport source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TRANSPORT_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and bind exact V1.3 tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRANSPORT_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/v13"
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import tarfile
          from pathlib import Path

          repo = Path.cwd()
          root = Path(os.environ["RUNNER_TEMP"]) / "v13"
          parts = sorted(Path("bootstrap/v1.3-overlay").glob("part-*.b64"))
          assert len(parts) == 25, len(parts)
          encoded = b"".join(
              part.read_bytes().replace(b"\r", b"").replace(b"\n", b"")
              for part in parts
          )
          payload = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(payload).hexdigest() == os.environ["ARCHIVE_SHA256"]
          archive = root / "overlay.tar.xz"
          archive.write_bytes(payload)
          with tarfile.open(archive, "r:xz") as tar:
              members = tar.getmembers()
              for member in members:
                  target = (root / member.name).resolve()
                  assert target == root.resolve() or root.resolve() in target.parents
                  assert not member.issym() and not member.islnk()
              tar.extractall(root)

          overlay = root / "overlay"
          manifest = json.loads((root / "OVERLAY_MANIFEST.json").read_text(encoding="utf-8"))
          assert manifest["schema"] == "heptabao.v1-3-pr40-overlay-manifest.v1"
          assert manifest["exact_base"] == {
              "commit": os.environ["BASE_SHA"],
              "tree": os.environ["BASE_TREE"],
          }
          assert manifest["validated_local_result"]["tree"] == os.environ["FINAL_TREE"]
          assert manifest["deletions"] == []
          assert manifest["qualification"] is False
          assert manifest["compatibility_claim"] is False
          assert manifest["selection_effect"] == "NONE"
          assert manifest["authority_effect"] == "NONE"
          expected = set()
          for entry in manifest["entries"]:
              rel = Path(entry["path"])
              assert not rel.is_absolute() and ".." not in rel.parts
              assert rel.as_posix() not in expected
              expected.add(rel.as_posix())
              data = (overlay / rel).read_bytes()
              assert len(data) == entry["bytes"]
              assert hashlib.sha256(data).hexdigest() == entry["sha256"]
              destination = repo / rel
              destination.parent.mkdir(parents=True, exist_ok=True)
              temporary = destination.with_name(f".{destination.name}.v13.tmp")
              temporary.write_bytes(data)
              os.replace(temporary, destination)
              destination.chmod(0o755 if entry["executable"] else 0o644)
          actual = {
              path.relative_to(overlay).as_posix()
              for path in overlay.rglob("*")
              if path.is_file()
          }
          assert actual == expected
          PY
          rm -rf bootstrap/v1.3-overlay
          rm -f .github/workflows/materialize-v1.3-exact-overlay.yml
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$FINAL_TREE"

      - name: Create one exact-base commit and publish only the landing branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "$FINAL_TREE"
          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH"; then
            echo "target branch already exists; refusing non-lease overwrite" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit=$(printf '%s\n' 'feat(plan): materialize exact V1.3 source for V1.3.5 landing' | git commit-tree "$FINAL_TREE" -p "$BASE_SHA")
          test "$(git rev-parse "$commit^{tree}")" = "$FINAL_TREE"
          test "$(git rev-parse "$commit^")" = "$BASE_SHA"
          git push origin "$commit:refs/heads/$TARGET_BRANCH"
