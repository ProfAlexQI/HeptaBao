name: exec-materialize-v13-a1e894-arm64

on:
  push:
    branches: ["exec/materialize-v13-a1e894-slim-v1"]

permissions:
  contents: write

concurrency:
  group: exec-materialize-v13-a1e894-slim-v1
  cancel-in-progress: true

env:
  TARGET_BRANCH: codex/plan-v1.3-foundation-closure-v1
  TRANSPORT_SHA: a1e894eec0be36e768918a1240a406e0281ff283
  BASE_SHA: cedb6c95a5323f7004551087d75e2f57a1ec484a
  BASE_TREE: e0032b54bad2048802cd61f6bbc7d6d1f9ce4003
  ARCHIVE_SHA256: 99bea9f712ecd6dcc587b80a8d774e091f6e79184ca105c74a36d65ed8d12e05
  FINAL_TREE: e4f6c7fe363fd8b3da990642ecc9ac649ee7652d

jobs:
  materialize:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout exact transport source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TRANSPORT_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind source and reconstruct archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRANSPORT_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/v13"
          python3 - <<'PY'
          import base64, hashlib, os, tarfile
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "v13"
          parts = sorted(Path("bootstrap/v1.3-overlay").glob("part-*.b64"))
          assert len(parts) == 25, len(parts)
          encoded = b"".join(p.read_bytes().replace(b"\r", b"").replace(b"\n", b"") for p in parts)
          payload = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(payload).hexdigest() == os.environ["ARCHIVE_SHA256"]
          archive = root / "overlay.tar.xz"
          archive.write_bytes(payload)
          with tarfile.open(archive, "r:xz") as tar:
              for member in tar.getmembers():
                  target = (root / member.name).resolve()
                  assert target == root.resolve() or root.resolve() in target.parents
                  assert not member.issym() and not member.islnk()
              tar.extractall(root, filter="data")
          PY

      - name: Apply digest-bound overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          repo = Path.cwd()
          root = Path(os.environ["RUNNER_TEMP"]) / "v13"
          overlay = root / "overlay"
          manifest = json.loads((root / "OVERLAY_MANIFEST.json").read_text(encoding="utf-8"))
          assert manifest["schema"] == "heptabao.v1-3-pr40-overlay-manifest.v1"
          assert manifest["exact_base"] == {"commit": os.environ["BASE_SHA"], "tree": os.environ["BASE_TREE"]}
          assert manifest["validated_local_result"]["tree"] == os.environ["FINAL_TREE"]
          assert manifest["deletions"] == []
          assert manifest["qualification"] is False
          assert manifest["compatibility_claim"] is False
          assert manifest["selection_effect"] == "NONE"
          assert manifest["authority_effect"] == "NONE"
          expected = set()
          for entry in manifest["entries"]:
              rel = Path(entry["path"])
              assert not rel.is_absolute() and ".." not in rel.parts
              expected.add(rel.as_posix())
              data = (overlay / rel).read_bytes()
              assert len(data) == entry["bytes"]
              assert hashlib.sha256(data).hexdigest() == entry["sha256"]
              destination = repo / rel
              destination.parent.mkdir(parents=True, exist_ok=True)
              temporary = destination.with_name(f".{destination.name}.v13.tmp")
              temporary.write_bytes(data)
              os.replace(temporary, destination)
              destination.chmod(0o755 if entry["executable"] else 0o644)
          actual = {p.relative_to(overlay).as_posix() for p in overlay.rglob("*") if p.is_file()}
          assert actual == expected
          PY
          rm -rf bootstrap/v1.3-overlay
          rm -f .github/workflows/materialize-v1.3-exact-overlay.yml
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$FINAL_TREE"

      - name: Install validation dependencies
        shell: bash
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt

      - name: Validate exact final tree
        shell: bash
        run: |
          set -euo pipefail
          for validator in \
            validate_plan_v2.py validate_plan_v2_extensions.py validate_plan_v1_2.py \
            validate_plan_v1_2_1.py validate_plan_v1_2_2.py validate_plan_v1_3.py \
            validate_h01_h02_next_v1.py validate_h02_candidate_adapters_v1.py \
            validate_h02_openraft_inmemory_cluster_v1.py validate_h02_openraft_fault_lab_v1.py \
            validate_h02_blocker_closure_v1.py validate_h02_exact_head_matrix_contract_v1.py; do
            python3 "scripts/$validator"
          done
          python3 -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python3 -m unittest discover -s tests/platform -p 'test_*.py' -v
          python3 -m unittest discover -s tests/plan -p 'test_*.py' -v
          python3 scripts/validate_rust_source_surface_v1.py \
            crates/heptabao-authbus-contracts/src/lib.rs \
            crates/heptabao-p0-server/src/lib.rs \
            crates/heptabao-p0-server/src/main.rs \
            crates/heptabao-protocol/src/lib.rs
          python3 - <<'PY'
          import re
          from pathlib import Path
          patterns = [
              re.compile(r"(?mi)^\s*contents\s*:\s*write\s*$"),
              re.compile(r"(?mi)^\s*persist-credentials\s*:\s*true\s*$"),
              re.compile(r"(?mi)^\s*git\s+(?:commit|push|rebase|merge)\b"),
          ]
          bad = [str(p) for p in sorted(Path('.github/workflows').glob('*.y*ml')) if any(x.search(p.read_text(encoding='utf-8')) for x in patterns)]
          assert bad == [], bad
          PY
          test "$(git write-tree)" = "$FINAL_TREE"

      - name: Commit and update only the target branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(plan): materialize V1.3 protocol Authbus and P0 foundation"
          test "$(git rev-parse 'HEAD^{tree}')" = "$FINAL_TREE"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$TRANSPORT_SHA" origin "HEAD:refs/heads/$TARGET_BRANCH"
