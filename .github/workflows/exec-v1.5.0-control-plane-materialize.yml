name: exec V1.5.0 control-plane materializer

on:
  push:
    branches:
      - exec/v1.5.0-control-plane-materializer-v1

permissions:
  contents: write

concurrency:
  group: exec-v1.5.0-control-plane-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout execution controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Freeze generator and switch to current integration baseline
        shell: bash
        run: |
          set -euo pipefail
          cp .exec/materialize_v1_5_0.py "$RUNNER_TEMP/materialize_v1_5_0.py"
          cp .exec/patch_v1_5_0.py "$RUNNER_TEMP/patch_v1_5_0.py"
          python "$RUNNER_TEMP/patch_v1_5_0.py" "$RUNNER_TEMP/materialize_v1_5_0.py"
          python -m py_compile "$RUNNER_TEMP/materialize_v1_5_0.py"
          git fetch origin integration/v1.4.4-technical-candidate
          git switch --detach origin/integration/v1.4.4-technical-candidate
          git switch -C codex/plan-v1.5.0-control-plane-vertical-slice-v1
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'baseline_commit=%s\nbaseline_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Materialize V1.5.0 source and documentation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python "$RUNNER_TEMP/materialize_v1_5_0.py" .
          python scripts/render_module_source_truth_v1_5_0.py --check
          git diff --check

      - name: Validate V1.5.0 and all inherited Python contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_plan_v1_5_0.py
          python scripts/validate_plan_v1_4_7.py
          python scripts/validate_plan_v1_4_6.py
          python scripts/validate_plan_v1_4_5.py
          python scripts/validate_module_documentation_v1_4_4.py
          python -m unittest discover -s tests/plan -p 'test_*.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v

      - name: Install exact Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustc +1.98.0 --version --verbose
          cargo +1.98.0 --version --verbose

      - name: Validate locked expanded Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Publish clean candidate source
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .exec
          test ! -e .github/workflows/exec-v1.5.0-control-plane-materialize.yml
          test -z "$(git status --porcelain=v1 --untracked-files=all | grep '^?? target/' || true)"
          candidate_workflow=.github/workflows/plan-v1.5.0-control-plane-vertical-slice.yml
          test -f "$candidate_workflow"
          cp "$candidate_workflow" "$RUNNER_TEMP/plan-v1.5.0-control-plane-vertical-slice.yml"
          workflow_digest="$(sha256sum "$candidate_workflow" | awk '{print $1}')"
          git config user.name "HeptaBao execution controller"
          git config user.email "heptabao-exec@users.noreply.github.com"
          git add --all
          git reset -- "$candidate_workflow"
          rm "$candidate_workflow"
          git commit -m "feat(v1.5.0): implement mandatory control-plane vertical slice"
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          git push --force origin HEAD:refs/heads/codex/plan-v1.5.0-control-plane-vertical-slice-v1
          {
            echo '## V1.5.0 clean candidate source published'
            echo
            echo "- branch: \`codex/plan-v1.5.0-control-plane-vertical-slice-v1\`"
            echo "- source commit before workflow admission: \`$candidate_sha\`"
            echo "- source tree before workflow admission: \`$candidate_tree\`"
            echo "- validated candidate workflow SHA-256: \`$workflow_digest\`"
            echo '- workspace crates: 28'
            echo '- all plan/platform/oracle tests: PASS'
            echo '- Rust 1.98 fmt/test/strict-Clippy: PASS'
            echo '- workflow admission is a separate repository contents write'
            echo '- authority effect: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
