name: h02-apply-runner-blockers

on:
  pull_request:
    branches:
      - "codex/h02-os-durable-clock-supplychain-v1"
    paths:
      - ".github/workflows/h02-apply-runner-blockers.yml"
      - "scripts/apply_h02_runner_blocker_fixes.py"
  push:
    branches:
      - "codex/h02-final-gap-closure-v1"
    paths:
      - ".github/workflows/h02-apply-runner-blockers.yml"
      - "scripts/apply_h02_runner_blocker_fixes.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h02-apply-runner-blockers
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact closure branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/h02-final-gap-closure-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-plan.txt

      - name: Apply exact idempotent Runner-discovered fixes
        run: python scripts/apply_h02_runner_blocker_fixes.py

      - name: Validate full governance, plan, Oracle and H02 contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_plan_v2.py
          python scripts/validate_plan_v2_extensions.py
          python scripts/validate_provenance_v1.py
          python scripts/validate_evidence_objects_v1.py
          python scripts/validate_oracle_foundation_v1.py
          python scripts/validate_h01_h02_next_v1.py
          python scripts/validate_dependency_bakeoff_v1.py
          python scripts/validate_dependency_execution_profiles_v1.py
          python scripts/validate_dependency_registry_evidence_v1.py
          python scripts/validate_dependency_research_captures_v1.py
          python scripts/validate_h02_seeded_behavior_plan_v1.py
          python scripts/validate_h02_candidate_adapters_v1.py
          python scripts/validate_h02_openraft_inmemory_cluster_v1.py
          python scripts/validate_h02_openraft_fault_lab_v1.py
          python scripts/validate_h02_blocker_closure_v1.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Install exact Rust verification toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup toolchain install 1.85.0 --profile minimal
          rustup toolchain install 1.71.0 --profile minimal

      - name: Verify workspace formatting, tests and strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --workspace --all-targets --locked
          cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings

      - name: Verify OpenRaft exact-toolchain build seams
        shell: bash
        run: |
          set -euo pipefail
          for toolchain in 1.85.0 1.98.0; do
            work="$RUNNER_TEMP/openraft-$toolchain"
            rm -rf "$work"
            mkdir -p "$work"
            cp -a probes/h02/openraft-tokio/. "$work/"
            cargo +"$toolchain" generate-lockfile --manifest-path "$work/Cargo.toml"
            cargo +"$toolchain" test --locked --all-targets --manifest-path "$work/Cargo.toml"
          done

      - name: Verify rustls exact-toolchain build seams
        shell: bash
        run: |
          set -euo pipefail
          for profile in rustls-ring rustls-aws-lc; do
            for toolchain in 1.71.0 1.98.0; do
              root="$RUNNER_TEMP/$profile-$toolchain"
              work="$root/probe"
              rm -rf "$root"
              mkdir -p "$work"
              cp -a "probes/h02/$profile/." "$work/"
              cp probes/h02/rustls-public-fixtures.rs "$root/rustls-public-fixtures.rs"
              cargo +"$toolchain" generate-lockfile --manifest-path "$work/Cargo.toml"
              cargo +"$toolchain" test --locked --all-targets --manifest-path "$work/Cargo.toml"
            done
          done

      - name: Commit verified blocker-closure source batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "all source fixes were already present"
            exit 0
          fi
          git commit -m "fix(h02): close runner-discovered validation blockers"
          git push origin HEAD:codex/h02-final-gap-closure-v1
