name: h02-candidate-cross-platform-execution

on:
  push:
    branches: ["codex/h02-candidate-cross-platform-execution-v1"]
    paths:
      - ".github/workflows/h02-candidate-cross-platform-execution.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h02-candidate-cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-profile:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-15]
        variant:
          - tokio-1_71
          - tokio-1_98
          - rustls-ring-1_71
          - rustls-ring-1_98
          - rustls-aws-lc-1_71
          - rustls-aws-lc-1_98
          - openraft-1_85
          - openraft-1_98
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - name: Checkout exact technical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cbaaadbdf9d7dbcb773625d62757db1368d07e64
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "cbaaadbdf9d7dbcb773625d62757db1368d07e64"
          git diff --quiet
          git diff --cached --quiet

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned validation dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --requirement requirements-plan.txt

      - name: Resolve exact candidate profile
        id: profile
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          case "$VARIANT" in
            tokio-1_71)
              profile=tokio; toolchain=1.71.0; subdir=tokio-minimal; domain=runtime; scope=FULL_REFERENCE_CASE_SET ;;
            tokio-1_98)
              profile=tokio; toolchain=1.98.0; subdir=tokio-minimal; domain=runtime; scope=FULL_REFERENCE_CASE_SET ;;
            rustls-ring-1_71)
              profile=rustls-ring; toolchain=1.71.0; subdir=rustls-ring; domain=tls; scope=FULL_REFERENCE_CASE_SET ;;
            rustls-ring-1_98)
              profile=rustls-ring; toolchain=1.98.0; subdir=rustls-ring; domain=tls; scope=FULL_REFERENCE_CASE_SET ;;
            rustls-aws-lc-1_71)
              profile=rustls-aws-lc; toolchain=1.71.0; subdir=rustls-aws-lc; domain=tls; scope=FULL_REFERENCE_CASE_SET ;;
            rustls-aws-lc-1_98)
              profile=rustls-aws-lc; toolchain=1.98.0; subdir=rustls-aws-lc; domain=tls; scope=FULL_REFERENCE_CASE_SET ;;
            openraft-1_85)
              profile=openraft; toolchain=1.85.0; subdir=openraft-tokio; domain=raft; scope=API_SEAM_AND_FAILURE_MODEL_PARTIAL ;;
            openraft-1_98)
              profile=openraft; toolchain=1.98.0; subdir=openraft-tokio; domain=raft; scope=API_SEAM_AND_FAILURE_MODEL_PARTIAL ;;
            *) echo "unknown variant: $VARIANT" >&2; exit 2 ;;
          esac
          printf 'profile=%s\ntoolchain=%s\nsubdir=%s\ndomain=%s\nscope=%s\n' \
            "$profile" "$toolchain" "$subdir" "$domain" "$scope" >> "$GITHUB_OUTPUT"

      - name: Install exact Rust toolchain
        shell: bash
        env:
          TOOLCHAIN: ${{ steps.profile.outputs.toolchain }}
        run: |
          set -euo pipefail
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          host="$(rustup run "$TOOLCHAIN" rustc -vV | sed -n 's/^host: //p')"
          test -n "$host"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          rustup run "$TOOLCHAIN" rustc --version --verbose
          rustup run "$TOOLCHAIN" cargo --version --verbose
        id: rust

      - name: Validate repaired candidate binding
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_h02_candidate_adapters_v1.py
          python -m unittest tests/platform/test_h02_candidate_adapter_harness_v1.py -v

      - name: Build once and execute all three deterministic seeds
        id: execute
        shell: bash
        env:
          PROFILE: ${{ steps.profile.outputs.profile }}
          SUBDIR: ${{ steps.profile.outputs.subdir }}
          TOOLCHAIN: ${{ steps.profile.outputs.toolchain }}
          HOST: ${{ steps.rust.outputs.host }}
          SCOPE: ${{ steps.profile.outputs.scope }}
          DOMAIN: ${{ steps.profile.outputs.domain }}
          VARIANT: ${{ matrix.variant }}
          FIXED_SOURCE: cbaaadbdf9d7dbcb773625d62757db1368d07e64
        run: |
          set -u
          evidence="$RUNNER_TEMP/h02-candidate-evidence"
          probe_root="$RUNNER_TEMP/h02-candidate-probes"
          target_root="$RUNNER_TEMP/h02-candidate-target"
          rm -rf "$evidence" "$probe_root" "$target_root"
          mkdir -p "$evidence" "$probe_root"
          cp -a probes/h02/. "$probe_root/"
          manifest="$probe_root/$SUBDIR/Cargo.toml"
          export CARGO_TARGET_DIR="$target_root"

          build_status=0
          rustup run "$TOOLCHAIN" cargo generate-lockfile --manifest-path "$manifest" \
            >"$evidence/cargo-generate-lockfile.log" 2>&1 || build_status=$?
          if [ "$build_status" -eq 0 ]; then
            rustup run "$TOOLCHAIN" cargo test --locked --all-targets --manifest-path "$manifest" \
              >"$evidence/cargo-test.log" 2>&1 || build_status=$?
          fi
          printf '%s\n' "$build_status" > "$evidence/build-exit-code.txt"

          for seed in 0x5eed20260828cafe 0x8badf00d12345678 0xd15ea5e5cafef00d; do
            seed_name="${seed#0x}"
            entry="$evidence/$seed_name"
            mkdir -p "$entry/reference"
            execution_status="$build_status"
            if [ "$execution_status" -eq 0 ]; then
              rustup run "$TOOLCHAIN" cargo run --quiet --locked --manifest-path "$manifest" -- \
                --seed "$seed" >"$entry/adapter-output.jsonl" 2>"$entry/adapter-stderr.log" || execution_status=$?
            fi
            if [ "$execution_status" -eq 0 ]; then
              rustup run "$TOOLCHAIN" cargo run --quiet --locked --manifest-path "$manifest" -- \
                --seed "$seed" >"$entry/adapter-replay.jsonl" 2>"$entry/adapter-replay-stderr.log" || execution_status=$?
            fi
            printf '%s\n' "$execution_status" > "$entry/execution-exit-code.txt"

            python scripts/h02_seeded_behavior_harness_v1.py run \
              --domain "$DOMAIN" \
              --seed "$seed" \
              --source-commit "$FIXED_SOURCE" \
              --source-tree "$(git rev-parse 'HEAD^{tree}')" \
              --branch codex/h02-final-gap-closure-v1 \
              --environment-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_NAME}-${VARIANT}-${seed}-reference" \
              --executor-kind github-hosted \
              --runner-id github-api-enrichment-pending \
              --runner-name "$RUNNER_NAME" \
              --output-dir "$entry/reference"
            reference="$(find "$entry/reference" -maxdepth 1 -name "${DOMAIN}-*.json" -print -quit)"
            test -n "$reference"

            replay_arg=()
            if [ -f "$entry/adapter-replay.jsonl" ]; then
              replay_arg=(--replay-output "$entry/adapter-replay.jsonl")
            fi
            python scripts/h02_candidate_adapter_harness_v1.py collect \
              --profile "$PROFILE" \
              --adapter-output "$entry/adapter-output.jsonl" \
              "${replay_arg[@]}" \
              --execution-exit-code "$execution_status" \
              --seed "$seed" \
              --toolchain "$TOOLCHAIN" \
              --target "$HOST" \
              --source-commit "$FIXED_SOURCE" \
              --source-tree "$(git rev-parse 'HEAD^{tree}')" \
              --branch codex/h02-final-gap-closure-v1 \
              --clean-tree \
              --environment-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_NAME}-${VARIANT}-${seed}-candidate" \
              --executor-kind github-hosted \
              --runner-id github-api-enrichment-pending \
              --runner-name "$RUNNER_NAME" \
              --output "$entry/candidate.json" \
              --binding-output "$entry/feature-profile-binding.json"
            python scripts/h02_candidate_adapter_harness_v1.py compare \
              --reference "$reference" \
              --candidate "$entry/candidate.json" \
              --adapter-scope "$SCOPE" \
              --output "$entry/comparison.json"
          done
          printf 'evidence=%s\n' "$evidence" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload all outcomes before final classification
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h02-candidate-${{ matrix.runner }}-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ steps.execute.outputs.evidence }}/
          if-no-files-found: error
          retention-days: 30

      - name: Require three exact passes without qualification or authority
        shell: bash
        env:
          PROFILE: ${{ steps.profile.outputs.profile }}
          EVIDENCE: ${{ steps.execute.outputs.evidence }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['EVIDENCE'])
          entries = sorted(path for path in root.iterdir() if path.is_dir())
          assert len(entries) == 3, entries
          expected = (
              'PARTIAL_ADAPTER_SCOPE_BLOCKS_PROMOTION'
              if os.environ['PROFILE'] == 'openraft'
              else 'INVARIANT_EQUIVALENT_UNREVIEWED'
          )
          for entry in entries:
              candidate = json.load((entry / 'candidate.json').open(encoding='utf-8'))
              comparison = json.load((entry / 'comparison.json').open(encoding='utf-8'))
              assert candidate['status'] == 'EXECUTED_PASS', (entry, candidate['status'])
              assert comparison['result'] == expected, (entry, comparison['result'], expected)
              assert candidate['qualification'] is False
              assert comparison['qualification'] is False
              assert candidate['selection_effect'] == comparison['selection_effect'] == 'NONE'
              assert candidate['authority_effect'] == comparison['authority_effect'] == 'NONE'
          print(f'three candidate seeds passed as {expected}; qualification and authority remain closed')
          PY
