name: h02-candidate-cross-platform-execution

on:
  push:
    branches: ["codex/h02-candidate-cross-platform-execution-v1"]
    paths:
      - ".github/workflows/h02-candidate-cross-platform-execution.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h02-candidate-cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  superseded:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Record diagnostic handoff
        shell: bash
        run: |
          set -euo pipefail
          echo 'The oversized cross-platform matrix was superseded after artifact upload stalled.'
          echo 'Focused execution owner: codex/h02-candidate-diagnostics-v1'
          echo 'qualification=false selection_effect=NONE authority_effect=NONE'
