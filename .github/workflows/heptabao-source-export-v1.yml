name: heptabao-source-export-v1

on:
  push:
    branches: ["codex/heptabao-plan-v1-2-closure"]
    paths:
      - ".github/workflows/heptabao-source-export-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heptabao-source-export-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and archive exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/source-tree.txt"
          git archive --format=tar.gz --output="$RUNNER_TEMP/heptabao-source.tar.gz" HEAD
          sha256sum "$RUNNER_TEMP/heptabao-source.tar.gz" > "$RUNNER_TEMP/heptabao-source.tar.gz.sha256"
      - name: Upload exact source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heptabao-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/heptabao-source.tar.gz
            ${{ runner.temp }}/heptabao-source.tar.gz.sha256
            ${{ runner.temp }}/source-tree.txt
          if-no-files-found: error
          retention-days: 1
