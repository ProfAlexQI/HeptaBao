name: slim-runner-admission-probe

on:
  push:
    branches:
      - "exec/v1.3.1-arm64-admission-probe"

permissions:
  contents: read

concurrency:
  group: slim-runner-admission-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bind-source:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove executable slim runner admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'repository=%s\ncommit=%s\ntree=%s\nrunner=%s\nos=%s\narch=%s\nqualification=false\nauthority_effect=NONE\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$(git rev-parse 'HEAD^{tree}')" \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
