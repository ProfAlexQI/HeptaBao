name: v1.4.1-postcommit-reconcile-fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - codex/v1.4-durable-single-node-foundation-v1
    paths:
      - .github/workflows/v1.4.1-postcommit-reconcile-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "${{ github.event.pull_request.head.ref }}" = "codex/plan-v1.4-full-gap-closure-v1"

      - name: Add exact committed-state reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          core = Path('crates/heptabao-journaled-core/src/lib.rs')
          source = core.read_text(encoding='utf-8')
          anchor = '    pub fn record_response_audited(\n'
          if source.count(anchor) != 1:
              raise SystemExit('journaled-core response-audit anchor drifted')
          method = '''    pub fn reconcile_committed_state(
              &mut self,
              operation_id: &OperationId,
              commit: CommitReceipt,
          ) -> Result<(), JournaledCoreError<S::Error, B::Error, J::Error>> {
              let current = self
                  .ledger
                  .current(operation_id)
                  .cloned()
                  .ok_or(JournaledCoreError::OperationMissing)?;
              if current.phase() != OperationPhase::IntentCommitted {
                  return Err(JournaledCoreError::OperationContract(
                      OperationContractError::InvalidTransition,
                  ));
              }
              let snapshot = self
                  .state
                  .store()
                  .load_current()
                  .map_err(|error| {
                      JournaledCoreError::DurableState(DurableCoreError::Storage(error))
                  })?;
              let observed = snapshot.map(|value| (value.generation, value.digest));
              if observed != Some((commit.committed, commit.digest)) {
                  return Err(JournaledCoreError::DurableState(
                      DurableCoreError::CommitReceiptMismatch,
                  ));
              }
              let committed = current
                  .next(
                      OperationPhase::StateCommitted,
                      Some((commit.committed, commit.digest)),
                      None,
                      None,
                      detail_code("state-commit-reconciled")
                          .map_err(JournaledCoreError::OperationContract)?,
                  )
                  .map_err(JournaledCoreError::OperationContract)?;
              self.ledger
                  .record(committed)
                  .map_err(JournaledCoreError::Ledger)?;
              Ok(())
          }

          '''
          source = source.replace(anchor, method + anchor, 1)

          old_assertion = '''                assert!(matches!(
                      result,
                      Err(JournaledCoreError::StateCommittedLedgerIncomplete {
                          commit: CommitReceipt {
                              committed: Generation::INITIAL,
                              ..
                          },
                          ..
                      })
                  ));
                  assert_eq!(
                      core.state().store().current_generation(),
                      Some(Generation::INITIAL)
                  );
                  assert_eq!(
                      core.ledger().retry_directive(&operation_id),
                      Some(RetryDirective::ReconcileOnly)
                  );
          '''
          new_assertion = '''                let commit = match result {
                      Err(JournaledCoreError::StateCommittedLedgerIncomplete {
                          commit,
                          ..
                      }) => Some(commit),
                      _ => None,
                  };
                  assert_eq!(
                      commit.map(|receipt| receipt.committed),
                      Some(Generation::INITIAL)
                  );
                  assert_eq!(
                      core.state().store().current_generation(),
                      Some(Generation::INITIAL)
                  );
                  assert_eq!(
                      core.ledger().retry_directive(&operation_id),
                      Some(RetryDirective::ReconcileOnly)
                  );
                  if let Some(commit) = commit {
                      assert!(
                          core.reconcile_committed_state(&operation_id, commit)
                              .is_ok()
                      );
                      assert_eq!(
                          core.ledger().retry_directive(&operation_id),
                          Some(RetryDirective::LookupOnly)
                      );
                  }
          '''
          if source.count(old_assertion) != 1:
              raise SystemExit('postcommit reconciliation test anchor drifted')
          source = source.replace(old_assertion, new_assertion, 1)
          core.write_text(source, encoding='utf-8')

          plan = Path('docs/plan/HEPTABAO_PLAN_V1_4_1_DURABLE_JOURNAL_AND_OPERATION_LEDGER.md')
          text = plan.read_text(encoding='utf-8')
          anchor = (
              '`StateCommittedLedgerIncomplete` containing the exact commit receipt. This is\n'
              'not a failed mutation and does not authorize replay. The operation remains\n'
              '`ReconcileOnly` until a separately validated reconciliation transition is\n'
              'written.\n'
          )
          replacement = anchor + (
              '\n`reconcile_committed_state` first rereads the authoritative storage snapshot and\n'
              'requires its generation and digest to equal the supplied commit receipt. Only\n'
              'then may the ledger append the missing `StateCommitted` transition. A forged,\n'
              'stale or mismatched receipt fails closed and leaves the operation unresolved.\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('V1.4.1 plan reconciliation anchor drifted')
          plan.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          audit = Path('docs/audit/HEPTABAO_DURABLE_OPERATION_LEDGER_V1.md')
          text = audit.read_text(encoding='utf-8')
          anchor = (
              'A lookup service must return the current phase, state generation/digest and\n'
              'opaque recovery reference without exposing secret payloads. Retention must not\n'
              'delete records while their operation IDs can still be presented or while an\n'
              'external effect can still be reconciled.\n'
          )
          replacement = anchor + (
              '\nA missing post-commit transition is repaired only by rereading the authoritative\n'
              'storage snapshot and matching both generation and digest to the returned commit\n'
              'receipt before appending `StateCommitted`. Receipt text alone is insufficient.\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('audit contract reconciliation anchor drifted')
          audit.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          validator = Path('scripts/validate_plan_v1_4_1.py')
          text = validator.read_text(encoding='utf-8')
          anchor = '            "record_response_audit_failure_after_commit",\n'
          replacement = anchor + '            "reconcile_committed_state",\n'
          if text.count(anchor) != 1:
              raise SystemExit('validator core token anchor drifted')
          validator.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY

      - name: Install exact Python and Rust dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Validate and execute exact repaired source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo +1.98.0 fmt --all
          python scripts/validate_plan_v1_4_1.py
          python -m unittest discover -s tests/plan -p 'test_plan_v1_4_1.py' -v
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Remove temporary repair workflow and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v1.4.1-postcommit-reconcile-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(v1.4.1): bind postcommit reconciliation to stored generation"
          git push origin HEAD:codex/plan-v1.4-full-gap-closure-v1
