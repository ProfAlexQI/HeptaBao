name: exec export PR63 git bundle

on:
  push:
    branches:
      - exec/v1.4.7-post-merge-truth-materializer-v1

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable PR63 head with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: eef7acb441698ddbca00a323728964ddbd0b3753
          fetch-depth: 0
          persist-credentials: false

      - name: Bind and create git bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "eef7acb441698ddbca00a323728964ddbd0b3753"
          git bundle create "$RUNNER_TEMP/heptabao-pr63-eef7acb.bundle" --all
          git bundle verify "$RUNNER_TEMP/heptabao-pr63-eef7acb.bundle"
          sha256sum "$RUNNER_TEMP/heptabao-pr63-eef7acb.bundle"

      - name: Upload immutable git bundle
        uses: actions/upload-artifact@v4
        with:
          name: heptabao-pr63-eef7acb-git-bundle
          path: ${{ runner.temp }}/heptabao-pr63-eef7acb.bundle
          if-no-files-found: error
          retention-days: 1
