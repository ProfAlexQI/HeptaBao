name: v1.4.1-rust-materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - codex/v1.4-durable-single-node-foundation-v1
    paths:
      - .github/workflows/v1.4.1-rust-materializer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-test-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Apply no-follow and provider-neutral entry-name repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/heptabao-single-node-journal/src/lib.rs')
          source = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '            let metadata = entry.metadata().map_err(FileJournalError::Io)?;\n'
                  '            let name = entry.file_name();',
                  '            let metadata = fs::symlink_metadata(entry.path())\n'
                  '                .map_err(FileJournalError::Io)?;\n'
                  '            let name = entry.file_name();',
              ),
              (
                  '                if !metadata.is_file() || fs::symlink_metadata(entry.path())?.file_type().is_symlink()\n'
                  '                {',
                  '                if metadata.file_type().is_symlink() || !metadata.is_file() {',
              ),
              (
                  '            let sequence = parse_entry_file_name(name)?\n'
                  '                .ok_or(FileJournalError::UnexpectedEntry)?;\n'
                  '            if !metadata.is_file() || fs::symlink_metadata(entry.path())?.file_type().is_symlink() {',
                  '            let sequence = parse_entry_file_name(name)\n'
                  '                .map_err(|_| FileJournalError::CorruptJournal)?\n'
                  '                .ok_or(FileJournalError::UnexpectedEntry)?;\n'
                  '            if metadata.file_type().is_symlink() || !metadata.is_file() {',
              ),
          ]
          for before, after in replacements:
              if source.count(before) != 1:
                  raise SystemExit(f'single-node journal source shape drifted: {before!r}')
              source = source.replace(before, after, 1)
          old_helper = '''fn parse_entry_file_name(name: &str) -> Result<Option<JournalSequence>, FileJournalError<io::Error>> {
              let Some(digits) = name
                  .strip_prefix("entry-")
                  .and_then(|value| value.strip_suffix(".hbj"))
              else {
                  return Ok(None);
              };
              if digits.len() != 20 || !digits.bytes().all(|byte| byte.is_ascii_digit()) {
                  return Err(FileJournalError::CorruptJournal);
              }
              let value = digits
                  .parse::<u64>()
                  .map_err(|_| FileJournalError::CorruptJournal)?;
              let sequence = JournalSequence::new(value).map_err(FileJournalError::Contract)?;
              if entry_file_name(sequence) != name {
                  return Err(FileJournalError::CorruptJournal);
              }
              Ok(Some(sequence))
          }
          '''
          new_helper = '''fn parse_entry_file_name(name: &str) -> Result<Option<JournalSequence>, DecodeError> {
              let Some(digits) = name
                  .strip_prefix("entry-")
                  .and_then(|value| value.strip_suffix(".hbj"))
              else {
                  return Ok(None);
              };
              if digits.len() != 20 || !digits.bytes().all(|byte| byte.is_ascii_digit()) {
                  return Err(DecodeError::InvalidLength);
              }
              let value = digits
                  .parse::<u64>()
                  .map_err(|_| DecodeError::InvalidSequence)?;
              let sequence =
                  JournalSequence::new(value).map_err(|_| DecodeError::InvalidSequence)?;
              if entry_file_name(sequence) != name {
                  return Err(DecodeError::InvalidSequence);
              }
              Ok(Some(sequence))
          }
          '''
          if source.count(old_helper) != 1:
              raise SystemExit('single-node journal entry-name helper drifted')
          path.write_text(source.replace(old_helper, new_helper, 1), encoding='utf-8')
          PY
      - name: Install Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Format exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          cargo +1.98.0 fmt --all -- --check
      - name: Materialize exact formatted source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/v1.4.1-rust-blobs.tsv"
          : >"$output"
          create_blob() {
            local path="$1"
            local payload="$RUNNER_TEMP/blob-payload.json"
            local response="$RUNNER_TEMP/blob-response.json"
            python - "$path" "$payload" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]).read_bytes()
          Path(sys.argv[2]).write_text(
              json.dumps({
                  'content': base64.b64encode(source).decode('ascii'),
                  'encoding': 'base64',
              }, separators=(',', ':')),
              encoding='utf-8',
          )
          PY
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary "@$payload" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs" \
              >"$response"
            local sha
            sha="$(python - "$response" <<'PY'
          import json
          import sys
          from pathlib import Path

          response = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          sha = response.get('sha')
          if not isinstance(sha, str) or len(sha) != 40:
              raise SystemExit('GitHub did not return a blob SHA')
          print(sha)
          PY
          )"
            test "$sha" = "$(git hash-object "$path")"
            printf '%s\t%s\n' "$path" "$sha" | tee -a "$output"
          }
          create_blob crates/heptabao-journal-api/src/lib.rs
          create_blob crates/heptabao-single-node-journal/src/lib.rs
          create_blob crates/heptabao-operation-ledger/src/lib.rs
          create_blob crates/heptabao-journaled-core/src/lib.rs
          sha256sum "$output"
      - name: Test and strictly lint complete workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
