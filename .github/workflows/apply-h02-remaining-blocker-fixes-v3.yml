name: apply-h02-remaining-blocker-fixes-v3

on:
  push:
    branches: ["codex/h02-final-gap-closure-v1"]
    paths: [".github/workflows/apply-h02-remaining-blocker-fixes-v3.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-h02-remaining-blocker-fixes-v3
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact closure branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/h02-final-gap-closure-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply source, plan and evidence-semantic fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old!r}")
              target.write_text(text.replace(old, new), encoding="utf-8")
              print(f"patched {path}: {old!r} -> {new!r}")

          def replace_between(path: str, start: str, end: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              begin = text.find(start)
              if begin < 0:
                  raise SystemExit(f"{path}: start marker not found")
              finish = text.find(end, begin)
              if finish < 0:
                  raise SystemExit(f"{path}: end marker not found")
              target.write_text(text[:begin] + replacement + text[finish:], encoding="utf-8")
              print(f"patched block in {path}")

          # The exact resolved OpenRaft graph contains validit 0.2.6, whose observed
          # effective compiler floor is Rust 1.88. Positive behavioral lanes use
          # 1.88/1.98; Rust 1.85 remains a deliberate negative MSRV boundary lane.
          for path in (
              ".github/workflows/h02-openraft-blocker-closure.yml",
              ".github/workflows/h02-openraft-fault-lab.yml",
              ".github/workflows/h02-openraft-inmemory-cluster.yml",
          ):
              replace(path, 'TOOLCHAINS: "1.85.0 1.98.0"', 'TOOLCHAINS: "1.88.0 1.98.0"')

          for path in (
              "planning/HEPTABAO_H02_CANDIDATE_ADAPTERS_V1.yaml",
              "planning/HEPTABAO_H02_OPENRAFT_INMEMORY_CLUSTER_V1.yaml",
              "planning/HEPTABAO_H02_OPENRAFT_HOSTILE_FAULTS_LINEARIZABILITY_V1.yaml",
              "planning/HEPTABAO_H02_OS_DURABLE_CLOCK_BLOCKER_CLOSURE_V1.yaml",
          ):
              replace(path, "toolchains: ['1.85.0', '1.98.0']", "toolchains: ['1.88.0', '1.98.0']")

          replace("scripts/validate_h02_blocker_closure_v1.py", '["1.85.0", "1.98.0"]', '["1.88.0", "1.98.0"]')
          replace("scripts/validate_h02_blocker_closure_v1.py", '"1.85.0 1.98.0"', '"1.88.0 1.98.0"')
          replace("scripts/validate_h02_openraft_inmemory_cluster_v1.py", '"1.85.0",', '"1.88.0",')
          replace("scripts/validate_h02_openraft_fault_lab_v1.py", '"1.85.0",', '"1.88.0",')

          replace(".github/workflows/h02-candidate-adapters.yml", "openraft-1_85", "openraft-1_88", expected=2)
          replace(
              ".github/workflows/h02-candidate-adapters.yml",
              "profile=openraft; toolchain=1.85.0; subdir=openraft-tokio;",
              "profile=openraft; toolchain=1.88.0; subdir=openraft-tokio;",
          )

          # Avoid automatic log purging before the explicit fresh-state-machine
          # replay case. The later explicit snapshot trigger still forces a real
          # full_snapshot RPC to the isolated follower.
          replace(
              "probes/h02/openraft-tokio/src/bin/inmemory_cluster/cluster.rs",
              "snapshot_policy: SnapshotPolicy::LogsSinceLast(3),",
              "snapshot_policy: SnapshotPolicy::LogsSinceLast(10_000),",
          )
          replace(
              "probes/h02/openraft-tokio/src/bin/openraft_fault_lab/cluster.rs",
              "snapshot_policy: SnapshotPolicy::LogsSinceLast(3),",
              "snapshot_policy: SnapshotPolicy::LogsSinceLast(10_000),",
          )

          # Make the real SIGSTOP/SIGCONT probe robust to cold-run dependency and
          # scheduler variance without weakening its freeze/resume assertions.
          replace(
              "probes/h02/openraft-tokio/src/bin/openraft_fault_lab/os_clock.rs",
              "wait_for_file(&ready_path, Duration::from_secs(20))",
              "wait_for_file(&ready_path, Duration::from_secs(30))",
          )
          replace(
              "probes/h02/openraft-tokio/src/bin/openraft_fault_lab/os_clock.rs",
              "wait_for_progress(&progress_path, 2, Duration::from_secs(10))",
              "wait_for_progress(&progress_path, 1, Duration::from_secs(30))",
          )
          replace(
              "probes/h02/openraft-tokio/src/bin/openraft_fault_lab/os_clock.rs",
              "wait_for_progress(&progress_path, frozen_step_b + 1, Duration::from_secs(10))",
              "wait_for_progress(&progress_path, frozen_step_b + 1, Duration::from_secs(30))",
          )

          # A stale snapshot may be rejected explicitly or acknowledged as a no-op.
          # Classify API success only after proving committed/applied/snapshot/app
          # state stayed exactly unchanged.
          hostile_block = '''    let leader_vote = cluster.nodes[&1]
              .raft
              .metrics()
              .borrow_watched()
              .vote
              .clone();
          let target_before_metrics = cluster.nodes[&2]
              .raft
              .metrics()
              .borrow_watched()
              .clone();
          let target_committed = target_before_metrics.local_committed.clone();
          let target_applied = target_before_metrics.last_applied.clone();
          let target_snapshot = target_before_metrics.snapshot.clone();
          let target_state_before = cluster.nodes[&2]
              .state_machine
              .get_state_machine()
              .await
              .client_status
              .clone();
          let stale_is_older = target_committed
              .as_ref()
              .is_some_and(|committed| &stale_log_id < committed);
          if !stale_is_older {
              return Err("hostile snapshot fixture is not older than target committed state".into());
          }

          println!(
              "{}",
              json!({
                  "kind": "phase",
                  "phase": HOSTILE_PHASE,
                  "seed": format!("0x{seed:016x}"),
                  "target_node": 2,
                  "stale_snapshot_log_id": format!("{stale_log_id}"),
                  "original_snapshot_log_id": original_snapshot_log_id.as_ref().map(|value| value.to_string()),
                  "target_committed": target_committed.as_ref().map(|value| value.to_string()),
                  "target_applied": target_applied.as_ref().map(|value| value.to_string()),
                  "target_snapshot": target_snapshot.as_ref().map(|value| value.to_string()),
                  "target_state_entries": target_state_before.len(),
                  "qualification": false,
                  "selection_effect": "NONE",
                  "authority_effect": "NONE",
              })
          );
          io::stdout().flush()?;

          let install_result = timeout(
              Duration::from_secs(10),
              cluster.nodes[&2]
                  .raft
                  .install_full_snapshot(leader_vote, snapshot),
          )
          .await;

          sleep(Duration::from_millis(100)).await;
          let target_after_metrics = cluster.nodes[&2]
              .raft
              .metrics()
              .borrow_watched()
              .clone();
          let target_state_after = cluster.nodes[&2]
              .state_machine
              .get_state_machine()
              .await
              .client_status
              .clone();
          let committed_unchanged = target_after_metrics.local_committed == target_committed;
          let applied_unchanged = target_after_metrics.last_applied == target_applied;
          let snapshot_unchanged = target_after_metrics.snapshot == target_snapshot;
          let application_state_unchanged = target_state_after == target_state_before;
          let state_unchanged = committed_unchanged
              && applied_unchanged
              && snapshot_unchanged
              && application_state_unchanged;
          let state_guard = json!({
              "committed_unchanged": committed_unchanged,
              "applied_unchanged": applied_unchanged,
              "snapshot_unchanged": snapshot_unchanged,
              "application_state_unchanged": application_state_unchanged,
              "before": {
                  "committed": target_committed.as_ref().map(|value| value.to_string()),
                  "applied": target_applied.as_ref().map(|value| value.to_string()),
                  "snapshot": target_snapshot.as_ref().map(|value| value.to_string()),
                  "state_entries": target_state_before.len(),
              },
              "after": {
                  "committed": target_after_metrics.local_committed.as_ref().map(|value| value.to_string()),
                  "applied": target_after_metrics.last_applied.as_ref().map(|value| value.to_string()),
                  "snapshot": target_after_metrics.snapshot.as_ref().map(|value| value.to_string()),
                  "state_entries": target_state_after.len(),
              }
          });

          let result = match install_result {
              Ok(Ok(response)) if state_unchanged => json!({
                  "kind": "hostile_snapshot_child_result",
                  "outcome": "IGNORED_STALE_NO_STATE_CHANGE",
                  "detail": format!("candidate returned a successful no-op: {response:?}"),
                  "state_guard": state_guard,
              }),
              Ok(Ok(response)) => json!({
                  "kind": "hostile_snapshot_child_result",
                  "outcome": "ACCEPTED",
                  "detail": format!("candidate returned success and changed guarded state: {response:?}"),
                  "state_guard": state_guard,
              }),
              Ok(Err(error)) if state_unchanged => json!({
                  "kind": "hostile_snapshot_child_result",
                  "outcome": "REJECTED",
                  "detail": error.to_string(),
                  "state_guard": state_guard,
              }),
              Ok(Err(error)) => json!({
                  "kind": "hostile_snapshot_child_result",
                  "outcome": "ACCEPTED",
                  "detail": format!("candidate returned an error but changed guarded state: {error}"),
                  "state_guard": state_guard,
              }),
              Err(_) => json!({
                  "kind": "hostile_snapshot_child_result",
                  "outcome": "TIMED_OUT_AFTER_INJECTION",
                  "detail": "install_full_snapshot exceeded the child deadline",
                  "state_guard": state_guard,
              }),
          };
          '''
          replace_between(
              "probes/h02/openraft-tokio/src/bin/openraft_fault_lab/cluster.rs",
              "    let leader_vote = cluster.nodes[&1]",
              "    cluster.shutdown().await;\n    Ok(result)\n}",
              hostile_block,
          )

          replace(
              "probes/h02/openraft-tokio/src/bin/openraft_fault_lab.rs",
              'Some("REJECTED") => (',
              'Some("REJECTED") | Some("IGNORED_STALE_NO_STATE_CHANGE") => (',
          )
          replace(
              "probes/h02/openraft-tokio/src/bin/openraft_fault_lab.rs",
              "candidate returned an explicit rejection after stale committed snapshot injection",
              "candidate rejected the stale snapshot or completed a proven no-op without state regression",
          )

          # Rename the pass outcome so the contract accurately includes a verified no-op.
          old_outcome = "REJECTED_OR_ABORTED_AFTER_INJECTION"
          new_outcome = "REJECTED_IGNORED_OR_ABORTED_AFTER_INJECTION"
          changed = []
          for root in (Path(".github"), Path("planning"), Path("schemas"), Path("scripts"), Path("tests"), Path("probes")):
              for target in root.rglob("*"):
                  if not target.is_file() or target.suffix not in {".rs", ".py", ".json", ".yaml", ".yml", ".md"}:
                      continue
                  text = target.read_text(encoding="utf-8")
                  if old_outcome in text:
                      target.write_text(text.replace(old_outcome, new_outcome), encoding="utf-8")
                      changed.append(str(target))
          if len(changed) < 3:
              raise SystemExit(f"hostile outcome rename touched too few files: {changed}")
          print("renamed hostile pass outcome in", changed)

          replace(
              "planning/HEPTABAO_H02_OPENRAFT_HOSTILE_FAULTS_LINEARIZABILITY_V1.yaml",
              """    EXECUTED_PASS:\n      - explicit candidate rejection after the injection marker\n      - isolated process fatality after the injection marker\n    EXECUTED_FAIL:\n      - candidate returns success for the stale committed snapshot\n""",
              """    EXECUTED_PASS:\n      - explicit candidate rejection after the injection marker\n      - successful API response proven to be a no-op by unchanged committed, applied, snapshot and application state\n      - isolated process fatality after the injection marker\n    EXECUTED_FAIL:\n      - candidate changes any guarded state after stale committed snapshot injection\n""",
          )
          replace(
              "planning/HEPTABAO_H02_OPENRAFT_INMEMORY_CLUSTER_V1.yaml",
              "remaining_blocker: hostile conflicting-snapshot injection is not executed because the candidate API documents panic on inconsistent local committed state",
              "remaining_blocker: dedicated fault-lab evidence must prove explicit rejection, process-fatal safety, or an exact no-op with no state regression",
          )
          replace(
              "planning/HEPTABAO_H02_OPENRAFT_INMEMORY_CLUSTER_V1.yaml",
              "  - hostile conflicting-snapshot injection is not executed",
              "  - dedicated hostile-snapshot no-regression evidence must pass on the exact source head",
          )

          # Record the observed effective OpenRaft MSRV while preserving Rust 1.85
          # as a negative boundary experiment.
          matrix_path = "planning/HEPTABAO_H02_CANDIDATE_PROBE_MATRIX_V1.yaml"
          replace(
              matrix_path,
              "  - OpenRaft has no declared rust-version in the captured workspace manifest; its effective MSRV remains pending until a bounded search and independent review are complete.",
              "  - OpenRaft has no declared rust-version in the captured workspace manifest; the exact resolved graph is observed to require Rust 1.88 because validit 0.2.6 declares that floor, while broader MSRV claims remain review-scoped.",
          )
          replace(
              matrix_path,
              """    declared_rust_version: null\n    probe_toolchains: ['1.85.0', '1.98.0']\n""",
              """    declared_rust_version: null\n    observed_effective_rust_version: '1.88'\n    msrv_boundary_toolchain: '1.85.0'\n    probe_toolchains: ['1.85.0', '1.88.0', '1.98.0']\n    expected_toolchain_outcomes:\n      '1.85.0': EXPECTED_FAIL_MSRV_BOUNDARY\n      '1.88.0': PASS\n      '1.98.0': PASS\n""",
          )
          replace(
              "scripts/h02_dependency_probe_v1.py",
              '    value = {key: item[key] for key in keys}\n    value["features"] = sorted(item["features"])',
              '    value = {key: item[key] for key in keys}\n    for key in ("observed_effective_rust_version", "msrv_boundary_toolchain", "expected_toolchain_outcomes"):\n        if key in item:\n            value[key] = item[key]\n    value["features"] = sorted(item["features"])',
          )
          replace(
              "scripts/h02_dependency_probe_v1.py",
              '        validate_manifest(item, root)\n    return len(found)',
              '''        validate_manifest(item, root)
              if profile_id == "HB-H02-PROBE-OPENRAFT-TOKIO":
                  if item.get("observed_effective_rust_version") != "1.88":
                      fail("OpenRaft observed effective Rust version drift")
                  if item.get("msrv_boundary_toolchain") != "1.85.0":
                      fail("OpenRaft MSRV boundary toolchain drift")
                  if item.get("probe_toolchains") != ["1.85.0", "1.88.0", "1.98.0"]:
                      fail("OpenRaft probe toolchain matrix drift")
                  if item.get("expected_toolchain_outcomes") != {
                      "1.85.0": "EXPECTED_FAIL_MSRV_BOUNDARY",
                      "1.88.0": "PASS",
                      "1.98.0": "PASS",
                  }:
                      fail("OpenRaft expected toolchain outcomes drift")
              return len(found)''',
          )

          replace(
              "tests/platform/test_h02_dependency_probe_v1.py",
              '\nif __name__ == "__main__":\n    unittest.main()\n',
              '''
              def test_09_openraft_msrv_boundary_is_bound_into_profile_digest(self):
                  matrix = MODULE.load_yaml(ROOT / "planning/HEPTABAO_H02_CANDIDATE_PROBE_MATRIX_V1.yaml")
                  item = MODULE.profiles(matrix)["HB-H02-PROBE-OPENRAFT-TOKIO"]
                  self.assertEqual(item["observed_effective_rust_version"], "1.88")
                  self.assertEqual(item["msrv_boundary_toolchain"], "1.85.0")
                  self.assertEqual(
                      item["expected_toolchain_outcomes"],
                      {"1.85.0": "EXPECTED_FAIL_MSRV_BOUNDARY", "1.88.0": "PASS", "1.98.0": "PASS"},
                  )
                  changed = dict(item)
                  changed["expected_toolchain_outcomes"] = dict(item["expected_toolchain_outcomes"])
                  changed["expected_toolchain_outcomes"]["1.85.0"] = "PASS"
                  self.assertNotEqual(MODULE.profile_digest(item), MODULE.profile_digest(changed))

              if __name__ == "__main__":
                  unittest.main()
              '''.replace("              ", ""),
          )

          sbom = ".github/workflows/h02-probe-sbom-msrv.yml"
          replace(
              sbom,
              """          - {profile: HB-H02-PROBE-OPENRAFT-TOKIO, probe_dir: probes/h02/openraft-tokio, package: openraft, version: 0.10.0-alpha.33, toolchain: 1.85.0, target: x86_64-unknown-linux-gnu}\n          - {profile: HB-H02-PROBE-OPENRAFT-TOKIO, probe_dir: probes/h02/openraft-tokio, package: openraft, version: 0.10.0-alpha.33, toolchain: 1.98.0, target: x86_64-unknown-linux-gnu}\n""",
              """          - {profile: HB-H02-PROBE-OPENRAFT-TOKIO, probe_dir: probes/h02/openraft-tokio, package: openraft, version: 0.10.0-alpha.33, toolchain: 1.85.0, target: x86_64-unknown-linux-gnu}\n          - {profile: HB-H02-PROBE-OPENRAFT-TOKIO, probe_dir: probes/h02/openraft-tokio, package: openraft, version: 0.10.0-alpha.33, toolchain: 1.88.0, target: x86_64-unknown-linux-gnu}\n          - {profile: HB-H02-PROBE-OPENRAFT-TOKIO, probe_dir: probes/h02/openraft-tokio, package: openraft, version: 0.10.0-alpha.33, toolchain: 1.98.0, target: x86_64-unknown-linux-gnu}\n""",
          )

          classification_step = '''      - name: Classify required pass or expected MSRV boundary
            shell: bash
            env: {PROFILE_ID: "${{ matrix.profile }}", TOOLCHAIN: "${{ matrix.toolchain }}"}
            run: |
              set -euo pipefail
              ev="$RUNNER_TEMP/evidence"
              python - "$ev" "$PROFILE_ID" "$TOOLCHAIN" <<'PY'
              import json
              import pathlib
              import sys
              root = pathlib.Path(sys.argv[1])
              profile = sys.argv[2]
              toolchain = sys.argv[3]
              status = {}
              for line in (root / "status.env").read_text(encoding="utf-8").splitlines():
                  if "=" in line:
                      key, value = line.split("=", 1)
                      status[key] = value
              evidence = json.loads((root / "evidence.json").read_text(encoding="utf-8"))
              marker = "validit@0.2.6 requires rustc 1.88"
              logs = "\n".join(
                  (root / name).read_text(encoding="utf-8", errors="replace")
                  for name in ("build.log", "test.log")
                  if (root / name).is_file()
              )
              base_bound = (
                  status.get("LOCK_STATUS") == "PASS"
                  and status.get("METADATA_STATUS") == "PASS"
                  and status.get("PACKAGE_CHECKSUM_MATCH") == "true"
                  and status.get("PACKAGE_VCS_COMMIT_MATCH") == "true"
              )
              boundary = profile == "HB-H02-PROBE-OPENRAFT-TOKIO" and toolchain == "1.85.0"
              expected = "EXPECTED_FAIL_MSRV_BOUNDARY" if boundary else "REQUIRED_PASS"
              if boundary:
                  matched = (
                      base_bound
                      and status.get("BUILD_STATUS") == "FAIL"
                      and status.get("TEST_STATUS") == "FAIL"
                      and marker in logs
                      and evidence.get("status") == "EXECUTED_FAIL"
                  )
                  observed = "EXPECTED_FAIL_MSRV_BOUNDARY" if matched else "UNEXPECTED_BOUNDARY_RESULT"
              else:
                  matched = (
                      base_bound
                      and status.get("BUILD_STATUS") == "PASS"
                      and status.get("TEST_STATUS") == "PASS"
                  )
                  observed = "REQUIRED_PASS" if matched else "UNEXPECTED_MECHANICAL_FAILURE"
              value = {
                  "schema": "heptabao.h02-msrv-boundary-evidence.v1",
                  "profile_id": profile,
                  "toolchain": toolchain,
                  "expected_outcome": expected,
                  "observed_outcome": observed,
                  "status": status,
                  "required_error_marker": marker if boundary else None,
                  "error_marker_observed": marker in logs if boundary else None,
                  "dependency_probe_status": evidence.get("status"),
                  "qualification": False,
                  "selection_effect": "NONE",
                  "authority_effect": "NONE",
              }
              (root / "expected-outcome.json").write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              print(json.dumps(value, sort_keys=True))
              PY
          '''
          replace(
              sbom,
              "      - name: Upload non-authoritative probe evidence\n",
              classification_step + "      - name: Upload non-authoritative probe evidence\n",
          )
          replace(
              sbom,
              '''      - name: Fail mechanical lane without discarding evidence
              shell: bash
              run: |
                source "$RUNNER_TEMP/evidence/status.env"
                test "$LOCK_STATUS" = PASS && test "$METADATA_STATUS" = PASS && test "$BUILD_STATUS" = PASS && test "$TEST_STATUS" = PASS && test "$PACKAGE_CHECKSUM_MATCH" = true && test "$PACKAGE_VCS_COMMIT_MATCH" = true'''.replace("              ", ""),
              '''      - name: Enforce required pass or expected MSRV boundary
              shell: bash
              run: |
                set -euo pipefail
                python - "$RUNNER_TEMP/evidence/expected-outcome.json" <<'PY'
                import json
                import sys
                value = json.load(open(sys.argv[1], encoding="utf-8"))
                assert value["observed_outcome"] == value["expected_outcome"], value
                assert value["qualification"] is False
                assert value["selection_effect"] == "NONE"
                assert value["authority_effect"] == "NONE"
                print(f"{value['profile_id']} {value['toolchain']}: {value['observed_outcome']}; authority=NONE")
                PY'''.replace("              ", ""),
          )

          # The active source must not retain Rust 1.85 as a positive OpenRaft lane.
          checks = {
              ".github/workflows/h02-candidate-adapters.yml": ["openraft-1_85", "toolchain=1.85.0; subdir=openraft-tokio"],
              ".github/workflows/h02-openraft-inmemory-cluster.yml": ['TOOLCHAINS: "1.85.0 1.98.0"'],
              ".github/workflows/h02-openraft-fault-lab.yml": ['TOOLCHAINS: "1.85.0 1.98.0"'],
              ".github/workflows/h02-openraft-blocker-closure.yml": ['TOOLCHAINS: "1.85.0 1.98.0"'],
          }
          for path, forbidden in checks.items():
              text = Path(path).read_text(encoding="utf-8")
              for marker in forbidden:
                  if marker in text:
                      raise SystemExit(f"{path}: retained forbidden positive-lane marker {marker}")

          print("all remaining-blocker patches applied")
          PY

      - name: Validate plans, schemas and Python semantics
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python scripts/validate_h02_candidate_adapters_v1.py
          python scripts/validate_h02_openraft_inmemory_cluster_v1.py
          python scripts/validate_h02_openraft_fault_lab_v1.py
          python scripts/validate_h02_blocker_closure_v1.py
          python scripts/h02_dependency_probe_v1.py validate-matrix
          python -m unittest \
            tests/platform/test_h02_dependency_probe_v1.py \
            tests/platform/test_h02_candidate_adapter_harness_v1.py \
            tests/platform/test_h02_openraft_inmemory_cluster_v1.py \
            tests/platform/test_h02_linearizability_checker_v1.py \
            tests/platform/test_h02_openraft_fault_lab_evidence_v1.py \
            tests/platform/test_h02_blocker_closure_evidence_v1.py \
            -v

      - name: Compile and execute repaired OpenRaft probes
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          rustup component add rustfmt --toolchain 1.98.0
          manifest=probes/h02/openraft-tokio/Cargo.toml
          cargo +1.98.0 generate-lockfile --manifest-path "$manifest"
          cargo +1.98.0 fmt --manifest-path "$manifest" -- --check
          cargo +1.98.0 test --locked --all-targets --manifest-path "$manifest"
