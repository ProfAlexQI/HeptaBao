name: h02-closure-macos-smoke

on:
  push:
    branches: ["exec/h02-closure-macos-v1"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h02-closure-macos-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closure-smoke:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-plan.txt

      - name: Run deterministic validators
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_plan_v2.py
          python scripts/validate_plan_v2_extensions.py
          python scripts/validate_provenance_v1.py
          python scripts/validate_evidence_objects_v1.py
          python scripts/validate_oracle_foundation_v1.py
          python scripts/validate_h01_h02_next_v1.py
          python scripts/validate_dependency_bakeoff_v1.py
          python scripts/validate_dependency_research_captures_v1.py
          python scripts/validate_dependency_registry_evidence_v1.py
          python scripts/validate_dependency_execution_profiles_v1.py
          python scripts/validate_h02_candidate_adapters_v1.py
          python scripts/validate_h02_openraft_inmemory_cluster_v1.py
          python scripts/validate_h02_openraft_fault_lab_v1.py
          python scripts/validate_h02_blocker_closure_v1.py

      - name: Run Python suites
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v

      - name: Install Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Validate main Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Compile and test exact candidate probes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/h02-probes"
          mkdir -p "$RUNNER_TEMP/h02-probes"
          for subdir in tokio-minimal rustls-ring rustls-aws-lc openraft-tokio; do
            probe="$RUNNER_TEMP/h02-probes/$subdir"
            mkdir -p "$probe"
            cp -a "probes/h02/$subdir/." "$probe/"
            manifest="$probe/Cargo.toml"
            export CARGO_TARGET_DIR="$RUNNER_TEMP/h02-target-$subdir"
            cargo generate-lockfile --manifest-path "$manifest"
            cargo test --locked --all-targets --manifest-path "$manifest"
          done

      - name: Run one candidate seed and OpenRaft closure lab
        shell: bash
        env:
          SEED: "0x5eed20260828cafe"
        run: |
          set -euo pipefail
          for subdir in tokio-minimal rustls-ring rustls-aws-lc openraft-tokio; do
            manifest="$RUNNER_TEMP/h02-probes/$subdir/Cargo.toml"
            export CARGO_TARGET_DIR="$RUNNER_TEMP/h02-target-$subdir"
            cargo run --quiet --locked --manifest-path "$manifest" -- --seed "$SEED" >"$RUNNER_TEMP/$subdir.jsonl"
            test -s "$RUNNER_TEMP/$subdir.jsonl"
          done
          manifest="$RUNNER_TEMP/h02-probes/openraft-tokio/Cargo.toml"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/h02-target-openraft-tokio"
          cargo run --quiet --locked --manifest-path "$manifest" \
            --bin heptabao-h02-openraft-blocker-closure-lab -- \
            --mode all --seed "$SEED" >"$RUNNER_TEMP/blocker-closure-result.json"
          test -s "$RUNNER_TEMP/blocker-closure-result.json"

      - name: Keep authority closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, yaml
          flags = yaml.safe_load(open('planning/AUTHORITY_FLAGS_V2.yaml', encoding='utf-8'))['flags']
          enabled = [k for k, v in flags.items() if v and k != 'implementation_started']
          if enabled:
              raise SystemExit(enabled)
          h02 = json.load(open('qualifications/H02/H02-IMPLEMENTATION-STATUS.json', encoding='utf-8'))
          assert h02['qualification']['status'] == 'NOT_QUALIFIED'
          assert h02['authority_effect'] == 'NONE'
          print('macOS source smoke passed; qualification and authority remain closed')
          PY

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h02-closure-macos-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/*.json
            ${{ runner.temp }}/*.jsonl
          if-no-files-found: ignore
          retention-days: 30
