name: apply-h02-candidate-binding-fix-v2

on:
  push:
    branches: ["codex/h02-final-gap-closure-v1"]
    paths:
      - ".github/workflows/apply-h02-candidate-binding-fix-v2.yml"
      - "scripts/apply_h02_candidate_binding_patch_v1.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-h02-candidate-binding-fix-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-validate-commit:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/h02-final-gap-closure-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact event source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Apply candidate and support dependency binding repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_h02_candidate_binding_patch_v1.py
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/h02_candidate_adapter_harness_v1.py")
          text = path.read_text(encoding="utf-8")
          old = 'HARNESS_VERSION = "1.1.0"'
          new = 'HARNESS_VERSION = "1.0.0"'
          if text.count(old) != 1:
              raise SystemExit("candidate harness version rollback anchor drift")
          path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install pinned validation dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --requirement requirements-plan.txt

      - name: Validate repaired binding and fail-closed semantics
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/h02_candidate_adapter_harness_v1.py
          python scripts/validate_h02_candidate_adapters_v1.py
          python -m unittest tests/platform/test_h02_candidate_adapter_harness_v1.py -v
          python scripts/validate_plan_v2.py
          python scripts/validate_plan_v2_extensions.py
          git diff --check

      - name: Commit repair and retire temporary maintenance surface
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-h02-candidate-manifest-binding-fix.yml \
            .github/workflows/apply-h02-candidate-binding-fix-v2.yml \
            scripts/apply_h02_candidate_binding_patch_v1.py
          git diff --check
          git config user.name "heptabao-maintenance-bot"
          git config user.email "heptabao-maintenance-bot@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix(h02): bind candidate and support dependencies exactly"
          git push origin HEAD:codex/h02-final-gap-closure-v1
