name: v1.4.3-full-gap-closure-arm64-exec

on:
  push:
    branches:
      - exec/v1.4.3-full-gap-closure-arm64-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v1.4.3-full-gap-closure-arm64-exec
  cancel-in-progress: false

jobs:
  materialize-validate-publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      BASELINE_COMMIT: 34e8dc0caceb84288d4ef61f79cd7ca062718b63
      BASELINE_TREE: a1a0e7ab4e5ae8d4a2a5a7cde425eaf94a54b1d7
      STAGING_COMMIT: 69b51b829262ff9ef19913846f09449fc6efd921
      PATCH_B64_SHA256: cc7561e45f47de4864fb051301e1b1829ab51b5047cb11d9ec037c7a81c6dd3a
      PATCH_GZIP_SHA256: 754821a76f229877adc64a748f77620a9f8f389a8dda85dddb04be27bd5f7660
      PATCH_SHA256: 569f738cd2f66e9f97ff9ae7f8bb318fc0b8edf951754b171d102152f7a5064a
      TARGET_BRANCH: codex/plan-v1.4.3-full-gap-closure-arm64-v1

    steps:
      - name: Checkout exact execution transport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind execution transport ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "${STAGING_COMMIT}" HEAD
          test "$(git rev-parse "${BASELINE_COMMIT}^{tree}")" = "${BASELINE_TREE}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'transport_commit=%s\ntransport_tree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" \
            >"${RUNNER_TEMP}/v1.4.3-execution-receipt.txt"

      - name: Install exact Python dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install Python and Rust 1.98 dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustc +1.98.0 --version --verbose
          cargo +1.98.0 --version --verbose

      - name: Materialize audited candidate and apply closure patch
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          patch_source="tmp/v143-full-gap-closure.patch.gz.b64"
          patch_gzip="${RUNNER_TEMP}/v143-full-gap-closure.patch.gz"
          patch_path="${RUNNER_TEMP}/v143-full-gap-closure.patch"
          echo "${PATCH_B64_SHA256}  ${patch_source}" | sha256sum --check --strict
          tr -d '\r\n' <"${patch_source}" | base64 --decode >"${patch_gzip}"
          echo "${PATCH_GZIP_SHA256}  ${patch_gzip}" | sha256sum --check --strict
          gzip -dc "${patch_gzip}" >"${patch_path}"
          echo "${PATCH_SHA256}  ${patch_path}" | sha256sum --check --strict

          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          workflow_path = Path('.github/workflows/v1.4.3-bootstrap.yml')
          workflow = yaml.safe_load(workflow_path.read_text(encoding='utf-8'))
          matches = []
          for job in (workflow.get('jobs') or {}).values():
              if not isinstance(job, dict):
                  continue
              for step in job.get('steps') or []:
                  if not isinstance(step, dict):
                      continue
                  if step.get('name') == 'Safely materialize exact V1.4.3 candidate':
                      run = step.get('run')
                      if isinstance(run, str):
                          matches.append(run)
          if len(matches) != 1:
              raise SystemExit(f'expected one audited materializer, found {len(matches)}')
          target = Path(os.environ['RUNNER_TEMP'], 'v143-audited-materializer.sh')
          target.write_text(matches[0], encoding='utf-8')
          target.chmod(0o700)
          PY
          bash "${RUNNER_TEMP}/v143-audited-materializer.sh"

          git apply --check --whitespace=error-all "${patch_path}"
          git apply --whitespace=error-all "${patch_path}"

          rm -rf .bootstrap/v1.4.3
          rm -f "${patch_source}" "${patch_path}" "${patch_gzip}"
          find .github/workflows -maxdepth 1 -type f \
            \( -name 'v1.4.3-*.yml' -o -name 'v1.4.3-*.yaml' \) -delete

          cargo +1.98.0 fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          desired_tree="$(git write-tree)"
          desired_commit="$(printf '%s\n' \
            'feat(v1.4.3): close descriptor capability and writer-fencing gaps' \
            | git commit-tree "${desired_tree}" -p "${BASELINE_COMMIT}")"
          git checkout --detach "${desired_commit}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          git diff --name-status --no-renames "${BASELINE_COMMIT}" HEAD \
            >"${RUNNER_TEMP}/v1.4.3-final-delta.tsv"
          printf 'candidate_commit=%s\ncandidate_tree=%s\n' \
            "${desired_commit}" "${desired_tree}" \
            >>"${RUNNER_TEMP}/v1.4.3-execution-receipt.txt"
          printf 'commit=%s\n' "${desired_commit}" >>"${GITHUB_OUTPUT}"
          printf 'tree=%s\n' "${desired_tree}" >>"${GITHUB_OUTPUT}"

      - name: Run complete exact-head gates and preserve diagnostics
        id: gates
        shell: bash
        run: |
          set +e
          cat >"${RUNNER_TEMP}/run-v1.4.3-exact-gates.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          python scripts/validate_plan_v1_4_3.py
          python scripts/validate_v1_4_3_inherited_surface.py
          python -m unittest discover -s tests/plan -p 'test_plan_v1_4_3.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v

          historical_root="${RUNNER_TEMP}/v1.4.2-baseline"
          cleanup() {
            git worktree remove --force "${historical_root}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "${historical_root}" "${BASELINE_COMMIT}"
          (
            cd "${historical_root}"
            python scripts/validate_plan_v1_4_2.py
            python scripts/validate_v1_4_2_inherited_surface.py
            python -m unittest discover -s tests/plan -p 'test_plan_v1_4_2.py' -v
            python -m unittest discover -s tests/platform -p 'test_*.py' -v
            python -m unittest discover -s tests/oracle -p 'test_*.py' -v
            cargo +1.98.0 fmt --all -- --check
            cargo +1.98.0 test --locked --workspace --all-targets
            cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          )
          cleanup
          trap - EXIT

          cargo +1.98.0 metadata --locked --no-deps --format-version 1 \
            >"${RUNNER_TEMP}/v1.4.3-cargo-metadata.json"
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings

          python - <<'PY'
          from pathlib import Path
          import yaml

          status = yaml.safe_load(
              Path('planning/HEPTABAO_V1_4_3_DESCRIPTOR_FENCING_STATUS.yaml')
              .read_text(encoding='utf-8')
          )
          expected = {
              'qualification': False,
              'compatibility_claim': False,
              'selected_candidates': [],
              'selection_effect': 'NONE',
              'production_authority': False,
              'migration_authority': False,
              'release_authority': False,
              'authority_effect': 'NONE',
          }
          if status.get('claims') != expected:
              raise SystemExit('V1.4.3 authority boundary drifted')
          PY
          SH
          chmod 0700 "${RUNNER_TEMP}/run-v1.4.3-exact-gates.sh"
          "${RUNNER_TEMP}/run-v1.4.3-exact-gates.sh" \
            >"${RUNNER_TEMP}/v1.4.3-exact-gates.log" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/v1.4.3-exact-gates.log"
          printf 'gate_status=%s\n' "${status}" \
            >>"${RUNNER_TEMP}/v1.4.3-execution-receipt.txt"
          printf 'status=%s\n' "${status}" >>"${GITHUB_OUTPUT}"
          exit 0

      - name: Upload exact-head diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptabao-v1.4.3-full-gap-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/v1.4.3-execution-receipt.txt
            ${{ runner.temp }}/v1.4.3-final-delta.tsv
            ${{ runner.temp }}/v1.4.3-exact-gates.log
            ${{ runner.temp }}/v1.4.3-cargo-metadata.json
          if-no-files-found: warn
          retention-days: 7

      - name: Publish clean exact source only after complete pass
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.gates.outputs.status }}" = '0'
          test "$(git rev-parse HEAD)" = "${{ steps.freeze.outputs.commit }}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${{ steps.freeze.outputs.tree }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin \
            "${{ steps.freeze.outputs.commit }}:refs/heads/${TARGET_BRANCH}"

          {
            echo '## HeptaBao V1.4.3 full repository-controlled closure'
            echo
            echo "- commit: \`${{ steps.freeze.outputs.commit }}\`"
            echo "- tree: \`${{ steps.freeze.outputs.tree }}\`"
            echo '- exact 18-path inherited-surface gate: PASS'
            echo '- V1.4.3 semantic and hostile mutation tests: PASS'
            echo '- frozen V1.4.2 Python/Rust replay: PASS'
            echo '- current Rust 1.98 fmt/test/strict-Clippy: PASS'
            echo '- qualification: false'
            echo '- authority effect: NONE'
          } >>"${GITHUB_STEP_SUMMARY}"
