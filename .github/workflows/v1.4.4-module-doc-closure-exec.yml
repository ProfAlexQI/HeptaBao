                  'writer': 'one configured journal implementation',
                  'invariants': ['Sequence numbers are non-zero and checked.', 'Authentication tags and domain identities are canonical.', 'Payloads are bounded, non-clone and redacted.', 'Append and replay share the same chain invariants.'],
                  'retry': 'An unknown append result requires replay/reconciliation; callers must not append a duplicate event blindly.',
                  'operations': 'Expose tail sequence/tag and corruption class only; payload bytes remain confidential.',
                  'gaps': ['No production authentication provider selected.', 'Retention and compaction contracts are incomplete.', 'Replicated audit is not implemented.'],
              },
              'heptabao-journaled-core': {
                  'purpose': 'Coordinates durable operation-ledger transitions with barrier and storage mutation, including response-audit and delivery outcomes.',
                  'owner': 'core-audit-storage',
                  'maturity': 'SINGLE_NODE_JOURNALED_FOUNDATION_IMPLEMENTED',
                  'writer': 'operation ledger plus durable state store under one process owner',
                  'invariants': ['Accepted and IntentCommitted precede state mutation.', 'StateCommitted binds the exact generation receipt.', 'Duplicate operation identity never mutates twice.', 'Post-commit audit failure preserves the committed result and recovery reference.', 'Unresolved operations fence later generations until reconciliation.'],
                  'retry': 'Retry directives are typed: lookup, reconcile, manual hold or new operation. Creation retry after an unknown external effect is forbidden.',
                  'operations': 'Operators reconcile from the authoritative snapshot and immutable ledger; never edit ledger files manually.',
                  'gaps': ['Not wired into the network server.', 'External-effect provider adapters are absent.', 'Replicated ledger/audit recovery is absent.'],
