                  'writer': 'one descriptor-fenced process',
                  'invariants': ['Lifecycle mode is caller selected; reopen never silently adopts.', 'Generation bundles are immutable and CURRENT binds exact generation/digest.', 'Persist and sync precede publication and acknowledgement.', 'Corrupt current state never falls back to an older generation.', 'Missing initialized state and unknown layout fail closed.'],
                  'retry': 'CommitOutcomeUnknown requires reopen/load and receipt reconciliation. A pre-publication orphan generation requires explicit operator-safe handling.',
                  'operations': 'Monitor generation, digest, marker/current integrity and writer ownership. Preserve the directory for forensic analysis after corruption.',
                  'gaps': ['Exact-next orphan-generation reconciliation requires a formal operator path.', 'Retention and disk-space policy are absent.', 'Filesystem/controller qualification remains external.'],
              },
              'heptabao-storage-api': {
                  'purpose': 'Defines checked durable generations, explicit lifecycle, bounded opaque state, integrity identities and compare-and-swap store contracts.',
                  'owner': 'storage-core-api',
                  'maturity': 'PROVIDER_NEUTRAL_API_IMPLEMENTED',
                  'writer': 'one provider implementation selected by composition',
                  'invariants': ['Generation zero is invalid and arithmetic is checked.', 'Opaque state is bounded, non-clone and redacted.', 'Domain and algorithm identities are canonical ASCII.', 'Commit receipts bind generation and non-zero digest.', 'Lifecycle intent is explicit.'],
                  'retry': 'Providers must distinguish conflict, known failure and unknown publication. Callers reconcile unknown results before retry.',
                  'operations': 'Provider diagnostics expose identity, generation and error classification without opaque state bytes.',
                  'gaps': ['Provider conformance suite is not yet standalone.', 'Production database backends are absent.', 'Online migration/version negotiation is not defined.'],
              },
          }

          workspace = tomllib.loads((root / 'Cargo.toml').read_text(encoding='utf-8'))
          member_paths = workspace['workspace']['members']
          crate_names = []
          crate_by_name = {}
          dependencies = {}
          for member in member_paths:
              manifest = tomllib.loads((root / member / 'Cargo.toml').read_text(encoding='utf-8'))
              name = manifest['package']['name']
              crate_names.append(name)
              crate_by_name[name] = member
              deps = []
              for table in ('dependencies', 'dev-dependencies', 'build-dependencies'):
                  for dep, spec in (manifest.get(table) or {}).items():
                      if dep.startswith('heptabao-'):
                          deps.append(dep)
              dependencies[name] = sorted(set(deps))

          missing_metadata = sorted(set(crate_names) - set(modules))
          extra_metadata = sorted(set(modules) - set(crate_names))
          if missing_metadata or extra_metadata:
              raise SystemExit(f'module metadata drift: missing={missing_metadata}, extra={extra_metadata}')

          reverse = {name: [] for name in crate_names}
          for name, deps in dependencies.items():
              for dep in deps:
                  if dep in reverse:
                      reverse[dep].append(name)
          for value in reverse.values():
              value.sort()

          docs_root = root / 'docs/modules'
          docs_root.mkdir(parents=True, exist_ok=True)
          required_sections = [
              'Purpose and non-goals', 'Maturity and authority boundary', 'Ownership and trust boundary',
              'Dependency contract', 'Public API index', 'State and invariants', 'Failure and retry semantics',
              'Persistent or wire formats', 'Concurrency and cancellation', 'Security and secret handling',
              'Testing and evidence', 'Extension workflow', 'Operations and diagnostics', 'Known gaps',
              'Traceability and maintenance',
          ]

          def scan_symbols(crate_path: Path):
              symbols = []
              tests = []
              pattern = re.compile(r'^\s*pub(?:\([^)]*\))?\s+(?:async\s+)?(struct|enum|trait|fn|type|const|mod)\s+([A-Za-z_][A-Za-z0-9_]*)')
              test_pattern = re.compile(r'^\s*fn\s+(test_[A-Za-z0-9_]+|[A-Za-z_][A-Za-z0-9_]*)\s*\(')
              for src in sorted((crate_path / 'src').rglob('*.rs')):
                  pending_test = False
                  for line in src.read_text(encoding='utf-8').splitlines():
                      if '#[test]' in line:
                          pending_test = True
                          continue
                      match = pattern.match(line)
                      if match:
                          symbols.append(f'`{match.group(1)} {match.group(2)}` ({src.relative_to(root)})')
                      if pending_test:
                          tm = test_pattern.match(line)
                          if tm:
                              tests.append(f'`{tm.group(1)}` ({src.relative_to(root)})')
                              pending_test = False
                          elif line.strip() and not line.lstrip().startswith('#'):
                              pending_test = False
              return sorted(set(symbols)), sorted(set(tests))

          coverage = []
          for name in sorted(crate_names):
              member = crate_by_name[name]
              meta = modules[name]
              symbols, tests = scan_symbols(root / member)
              dep_lines = dependencies[name] or ['none']
              reverse_lines = reverse[name] or ['none']
              symbol_lines = symbols or ['No public Rust item was detected by the documentation indexer; inspect crate-local visibility before adding public API.']
              test_lines = tests or ['No crate-local unit test name was detected; validation may live in integration or plan suites.']
              format_note = 'This crate does not own a durable or wire format; it consumes typed contracts from dependencies.'
              if any(token in name for token in ('protocol', 'store', 'journal', 'ledger', 'barrier', 'recovery', 'rollback', 'key-lifecycle')):
                  format_note = 'All durable or wire encodings are versioned, bounded and strict. Decoders reject truncation, impossible lengths, invalid identity/version and trailing bytes. Exact field layouts remain normative in the linked domain contract and source tests.'

              doc = f'''# `{name}` developer guide

**Source baseline:** `{source_sha}`  
**Source tree:** `{source_tree}`  
**Owner role:** `{meta['owner']}`  
**Maturity:** `{meta['maturity']}`  
**Authority effect:** `NONE`

## Purpose and non-goals

{meta['purpose']}

This crate does not by itself grant qualification, compatibility, production, migration or release authority. It must not be used to infer behavior outside the currently declared profile.

## Maturity and authority boundary

The source is a bounded foundation component. Technical tests establish only the checked invariants on the exact source. Production provider selection, independent review and an authority grant are separate objects.

## Ownership and trust boundary

- Authoritative writer: {meta['writer']}.
- Accountable owner role: `{meta['owner']}`.
- Inputs from clients, storage, providers, plugins, clocks, filesystems and evidence stores are untrusted unless explicitly wrapped by a verified type.
- Callers may not bypass typed constructors or reinterpret an error as success.

## Dependency contract

Direct HeptaBao dependencies:
{''.join(f'- `{item}`\n' for item in dep_lines)}
Reverse HeptaBao dependants:
{''.join(f'- `{item}`\n' for item in reverse_lines)}
The allowed direction follows the system crate graph: provider-neutral types and APIs do not depend on adapters; governance and Oracle tooling do not enter the product authority path.

## Public API index

{''.join(f'- {item}\n' for item in symbol_lines)}
This index is generated from explicit `pub` declarations and is not a replacement for rustdoc. New public items require an invariant, error semantics, tests and an entry in this guide.

## State and invariants

{''.join(f'- {item}\n' for item in meta['invariants'])}
A code change that weakens one of these invariants requires a new plan revision rather than a silent compatibility interpretation.

## Failure and retry semantics

{meta['retry']}

Errors are part of the public contract. Unknown, blocked, stale, corrupt, unauthenticated and unauthorized outcomes remain distinct. Callers must not collapse them into a generic retryable transport failure.

## Persistent or wire formats

{format_note}

Format changes require an explicit version transition, backward/forward compatibility decision, hostile decoder tests and migration/rollback treatment.

## Concurrency and cancellation

The caller must preserve single-writer or immutable-reader ownership declared by the domain. Cancellation after an irreversible provider call or durable publication changes only the waiter; it does not revoke the completed authority or commit. Shared mutable state requires a documented fence, generation or epoch.

## Security and secret handling

- Secret-bearing bytes are not logged, formatted, cloned or serialized unless an explicit audited exposure method permits it.
- `Debug` output carries only opaque identity, lengths and safe state classes.
- Buffer overwrite is best effort and does not prove allocator, swap, crash-dump or side-channel resistance.
- No real token, unseal share, recovery key, private key or production snapshot belongs in source, tests, CI or diagnostics.

## Testing and evidence

Detected crate-local tests:
{''.join(f'- {item}\n' for item in test_lines)}
Required local gate:

```text
cargo +1.98.0 fmt --all -- --check
cargo +1.98.0 test --locked --workspace --all-targets
cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
```

Domain changes also run plan mutation tests, current platform/Oracle regressions and frozen inherited-source replay. A green run is technical evidence only.

## Extension workflow

1. Bind the exact base commit/tree and read the current plan, blocker register and this guide.
2. Add or change typed contracts before concrete adapters.
3. Define state transition, error, retry and cancellation behavior.
4. Add positive, hostile and restart/replay tests.
5. Update this guide, traceability and normative manifest in the same change.
6. Run exact-head read-only CI; preserve failed evidence.
7. Obtain independent review for storage, cryptography, security or distributed-systems critical changes.

## Operations and diagnostics

{meta['operations']}

Diagnostics use stable typed error classes and opaque correlation identities. Operators must preserve suspect state for investigation instead of deleting files or rewriting evidence to obtain a pass.

