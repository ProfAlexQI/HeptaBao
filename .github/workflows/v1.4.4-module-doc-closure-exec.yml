                  'owner': 'compatibility-clean-room-security',
                  'maturity': 'OBSERVATION_FOUNDATION_UNQUALIFIED',
                  'writer': 'restricted Oracle laboratory only',
                  'invariants': ['Synthetic and black-box captures are distinct.', 'Black-box evidence requires raw digest and verified transfer.', 'Secret markers and undeclared security side effects are rejected.', 'Oracle data never grants authority.'],
