                  'maturity': 'STRICT_P0_PROTOCOL_FOUNDATION',
                  'writer': 'none; protocol parsing is pure with injected time/context',
                  'invariants': ['HTTP framing, Host, Content-Length and canonical target rules are strict and bounded.', 'Classification follows canonicalization and precedes authentication or mutation.', 'Deadline values are process-local monotonic ticks and never serialized across processes.', 'Secret-bearing buffers are non-clone, redacted and best-effort overwritten.', 'Unknown operations and ignored bodies fail closed.'],
