                  'gaps': ['No repository-verifiable restricted fixture transfer.', 'Compatibility coverage is incomplete.', 'Independent clean-room role separation remains external.'],
              },
              'heptabao-p0-server': {
                  'purpose': 'Provides a loopback-only in-memory development server for strict request parsing, init/seal/unseal, KV v1 and audit-order experiments.',
                  'owner': 'protocol-core-development',
                  'maturity': 'P0_DEVELOPMENT_MEMORY_ONLY',
                  'writer': 'in-process P0 memory state',
                  'invariants': ['Server starts sealed and fail closed.', 'Request bounds, canonicalization, authentication and audit precede mutation.', 'HTTP 204 responses contain no body.', 'Request IDs are single-use within the bounded P0 registry.', 'Secret paths and values are redacted and best-effort overwritten.'],
                  'retry': 'Committed-but-undelivered responses are not blindly retried. The P0 request registry is not an HA replay authority.',
                  'operations': 'Bind only to loopback and use disposable non-secret fixtures. This binary must not be exposed as a production secrets server.',
                  'gaps': ['Not connected to durable store, journal, Authbus, policy or recovery.', 'No TLS or production listener.', 'No OpenBao compatibility claim.'],
              },
              'heptabao-platform-bakeoff': {
                  'purpose': 'Evaluates dependency candidates against explicit evidence and scoring rules while preventing selection from granting production authority.',
                  'owner': 'platform-qualification-security',
                  'maturity': 'BAKEOFF_TOOLING_FOUNDATION',
                  'writer': 'candidate evidence index only',
                  'invariants': ['Identified or incompletely scored candidates are not selectable.', 'Pending license or unclassified findings block selection.', 'Prototype selection has no authority effect.', 'Candidate identity, version, feature graph and source are exact.'],
                  'retry': 'A candidate may be rescored only with a new evidence object bound to the same exact source or an explicitly new candidate revision.',
                  'operations': 'Preserve failed and blocked evidence; never overwrite a historical comparison with a later pass.',
                  'gaps': ['Production selections remain empty.', 'Independent license/security review is external.', 'Real provider integration benchmarks are incomplete.'],
              },
              'heptabao-platform-contracts': {
                  'purpose': 'Defines provider-neutral runtime, TLS, Raft and artifact-provenance contracts used by isolated dependency probes.',
                  'owner': 'platform-runtime-tls-distributed-systems',
                  'maturity': 'CONTRACT_AND_PROBE_FOUNDATION',
                  'writer': 'none in product runtime',
                  'invariants': ['Critical tasks require cancellation and future deadlines.', 'Raft apply order is contiguous and monotonic.', 'Snapshots cannot regress applied state.', 'Registry checksum mismatch and unsafe TLS policy fail closed.', 'Independent reproduction has no authority effect.'],
                  'retry': 'Probe retries preserve the original failed evidence and bind a new run identity, runner and exact source.',
                  'operations': 'Use isolated probe workspaces and never import candidate-specific types into product domain APIs.',
                  'gaps': ['Candidates are not production-selected.', 'Cross-platform and independent reproductions remain incomplete.', 'Provider operational runbooks are absent.'],
              },
              'heptabao-protocol': {
                  'purpose': 'Defines strict HTTP request framing, canonical targets, operation classification, monotonic deadlines and secret-bearing request wrappers for the P0 profile.',
