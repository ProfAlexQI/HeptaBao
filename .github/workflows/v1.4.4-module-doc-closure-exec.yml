                  'retry': 'AppendOutcomeUnknown requires replay and exact-next reconciliation. Duplicate append without reconciliation is forbidden.',
                  'operations': 'Report tail identity, orphan sequence and corruption class. Do not expose payload bytes in diagnostics.',
                  'gaps': ['Retention/compaction and capacity control are not implemented.', 'Production authenticator not selected.', 'Replicated journal is absent.'],
              },
              'heptabao-single-node-store': {
                  'purpose': 'Implements explicit create, reopen and legacy-adoption lifecycle over immutable generation bundles and an atomically published CURRENT record.',
                  'owner': 'storage-platform-security',
