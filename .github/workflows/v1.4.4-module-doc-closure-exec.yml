                  'gaps': ['Production KMS/HSM and custody ceremony are not selected.', 'Generation wrapping and emergency recovery are not integrated.', 'Distributed epoch propagation is not implemented.'],
              },
              'heptabao-operation-ledger': {
                  'purpose': 'Records immutable operation identity and a closed transition graph used to prevent duplicate mutation and drive deterministic reconciliation.',
                  'owner': 'core-audit-reconciliation',
                  'maturity': 'DURABLE_STATE_MACHINE_FOUNDATION_IMPLEMENTED',
                  'writer': 'one operation-ledger journal writer',
                  'invariants': ['Operation, request and effect-class identity are immutable.', 'Only declared transitions are accepted.', 'Restart replay reconstructs unresolved operations exactly.', 'Unknown external effects are reconcile-only.', 'Illegal duplicate acceptance fails closed.'],
                  'retry': 'The ledger returns a typed retry directive; callers must not infer retry safety from transport status alone.',
                  'operations': 'Manual hold and reconciliation actions require an auditable operator identity and the exact authoritative snapshot reference.',
                  'gaps': ['No administrative reconciliation API.', 'No retention/compaction policy.', 'No HA writer ownership.'],
              },
              'heptabao-oracle-observer': {
