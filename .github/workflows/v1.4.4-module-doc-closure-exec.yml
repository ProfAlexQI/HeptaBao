name: v1.4.4-module-doc-closure-exec

on:
  push:
    branches:
      - exec/v1.4.4-module-doc-closure-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v1.4.4-module-doc-closure-exec
  cancel-in-progress: false

jobs:
  generate-validate-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_BRANCH: codex/plan-v1.4.3-descriptor-fencing-clean-v1
      TARGET_BRANCH: codex/plan-v1.4.4-module-documentation-closure-v1
    steps:
      - name: Checkout exact execution head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Resolve clean V1.4.3 source
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if git ls-remote --exit-code origin "refs/heads/$SOURCE_BRANCH" >/dev/null 2>&1; then
              git fetch --no-tags origin "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
              exit 0
            fi
            sleep 10
          done
          echo "clean V1.4.3 source branch was not published" >&2
          exit 1

      - name: Generate complete module documentation closure
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse "refs/remotes/origin/$SOURCE_BRANCH")"
          source_tree="$(git rev-parse "$source_sha^{tree}")"
          work="$RUNNER_TEMP/heptabao-v1.4.4-module-docs"
          git worktree add --detach "$work" "$source_sha"
          export DOC_ROOT="$work"
          export SOURCE_SHA="$source_sha"
          export SOURCE_TREE="$source_tree"

          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          import yaml

          root = Path(os.environ['DOC_ROOT'])
          source_sha = os.environ['SOURCE_SHA']
          source_tree = os.environ['SOURCE_TREE']

          modules = {
              'heptabao-authbus-contracts': {
                  'purpose': 'Defines provider-neutral authentication assertions, request binding, replay rejection and bounded assertion verification. It authenticates a caller but deliberately does not authorize an operation.',
                  'owner': 'identity-authentication-security',
                  'maturity': 'FOUNDATION_IMPLEMENTED_NOT_PRODUCTION_AUTHORITY',
                  'writer': 'none; verification is read-only and replay authority is injected',
                  'invariants': ['Authentication and authorization remain separate decisions.', 'Assertion identity, key revision, issue/expiry time and canonical request binding are verified together.', 'Replay-cache saturation, invalid capacity, expiry ambiguity and request mismatch fail closed.', 'Secret-bearing assertion fields and request material are redacted from Debug output.'],
                  'retry': 'Verification may be retried only with the same immutable assertion and request binding before expiry. A replay rejection is terminal for that assertion identity.',
                  'operations': 'Inspect verification failures by stable error class and key revision; never log subject, signature, token or request body bytes.',
                  'gaps': ['Production signer/key-discovery provider is not selected.', 'HA replay authority and durable nonce retention are not integrated.', 'Identity/MFA and policy authorization domains remain outside this crate.'],
              },
              'heptabao-barrier-api': {
                  'purpose': 'Defines the sealed-envelope format, associated-data construction and provider boundary used to prevent plaintext from crossing the durable-store interface.',
                  'owner': 'cryptography-barrier-core-security',
                  'maturity': 'PROVIDER_NEUTRAL_API_IMPLEMENTED',
                  'writer': 'barrier provider selected by the future server composition root',
                  'invariants': ['Associated data binds domain, generation, key epoch, purpose and caller data.', 'Envelope decoding rejects truncation, invalid version and trailing bytes.', 'Key material is never embedded in the envelope.', 'Secret and envelope Debug output is redacted.'],
                  'retry': 'Provider calls occur only after stale-generation rejection. Unknown provider outcomes must not be converted into a successful durable commit.',
                  'operations': 'A production provider must expose key identity and epoch diagnostics without exposing key bytes and must support rotation/revocation observability.',
                  'gaps': ['No production AEAD/KMS/HSM provider is selected.', 'Nonce-generation and key-custody ceremonies require independent review.', 'Locked-memory, dump and side-channel controls are not qualified.'],
              },
              'heptabao-durable-core': {
                  'purpose': 'Composes barrier sealing with a durable generation store and verifies exact generation receipts before acknowledging mutation.',
                  'owner': 'core-storage-barrier',
                  'maturity': 'SINGLE_NODE_FOUNDATION_IMPLEMENTED',
                  'writer': 'the configured durable generation store',
                  'invariants': ['Stale expected generation is rejected before provider work.', 'Plaintext is sealed before storage commit.', 'Returned receipt must match the requested next generation and persisted digest.', 'Possible publication without durable proof remains an explicit unknown outcome.'],
                  'retry': 'Blind retry after CommitOutcomeUnknown is forbidden; callers must reload and reconcile the authoritative generation first.',
                  'operations': 'Correlate provider and storage receipts through opaque operation identity; do not emit plaintext, nonce or ciphertext payloads to logs.',
