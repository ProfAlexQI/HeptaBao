                  'retry': 'WriterBusy is retryable only after operator-confirmed owner release. UnsupportedPlatform and root-identity drift are terminal for the selected profile.',
                  'operations': 'Diagnose device/inode mismatch, unsupported /proc descriptor access and writer-lock ownership without exposing secret-bearing filenames.',
                  'gaps': ['Current profile is Linux-local-filesystem only.', 'Network filesystem semantics are not claimed.', 'Kernel power-cut and storage-controller qualification remain external.'],
              },
              'heptabao-governance': {
