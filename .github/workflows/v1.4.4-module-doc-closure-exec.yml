                  'writer': 'none in runtime; signed governance objects are externally produced',
                  'invariants': ['Failed, unknown or missing tests reject qualification.', 'Critical, High or unclassified findings reject qualification.', 'Qualification never grants operational authority.', 'Revocation has precedence over a previously valid receipt.'],
                  'retry': 'A rejected evidence graph requires a new complete and current graph; mutating a rejected object in place is not a valid retry.',
                  'operations': 'Verification must bind signatures, scope, source, expiry and revocation state and retain the rejected reason set.',
                  'gaps': ['External signer/trust-root infrastructure is not provisioned.', 'Independent reviewer receipts remain external.', 'Repository rulesets are not automatically configured by this crate.'],
