name: materialize-v1.3-v122-delta

on:
  push:
    branches:
      - "codex/plan-v1.3-v122-delta-closure-v1"
    paths:
      - "bootstrap/v1.3-delta/**"
      - ".github/workflows/materialize-v1.3-v122-delta.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-v1.3-v122-delta
  cancel-in-progress: true

jobs:
  materialize-validate-commit:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout exact transport head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact Python validation environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Bind exact V1.2.2 parent and reconstruct delta
        shell: bash
        env:
          EXPECTED_PARENT: e8cfcbad3d73cd4ae764033a926418d9fac9502f
          EXPECTED_PARENT_TREE: 4b7d81b108abb0b5df9253c94787f91817bd54c8
          EXPECTED_ARCHIVE_SHA256: 5431f585838b94374523ce783354629757a050311c135bfe7618ce1492e2a445
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git rev-parse 'HEAD^^{tree}')" = "$EXPECTED_PARENT_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/v13-delta"
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          import tarfile
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "v13-delta"
          parts = sorted(Path("bootstrap/v1.3-delta").glob("part-*.b64"))
          assert [path.name for path in parts] == [f"part-{index:02d}.b64" for index in range(7)]
          encoded = b"".join(
              path.read_bytes().replace(b"\r", b"").replace(b"\n", b"")
              for path in parts
          )
          payload = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(payload).hexdigest()
          expected = os.environ["EXPECTED_ARCHIVE_SHA256"]
          assert actual == expected, (actual, expected)
          archive = root / "v13-delta.tar.xz"
          archive.write_bytes(payload)
          with tarfile.open(archive, "r:xz") as tar:
              members = tar.getmembers()
              assert members
              resolved_root = root.resolve()
              for member in members:
                  target = (root / member.name).resolve()
                  assert target == resolved_root or resolved_root in target.parents
                  assert not member.issym() and not member.islnk()
              tar.extractall(root, filter="data")
          PY

      - name: Verify all 35 files and materialize exact bytes
        shell: bash
        env:
          EXPECTED_PARENT: e8cfcbad3d73cd4ae764033a926418d9fac9502f
          EXPECTED_PARENT_TREE: 4b7d81b108abb0b5df9253c94787f91817bd54c8
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          repo = Path.cwd()
          root = Path(os.environ["RUNNER_TEMP"]) / "v13-delta"
          overlay = root / "overlay"
          manifest = json.loads((root / "DELTA_MANIFEST.json").read_text(encoding="utf-8"))
          assert manifest["schema"] == "heptabao.v1-3-v122-delta-manifest.v1"
          assert manifest["repository"] == "ProfHepta/HeptaBao"
          assert manifest["exact_base"] == {
              "branch": "codex/plan-v1.2.2-unified-gap-closure-v1",
              "commit": os.environ["EXPECTED_PARENT"],
              "tree": os.environ["EXPECTED_PARENT_TREE"],
          }
          assert manifest["deletions"] == []
          assert manifest["qualification"] is False
          assert manifest["compatibility_claim"] is False
          assert manifest["selected_candidates"] == []
          assert manifest["selection_effect"] == "NONE"
          assert manifest["authority_effect"] == "NONE"
          assert len(manifest["entries"]) == 35

          expected_paths: set[str] = set()
          for entry in manifest["entries"]:
              rel = Path(entry["path"])
              assert not rel.is_absolute() and ".." not in rel.parts
              name = rel.as_posix()
              assert name not in expected_paths
              expected_paths.add(name)
              source = overlay / rel
              payload = source.read_bytes()
              assert len(payload) == entry["bytes"], name
              assert hashlib.sha256(payload).hexdigest() == entry["sha256"], name
              destination = repo / rel
              destination.parent.mkdir(parents=True, exist_ok=True)
              temporary = destination.with_name(f".{destination.name}.v13.tmp")
              temporary.write_bytes(payload)
              os.replace(temporary, destination)
              destination.chmod(0o755 if entry["executable"] else 0o644)

          actual_paths = {
              path.relative_to(overlay).as_posix()
              for path in overlay.rglob("*")
              if path.is_file()
          }
          assert actual_paths == expected_paths
          PY
          rm -rf bootstrap/v1.3-delta
          rm -f .github/workflows/materialize-v1.3-v122-delta.yml
          git add -A
          git diff --cached --check
          test -z "$(git ls-files 'bootstrap/v1.3-delta/*')"
          test -z "$(git ls-files '.github/workflows/materialize-v1.3-v122-delta.yml')"
          git write-tree | tee "$RUNNER_TEMP/v13-delta/materialized-tree.txt"

      - name: Validate current plans, all regressions and final authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python3 scripts/validate_plan_v2.py
          python3 scripts/validate_plan_v2_extensions.py
          python3 scripts/validate_plan_v1_2.py
          python3 scripts/validate_plan_v1_2_1.py
          python3 scripts/validate_plan_v1_2_2.py
          python3 scripts/validate_plan_v1_3.py
          python3 scripts/validate_h01_h02_next_v1.py
          python3 scripts/validate_h02_candidate_adapters_v1.py
          python3 scripts/validate_h02_openraft_inmemory_cluster_v1.py
          python3 scripts/validate_h02_openraft_fault_lab_v1.py
          python3 scripts/validate_h02_blocker_closure_v1.py
          python3 scripts/validate_h02_exact_head_matrix_contract_v1.py
          python3 -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python3 -m unittest discover -s tests/platform -p 'test_*.py' -v
          python3 -m unittest discover -s tests/plan -p 'test_*.py' -v
          python3 scripts/validate_rust_source_surface_v1.py \
            crates/heptabao-authbus-contracts/src/lib.rs \
            crates/heptabao-p0-server/src/lib.rs \
            crates/heptabao-p0-server/src/main.rs \
            crates/heptabao-protocol/src/lib.rs
          python3 - <<'PY'
          import re
          from pathlib import Path
          import yaml

          patterns = [
              re.compile(r"(?mi)^\s*contents\s*:\s*write\s*$"),
              re.compile(r"(?mi)^\s*persist-credentials\s*:\s*true\s*$"),
              re.compile(r"(?mi)^\s*git\s+(?:commit|push|rebase|merge)\b"),
          ]
          findings = []
          for path in sorted(Path(".github/workflows").glob("*.y*ml")):
              text = path.read_text(encoding="utf-8")
              if any(pattern.search(text) for pattern in patterns):
                  findings.append(str(path))
          assert findings == [], findings

          canonical = yaml.safe_load(
              Path("planning/HEPTABAO_CANONICAL_PROJECT_STATE_V1_3.yaml").read_text(encoding="utf-8")
          )
          assert canonical["qualification"] is False
          assert canonical["compatibility_claim"] is False
          assert canonical["selected_candidates"] == []
          assert canonical["authority_effect"] == "NONE"
          assert all(value is False for value in canonical["authority_flags"].values())
          PY
          test -z "$(git diff --name-only)"
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/v13-delta/materialized-tree.txt")"

      - name: Commit and push materialized read-only V1.3 source
        shell: bash
        run: |
          set -euo pipefail
          expected_tree="$(cat "$RUNNER_TEMP/v13-delta/materialized-tree.txt")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(plan): materialize V1.3 on unified V1.2.2 base"
          test "$(git rev-parse 'HEAD^{tree}')" = "$expected_tree"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin HEAD:codex/plan-v1.3-v122-delta-closure-v1
