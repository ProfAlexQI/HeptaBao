name: bootstrap-v1-2-execution-contracts-gap-closure

on:
  push:
    branches: ["codex/plan-v1.2-execution-contracts-gap-closure-v1"]
    paths:
      - ".github/workflows/bootstrap-v1.2-execution-contracts-gap-closure.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-v1-2-execution-contracts-gap-closure
  cancel-in-progress: false

jobs:
  materialize-validate-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact transport head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify isolated transport ancestry and surface
        shell: bash
        env:
          BASIS_SHA: f1d1a92783ef5fa8d69f12e1f8ccd7b9277422b3
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASIS_SHA" HEAD
          unexpected="$({ git diff --name-only "$BASIS_SHA"..HEAD || true; } \
            | grep -Ev '^\.github/bootstrap-payload/heptabao-part-[0-9]{2}(-[0-9]{2})?$|^\.github/workflows/bootstrap-v1\.2-execution-contracts-gap-closure\.yml$' \
            || true)"
          test -z "$unexpected" || {
            printf 'unexpected transport changes:\n%s\n' "$unexpected" >&2
            exit 1
          }
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install exact Python validation environment
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install plan dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt

      - name: Verify and materialize the V1.2 payload
        shell: bash
        env:
          PAYLOAD_SHA256: 27785a193b8b354e87c4736458b2a5763575946c98b4cfe438ac79122a8042b1
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.github/bootstrap-payload/heptabao-part-*)
          test "${#parts[@]}" -eq 14
          cat "${parts[@]}" | base64 --decode > "$RUNNER_TEMP/heptabao-v1.2-payload.tar.gz"
          printf '%s  %s\n' "$PAYLOAD_SHA256" "$RUNNER_TEMP/heptabao-v1.2-payload.tar.gz" \
            | sha256sum --check --strict
          python3 - "$RUNNER_TEMP/heptabao-v1.2-payload.tar.gz" <<'PY'
          import pathlib
          import sys
          import tarfile

          archive = pathlib.Path(sys.argv[1])
          with tarfile.open(archive, "r:gz") as payload:
              members = payload.getmembers()
              assert members, "empty payload"
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  assert not path.is_absolute(), member.name
                  assert ".." not in path.parts, member.name
                  assert not member.issym() and not member.islnk(), member.name
              payload.extractall(path=".", filter="data")
          PY
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/plan/HEPTABAO_MASTER_DEVELOPMENT_PLAN_V1_2.md")
          lines = path.read_text(encoding="utf-8").splitlines()
          path.write_text("\n".join(line.rstrip() for line in lines) + "\n", encoding="utf-8")
          PY
          rm -f \
            .github/workflows/apply-h02-candidate-binding-contract.yml \
            .github/workflows/apply-h02-deterministic-contract-closure.yml \
            .github/workflows/apply-h02-validit-lock-binding.yml \
            .github/workflows/materialize-plan-v1-1.yml
          rm -rf .github/bootstrap-payload
          rm -f .github/workflows/bootstrap-v1.2-execution-contracts-gap-closure.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          test ! -e .github/bootstrap-payload

      - name: Validate historical and current plans
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_plan_v2.py
          python3 scripts/validate_plan_v2_extensions.py
          python3 scripts/validate_plan_v1_2.py
          python3 scripts/validate_h01_h02_next_v1.py
          python3 scripts/validate_h02_candidate_adapters_v1.py
          python3 scripts/validate_h02_openraft_inmemory_cluster_v1.py
          python3 scripts/validate_h02_openraft_fault_lab_v1.py
          python3 scripts/validate_h02_blocker_closure_v1.py

      - name: Execute every Python regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python3 -m unittest discover -s tests/platform -p 'test_*.py' -v
          python3 -m unittest discover -s tests/plan -p 'test_*.py' -v
          python3 -m compileall -q scripts tests
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          workflows = sorted(Path('.github/workflows').glob('*.yml'))
          assert workflows
          for workflow in workflows:
              value = yaml.safe_load(workflow.read_text(encoding='utf-8'))
              assert isinstance(value, dict), workflow
          print(f'workflow YAML parse passed: {len(workflows)} files')
          PY
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git diff --check

      - name: Enforce final read-only workflow and authority surface
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/plan-integrity-v4.yml
          test -f docs/plan/HEPTABAO_MASTER_DEVELOPMENT_PLAN_V1_2.md
          test -f planning/HEPTABAO_CANONICAL_PROJECT_STATE_V1.yaml
          test -f planning/HEPTABAO_BLOCKER_REGISTER_V1.yaml
          test -f planning/HEPTABAO_WORK_PACKAGE_CATALOG_V1_2.yaml
          test -f probes/h02/openraft-tokio/Cargo.lock
          ! grep -RInE 'contents:[[:space:]]*write|git push|persist-credentials:[[:space:]]*true' \
            .github/workflows
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          flags = yaml.safe_load(Path('planning/AUTHORITY_FLAGS_V2.yaml').read_text(encoding='utf-8'))
          assert isinstance(flags, dict)
          for key, value in flags.items():
              if isinstance(value, bool):
                  assert value is False, (key, value)
          print('authority boolean sentinels remain false')
          PY
          changed="$(git diff --name-only f1d1a92783ef5fa8d69f12e1f8ccd7b9277422b3)"
          test -n "$changed"
          ! printf '%s\n' "$changed" | grep -E '^\.github/bootstrap-payload/|bootstrap-v1\.2-execution-contracts-gap-closure'

      - name: Commit final tree without rebasing or rewriting tested input
        shell: bash
        run: |
          set -euo pipefail
          branch="$GITHUB_REF_NAME"
          remote_head="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA" || {
            printf 'branch drift: remote=%s tested=%s\n' "$remote_head" "$GITHUB_SHA" >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(plan): land V1.2 execution contracts and close repository gaps"
          git push origin "HEAD:refs/heads/$branch"
