name: exec finalize PR63 hardening v3

on:
  push:
    branches:
      - exec/pr63-hardening-transfer-v1

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: exec-finalize-pr63-hardening-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout immutable transfer payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: exec/pr63-hardening-transfer-v1
          path: transfer
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout live PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/plan-v1.4.7-post-merge-truth-and-external-admission-v1
          path: candidate
          fetch-depth: 0
          persist-credentials: true

      - name: Authenticate immutable payload
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/hardening.patch.gz.b64"
          for index in $(seq -w 0 16); do
            part="transfer/.exec/pr63-hardening/patch-$index"
            test -f "$part"
            cat "$part" >> "$RUNNER_TEMP/hardening.patch.gz.b64"
          done
          test "$(sha256sum "$RUNNER_TEMP/hardening.patch.gz.b64" | awk '{print $1}')" = "e3f945672e180b1e96cbb276c2a0988023fdfb0028e88275d8d6476da5d03062"
          base64 --decode "$RUNNER_TEMP/hardening.patch.gz.b64" | gzip -dc > "$RUNNER_TEMP/hardening.patch"
          test "$(sha256sum "$RUNNER_TEMP/hardening.patch" | awk '{print $1}')" = "ec277f3b7bc2ab59eb7a75d00f5cc0170f95b163b4458f0e9d8614787facf0c8"
          cat transfer/.exec/pr63-hardening/workflow-00 transfer/.exec/pr63-hardening/workflow-01 > "$RUNNER_TEMP/candidate-workflow.b64"
          test "$(sha256sum "$RUNNER_TEMP/candidate-workflow.b64" | awk '{print $1}')" = "ed613ae84d1049ed1a54a45954f873543d1a9406ca08cb685b4af6890b1c4f7a"
          base64 --decode "$RUNNER_TEMP/candidate-workflow.b64" > "$RUNNER_TEMP/candidate-workflow.yml"
          test "$(sha256sum "$RUNNER_TEMP/candidate-workflow.yml" | awk '{print $1}')" = "e4787f130674ccb6e0a9b58dd487f44be24a9e9e453329f5c394035089465587"

      - name: Converge source without workflow mutation
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          if git apply --check --binary "$RUNNER_TEMP/hardening.patch"; then
            git apply --index --binary "$RUNNER_TEMP/hardening.patch"
            git config user.name "HeptaBao execution controller"
            git config user.email "heptabao-exec@users.noreply.github.com"
            git add --all
            test -z "$(git diff --cached --name-only | grep '^.github/workflows/' || true)"
            git commit -m "fix(v1.4.7): harden external admission and inherited gates"
            git push origin HEAD:refs/heads/codex/plan-v1.4.7-post-merge-truth-and-external-admission-v1
          elif git apply --reverse --check --binary "$RUNNER_TEMP/hardening.patch"; then
            echo 'hardening source is already present'
          else
            echo 'hardening payload neither applies nor reverses at live PR head' >&2
            exit 1
          fi

      - name: Validate exact converged source
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          git fetch origin codex/plan-v1.4.7-post-merge-truth-and-external-admission-v1
          git reset --hard origin/codex/plan-v1.4.7-post-merge-truth-and-external-admission-v1
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python scripts/render_plan_v1_4_7.py --check
          python scripts/validate_plan_v1_4_7.py
          python -m unittest discover -s tests/plan -p 'test_*.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python -m compileall -q scripts tests
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustc +1.98.0 --version --verbose
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Admit the validated candidate workflow in a separate commit
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          git fetch origin codex/plan-v1.4.7-post-merge-truth-and-external-admission-v1
          git reset --hard origin/codex/plan-v1.4.7-post-merge-truth-and-external-admission-v1
          target=.github/workflows/plan-v1.4.7-post-merge-truth-and-external-admission.yml
          mkdir -p .github/workflows
          if test -f "$target" && test "$(sha256sum "$target" | awk '{print $1}')" = "e4787f130674ccb6e0a9b58dd487f44be24a9e9e453329f5c394035089465587"; then
            echo 'validated candidate workflow already present'
          else
            cp "$RUNNER_TEMP/candidate-workflow.yml" "$target"
            test "$(sha256sum "$target" | awk '{print $1}')" = "e4787f130674ccb6e0a9b58dd487f44be24a9e9e453329f5c394035089465587"
            git config user.name "HeptaBao execution controller"
            git config user.email "heptabao-exec@users.noreply.github.com"
            git add "$target"
            git commit -m "ci(v1.4.7): admit exact-head and prospective-merge gate"
            git push origin HEAD:refs/heads/codex/plan-v1.4.7-post-merge-truth-and-external-admission-v1
          fi

      - name: Rebind PR, close accidental probes, and restore Ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          head="$(gh api repos/$repo/pulls/63 --jq .head.sha)"
          base="$(gh api repos/$repo/pulls/63 --jq .base.sha)"
          merge="$(gh api repos/$repo/pulls/63 --jq '.merge_commit_sha // "PENDING"')"
          tree="$(gh api repos/$repo/git/commits/$head --jq .tree.sha)"
          wf_sha="$(gh api repos/$repo/contents/.github/workflows/plan-v1.4.7-post-merge-truth-and-external-admission.yml?ref=$head --jq .sha)"
          test -n "$wf_sha"
          body="$RUNNER_TEMP/pr-body.md"
          cat > "$body" <<EOF
          ## Exact source binding

          \`\`\`text
          repository: $repo
          repository ID: 1349115072
          base: integration/v1.4.4-technical-candidate@$base
          head: $head
          head tree: $tree
          prospective merge: $merge
          inherited V1.4.6 merge tree: c22288f561fdd711e908ce8a70c0116601d519e5
          \`\`\`

          ## Scope and completed preflight

          V1.4.7 binds all 19 current crate guides to source truth, records the real V1.4.6 post-merge receipt, hardens external/control completion admission, and repairs inherited gates without weakening historical safety invariants.

          \`\`\`text
          patch SHA-256: ec277f3b7bc2ab59eb7a75d00f5cc0170f95b163b4458f0e9d8614787facf0c8
          workflow SHA-256: e4787f130674ccb6e0a9b58dd487f44be24a9e9e453329f5c394035089465587
          plan tests: 321 PASS
          platform tests: 130 PASS
          Oracle tests: 20 PASS
          Rust 1.98 fmt/test/strict-Clippy: PASS
          \`\`\`

          Fresh GitHub checks and a fresh non-author review must bind to the exact head and prospective merge above. Historical reviews are non-transferable. No administrator bypass or self-approval is permitted.

          Factual-open until authentic completion objects exist: HB-BLK-CTRL-001 and HB-BLK-EXT-001 through HB-BLK-EXT-007.

          \`\`\`text
          qualification=false
          compatibility_claim=false
          production_authority=false
          migration_authority=false
          release_authority=false
          authority_effect=NONE
          \`\`\`
          EOF
          sed -i 's/^          //' "$body"
          gh api --method PATCH repos/$repo/pulls/63 --raw-field body="$(cat "$body")" >/dev/null
          gh api --method POST repos/$repo/pulls/63/requested_reviewers -f 'reviewers[]=Tomasrgbsf' -f 'reviewers[]=ProfHepta' >/dev/null || true
          gh api --paginate repos/$repo/pulls?state=open --jq '.[] | select(.title == "noop") | select(.head.ref == "exec/pr63-hardening-transfer-v1" or .head.ref == "codex/plan-v1.4.7-post-merge-truth-and-external-admission-v1") | .number' > "$RUNNER_TEMP/noop-prs"
          while IFS= read -r number; do
            test -n "$number" || continue
            gh api --method PATCH repos/$repo/pulls/$number -f state=closed >/dev/null
            gh api --method POST repos/$repo/issues/$number/comments -f body='Closed automatically: accidental no-op control-plane probe; no source or authority effect.' >/dev/null
          done < "$RUNNER_TEMP/noop-prs"
          gh pr ready 63 --repo "$repo"
          gh api --method POST repos/$repo/issues/63/comments -f body="Exact-head V1.4.7 hardening is published and preflighted at \\`$head\\`; prospective merge \\`$merge\\`. PR restored to Ready. Fresh checks and fresh independent review remain mandatory; no bypass or self-approval was used." >/dev/null
