name: stage-v1.3.1-reviewed-tree

on:
  push:
    branches: ["tmp/v1.3.1-staging-input-v1"]

permissions:
  contents: write

concurrency:
  group: stage-v1.3.1-reviewed-tree
  cancel-in-progress: true

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      BASE_COMMIT: 077661e11fabaee29d149c5d14cb8a528b5a7077
      BASE_TREE: cf66532e1cede8425b26cec0488b952986a5d107
      PATCH_SHA256: 26fa7f8012e2f6f2edb2d1e91230ebfa812791d2b388866a4ab01b5d5a741014
      OUTPUT_BRANCH: tmp/v1.3.1-reviewed-tree-v1
    steps:
      - name: Checkout exact staging input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact predecessor and reconstruct patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_COMMIT"
          test "$(git rev-parse "$BASE_COMMIT^{tree}")" = "$BASE_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          cat bootstrap/v1.3.1-reviewed-patch/part-*.b64 \
            | tr -d '\r\n' \
            | base64 --decode >"$RUNNER_TEMP/v1.3.1.patch.xz"
          test "$(sha256sum "$RUNNER_TEMP/v1.3.1.patch.xz" | awk '{print $1}')" = "$PATCH_SHA256"
          xz --decompress --stdout "$RUNNER_TEMP/v1.3.1.patch.xz" >"$RUNNER_TEMP/v1.3.1.patch"
          git apply --index --whitespace=nowarn "$RUNNER_TEMP/v1.3.1.patch"
          git diff --cached --check

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install exact Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          for toolchain in 1.88.0 1.98.0; do
            rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          done

      - name: Format and validate complete candidate tree
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          cargo +1.98.0 fmt --manifest-path probes/h02/openraft-tokio/Cargo.toml --all
          git add -A
          for script in \
            validate_plan_v2.py validate_plan_v2_extensions.py validate_plan_v1_2.py \
            validate_plan_v1_2_1.py validate_plan_v1_2_2.py validate_plan_v1_3.py \
            validate_plan_v1_3_1.py validate_h01_h02_next_v1.py \
            validate_h02_candidate_adapters_v1.py validate_h02_openraft_inmemory_cluster_v1.py \
            validate_h02_openraft_fault_lab_v1.py validate_h02_blocker_closure_v1.py \
            validate_h02_exact_head_matrix_contract_v1.py validate_h02_pr40_reconciliation_v1.py \
            validate_provenance_v1.py validate_evidence_objects_v1.py \
            validate_repository_identity_v1.py; do
            python3 "scripts/$script"
          done
          for suite in oracle platform plan; do
            python3 -m unittest discover -s "tests/$suite" -p 'test_*.py' -v
          done
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          for toolchain in 1.88.0 1.98.0; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/openraft-stage-$toolchain"
            cargo +"$toolchain" test --locked --all-targets \
              --manifest-path probes/h02/openraft-tokio/Cargo.toml
            cargo +"$toolchain" clippy --locked --all-targets \
              --manifest-path probes/h02/openraft-tokio/Cargo.toml -- -D warnings
          done
          git add -A
          git diff --cached --check

      - name: Publish noncanonical validated staging tree
        shell: bash
        run: |
          set -euo pipefail
          git restore --source="$BASE_COMMIT" --staged --worktree \
            .github/workflows/plan-v1.3.1-final-exact.yml
          rm -f .github/workflows/plan-v1.3.1-merge-admission.yml
          git add -A
          test -z "$(git diff --cached --name-only "$GITHUB_SHA" | grep '^.github/workflows/' || true)"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "stage(v1.3.1): validate repository closure tree"
          printf 'commit=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"
          git push --force origin "HEAD:refs/heads/$OUTPUT_BRANCH"
