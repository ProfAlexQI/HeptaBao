name: apply-h02-candidate-compile-fixes

on:
  push:
    branches: ["codex/h02-final-gap-closure-v1"]
    paths:
      - ".github/workflows/apply-h02-candidate-compile-fixes.yml"
      - "scripts/apply_h02_candidate_compile_fixes_v1.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-h02-candidate-compile-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-compile-commit:
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/h02-final-gap-closure-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact event source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          git diff --cached --quiet

      - name: Apply exact compile fixes
        run: python scripts/apply_h02_candidate_compile_fixes_v1.py

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pinned validation dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --requirement requirements-plan.txt

      - name: Validate source contracts and negative tests
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_h02_candidate_adapters_v1.py
          python -m unittest tests/platform/test_h02_candidate_adapter_harness_v1.py -v
          python scripts/validate_plan_v2.py
          python scripts/validate_plan_v2_extensions.py
          git diff --check

      - name: Install declared candidate toolchains
        shell: bash
        run: |
          set -euo pipefail
          for toolchain in 1.71.0 1.85.0 1.98.0; do
            rustup toolchain install "$toolchain" --profile minimal
            rustup run "$toolchain" rustc --version --verbose
          done

      - name: Compile and execute rustls ring on Rust 1.71 and 1.98
        shell: bash
        run: |
          set -euo pipefail
          for toolchain in 1.71.0 1.98.0; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/rustls-ring-$toolchain"
            rustup run "$toolchain" cargo generate-lockfile --manifest-path probes/h02/rustls-ring/Cargo.toml
            rustup run "$toolchain" cargo test --locked --all-targets --manifest-path probes/h02/rustls-ring/Cargo.toml
            rustup run "$toolchain" cargo run --quiet --locked --manifest-path probes/h02/rustls-ring/Cargo.toml -- --seed 0x5eed20260828cafe
          done

      - name: Compile and execute rustls aws-lc on Rust 1.71 and 1.98
        shell: bash
        run: |
          set -euo pipefail
          for toolchain in 1.71.0 1.98.0; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/rustls-aws-lc-$toolchain"
            rustup run "$toolchain" cargo generate-lockfile --manifest-path probes/h02/rustls-aws-lc/Cargo.toml
            rustup run "$toolchain" cargo test --locked --all-targets --manifest-path probes/h02/rustls-aws-lc/Cargo.toml
            rustup run "$toolchain" cargo run --quiet --locked --manifest-path probes/h02/rustls-aws-lc/Cargo.toml -- --seed 0x5eed20260828cafe
          done

      - name: Compile and execute OpenRaft on Rust 1.85 and 1.98
        shell: bash
        run: |
          set -euo pipefail
          for toolchain in 1.85.0 1.98.0; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/openraft-$toolchain"
            rustup run "$toolchain" cargo generate-lockfile --manifest-path probes/h02/openraft-tokio/Cargo.toml
            rustup run "$toolchain" cargo test --locked --all-targets --manifest-path probes/h02/openraft-tokio/Cargo.toml
            rustup run "$toolchain" cargo run --quiet --locked --manifest-path probes/h02/openraft-tokio/Cargo.toml -- --seed 0x5eed20260828cafe
          done

      - name: Commit source fixes and retire temporary maintenance files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-h02-candidate-compile-fixes.yml \
            scripts/apply_h02_candidate_compile_fixes_v1.py
          git diff --check
          git config user.name "heptabao-maintenance-bot"
          git config user.email "heptabao-maintenance-bot@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix(h02): repair rustls fixtures and OpenRaft support pin"
          git push origin HEAD:codex/h02-final-gap-closure-v1
