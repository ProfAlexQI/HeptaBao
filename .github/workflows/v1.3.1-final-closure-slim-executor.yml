name: v1.3.1-final-closure-slim-executor

on:
  push:
    branches:
      - "exec/v1.3.1-final-closure-slim-v1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1.3.1-final-closure-slim-executor
  cancel-in-progress: true

env:
  SUBJECT_SHA: 7a81d94967376ffb5f27879d0003dbb9dd0cd680
  SUBJECT_TREE: 163e1b95a3138f1ca28029941e567a419f0ec6cf
  SUBJECT_REPOSITORY: ProfHepta/HeptaBao
  HEPTABAO_P0_BIND: 127.0.0.1:0
  HEPTABAO_P0_DEV_TOKEN: v1-3-1-slim-development-root-token-000001
  HEPTABAO_P0_DEV_UNSEAL_KEY: v1-3-1-slim-development-unseal-key-00001

jobs:
  exact-source-full-closure:
    runs-on: ubuntu-slim
    timeout-minutes: 360
    steps:
      - name: Checkout exact canonical subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind executor and exact subject
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$SUBJECT_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SUBJECT_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          root="$RUNNER_TEMP/v1.3.1-slim"
          mkdir -p "$root/python" "$root/root-rust" "$root/p0" "$root/h02"
          printf 'executor_commit=%s\nexecutor_ref=%s\nsubject_repository=%s\nsubject_commit=%s\nsubject_tree=%s\nrunner=%s\nos=%s\narch=%s\n' \
            "$GITHUB_SHA" "$GITHUB_REF" "$SUBJECT_REPOSITORY" "$SUBJECT_SHA" "$SUBJECT_TREE" \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" \
            | tee "$root/source-binding.txt"

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Execute all plan validators and Python suites
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v1.3.1-slim/python"
          python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt \
            >"$root/pip.log" 2>&1
          for script in \
            validate_plan_v2.py validate_plan_v2_extensions.py validate_plan_v1_2.py \
            validate_plan_v1_2_1.py validate_plan_v1_2_2.py validate_plan_v1_3.py \
            validate_plan_v1_3_1.py validate_v1_3_1_final_closure_v1.py \
            validate_h01_h02_next_v1.py validate_h02_candidate_adapters_v1.py \
            validate_h02_openraft_inmemory_cluster_v1.py validate_h02_openraft_fault_lab_v1.py \
            validate_h02_blocker_closure_v1.py validate_h02_exact_head_matrix_contract_v1.py \
            validate_h02_pr40_reconciliation_v1.py; do
            python3 "scripts/$script" | tee -a "$root/validators.log"
          done
          for suite in oracle platform plan; do
            python3 -m unittest discover -s "tests/$suite" -p 'test_*.py' -v \
              >"$root/tests-$suite.log" 2>&1
          done
          python3 -m compileall -q scripts tests
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install Rust 1.88 and 1.98
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          Path('/tmp/rustup-init.sh').write_bytes(urlopen('https://sh.rustup.rs', timeout=60).read())
          PY
            sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          for toolchain in 1.88.0 1.98.0; do
            rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          done
          rustc +1.98.0 --version --verbose | tee "$RUNNER_TEMP/v1.3.1-slim/root-rust/rustc-1.98.txt"
          cargo +1.98.0 --version --verbose | tee "$RUNNER_TEMP/v1.3.1-slim/root-rust/cargo-1.98.txt"

      - name: Format, test and lint root workspace
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v1.3.1-slim/root-rust"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/v1.3.1-slim/root-target"
          cargo +1.98.0 fmt --all -- --check >"$root/fmt.log" 2>&1
          cargo +1.98.0 test --locked --workspace --all-targets >"$root/test.log" 2>&1
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings \
            >"$root/clippy.log" 2>&1
          rm -rf "$CARGO_TARGET_DIR"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Execute and classify exact P0 socket evidence
        shell: bash
        env:
          HEPTABAO_P0_AUDIT_PATH: ${{ runner.temp }}/v1.3.1-slim-p0-audit.log
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v1.3.1-slim/p0"
          stderr="$root/server.stderr"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/v1.3.1-slim/p0-target"
          cargo +1.98.0 run --quiet --locked -p heptabao-p0-server \
            >"$root/server.stdout" 2>"$stderr" &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            rm -rf "$CARGO_TARGET_DIR"
          }
          trap cleanup EXIT
          python3 scripts/p0_transport_exact_v1.py \
            --stderr "$stderr" --audit "$HEPTABAO_P0_AUDIT_PATH" \
            >"$root/raw-result.json"
          python3 scripts/classify_p0_transport_evidence_v1.py \
            --input "$root/raw-result.json" --output "$root/classified-result.json" \
            | tee "$root/classification.log"
          python3 scripts/validate_p0_transport_evidence_v2.py \
            --input "$root/classified-result.json" \
            --expected-commit "$SUBJECT_SHA" \
            --expected-repository "$SUBJECT_REPOSITORY" \
            | tee "$root/validation.log"
          cp "$HEPTABAO_P0_AUDIT_PATH" "$root/audit.log"
          test -s "$root/audit.log"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Compile and execute H02 exact matrix without early abort
        shell: bash
        run: |
          set +e
          root="$RUNNER_TEMP/v1.3.1-slim/h02"
          manifest=probes/h02/openraft-tokio/Cargo.toml
          cargo +1.88.0 metadata --locked --format-version 1 --manifest-path "$manifest" \
            >"$root/metadata.json" 2>"$root/metadata.stderr"
          metadata_rc=$?
          cargo +1.98.0 fmt --manifest-path "$manifest" --all -- --check \
            >"$root/fmt.log" 2>&1
          fmt_rc=$?
          compile_rc=0
          for toolchain in 1.88.0 1.98.0; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/v1.3.1-slim/h02-compile-$toolchain"
            cargo +"$toolchain" test --locked --all-targets --manifest-path "$manifest" \
              >"$root/test-$toolchain.log" 2>&1 || compile_rc=1
            cargo +"$toolchain" clippy --locked --all-targets --manifest-path "$manifest" -- -D warnings \
              >"$root/clippy-$toolchain.log" 2>&1 || compile_rc=1
            rm -rf "$CARGO_TARGET_DIR"
          done
          python3 scripts/h02_exact_head_matrix_v1.py \
            --repository "$SUBJECT_REPOSITORY" \
            --ref "executor:$GITHUB_REF_NAME" \
            --commit "$SUBJECT_SHA" \
            --tree "$SUBJECT_TREE" \
            --manifest "$manifest" \
            --output-dir "$root/matrix" \
            --cargo-target-root "$RUNNER_TEMP/v1.3.1-slim/h02-matrix-target" \
            --entry-timeout-seconds 240 \
            >"$root/matrix-runner.log" 2>&1
          matrix_rc=$?
          rm -rf "$RUNNER_TEMP/v1.3.1-slim/h02-matrix-target"
          printf 'metadata=%s\nfmt=%s\ncompile=%s\nmatrix=%s\n' \
            "$metadata_rc" "$fmt_rc" "$compile_rc" "$matrix_rc" \
            >"$root/exits.txt"
          exit 0

      - name: Upload complete evidence before final gate
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1.3.1-slim-exact-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v1.3.1-slim/
          if-no-files-found: error
          retention-days: 30

      - name: Require exact-source technical PASS and emit receipt
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v1.3.1-slim"
          grep -qx 'metadata=0' "$root/h02/exits.txt"
          grep -qx 'fmt=0' "$root/h02/exits.txt"
          grep -qx 'compile=0' "$root/h02/exits.txt"
          grep -qx 'matrix=0' "$root/h02/exits.txt"
          python3 - "$root" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          p0_path = root / 'p0/classified-result.json'
          h02_path = root / 'h02/matrix/matrix-summary.json'
          p0 = json.loads(p0_path.read_text(encoding='utf-8'))
          h02 = json.loads(h02_path.read_text(encoding='utf-8'))
          assert p0['source']['commit'] == os.environ['SUBJECT_SHA']
          assert p0['counts'] == {
              'executed_pass': 11,
              'source_bound_pass': 2,
              'best_effort_source_bound_pass': 1,
              'fail': 0,
              'blocked': 0,
              'unexecuted': 0,
              'total': 14,
          }
          assert h02['result'] == 'PASS'
          assert h02['matrix']['executed_entry_count'] == 24
          assert h02['counts'] == {
              'pass': 24,
              'fail': 0,
              'blocked': 0,
              'unknown': 0,
              'unexecuted': 0,
          }
          assert h02['qualification'] is False
          assert h02['compatibility_claim'] is False
          assert h02['selection_effect'] == 'NONE'
          assert h02['authority_effect'] == 'NONE'

          def digest(path: Path) -> str:
              return 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()

          receipt = {
              'schema': 'heptabao.v1-3-1-executor-technical-receipt.v1',
              'executor': {
                  'repository': os.environ['GITHUB_REPOSITORY'],
                  'commit': os.environ['GITHUB_SHA'],
                  'ref': os.environ['GITHUB_REF'],
                  'run_id': os.environ['GITHUB_RUN_ID'],
                  'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'runner_name': os.environ.get('RUNNER_NAME', ''),
                  'runner_os': os.environ.get('RUNNER_OS', ''),
                  'runner_arch': os.environ.get('RUNNER_ARCH', ''),
              },
              'subject': {
                  'repository': os.environ['SUBJECT_REPOSITORY'],
                  'commit': os.environ['SUBJECT_SHA'],
                  'tree': os.environ['SUBJECT_TREE'],
              },
              'gates': {
                  'plan_python': 'PASS',
                  'root_rust_1_98': 'PASS',
                  'p0': {
                      'runtime_socket_observed': 11,
                      'exact_head_compiled_source_bound': 2,
                      'best_effort_source_bound': 1,
                      'digest': digest(p0_path),
                  },
                  'h02': {
                      'executed_entries': 24,
                      'pass': 24,
                      'digest': digest(h02_path),
                  },
              },
              'independent_reproduction': False,
              'qualification': False,
              'compatibility_claim': False,
              'selected_candidates': [],
              'selection_effect': 'NONE',
              'production_authority': False,
              'migration_authority': False,
              'release_authority': False,
              'authority_effect': 'NONE',
          }
          (root / 'technical-receipt.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print('V1.3.1 exact canonical source technical PASS; authority=NONE')
          PY

      - name: Upload final receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1.3.1-slim-exact-source-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v1.3.1-slim/technical-receipt.json
          if-no-files-found: warn
          retention-days: 30
