name: v1-2-1-exact-head-technical-arm

on:
  push:
    branches: ["codex/plan-v1.2.1-technical-gap-closure-v1"]
    paths:
      - ".github/workflows/v1-2-1-exact-head-technical-arm.yml"
      - "README.md"
      - "docs/**"
      - "planning/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "probes/h02/openraft-tokio/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-2-1-exact-head-technical-arm-${{ github.sha }}
  cancel-in-progress: false

env:
  TOOLCHAINS: "1.88.0 1.98.0"
  SEEDS: "0x5eed20260828cafe 0x8badf00d12345678 0xd15ea5e5cafef00d"
  VALIDIT_REV: "7016fa5e072a86092928144b3a3040381e6964e9"

jobs:
  exact-head:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/results"
          printf 'repository=%s\nref=%s\ncommit=%s\ntree=%s\nrunner=%s\nos=%s\narch=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_SHA" "$(git rev-parse 'HEAD^{tree}')" \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" \
            | tee "$RUNNER_TEMP/results/source-binding.txt"

      - name: Install exact Python dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt
      - run: python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt

      - name: Run every plan and Python gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_plan_v2.py
          python3 scripts/validate_plan_v2_extensions.py
          python3 scripts/validate_plan_v1_2.py
          python3 scripts/validate_plan_v1_2_1.py
          python3 scripts/validate_h01_h02_next_v1.py
          python3 scripts/validate_h02_candidate_adapters_v1.py
          python3 scripts/validate_h02_openraft_inmemory_cluster_v1.py
          python3 scripts/validate_h02_openraft_fault_lab_v1.py
          python3 scripts/validate_h02_blocker_closure_v1.py
          python3 scripts/h02_dependency_probe_v1.py validate-matrix
          python3 -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python3 -m unittest discover -s tests/platform -p 'test_*.py' -v
          python3 -m unittest discover -s tests/plan -p 'test_*.py' -v

      - name: Install exact Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustc +1.98.0 --version --verbose | tee "$RUNNER_TEMP/results/rustc-1.98.0.txt"
          rustc +1.88.0 --version --verbose | tee "$RUNNER_TEMP/results/rustc-1.88.0.txt"

      - name: Validate root Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Bind exact OpenRaft graph
        shell: bash
        run: |
          set -euo pipefail
          manifest=probes/h02/openraft-tokio/Cargo.toml
          lock=probes/h02/openraft-tokio/Cargo.lock
          test -s "$lock"
          sha256sum "$manifest" | tee "$RUNNER_TEMP/results/openraft-manifest.sha256"
          sha256sum "$lock" | tee "$RUNNER_TEMP/results/openraft-lock.sha256"
          cargo +1.88.0 metadata --locked --format-version 1 --manifest-path "$manifest" \
            > "$RUNNER_TEMP/results/openraft-metadata.json"
          python3 - "$RUNNER_TEMP/results/openraft-metadata.json" "$VALIDIT_REV" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          rev = sys.argv[2]
          rows = [p for p in value["packages"] if p["name"] == "validit"]
          assert len(rows) == 1, rows
          assert rows[0]["version"] == "0.2.5", rows[0]
          assert rows[0]["source"] == f"git+https://github.com/drmingdrmer/validit.git?rev={rev}#{rev}", rows[0]
          family = {p["name"]: p["version"] for p in value["packages"] if p["name"] in {
              "openraft", "openraft-macros", "openraft-memstore", "openraft-rt", "openraft-rt-tokio"
          }}
          assert family == {name: "0.10.0-alpha.33" for name in family}
          assert set(family) == {"openraft", "openraft-macros", "openraft-memstore", "openraft-rt", "openraft-rt-tokio"}
          PY

      - name: Compile test and lint OpenRaft exact graph
        shell: bash
        run: |
          set -euo pipefail
          manifest=probes/h02/openraft-tokio/Cargo.toml
          cargo +1.98.0 fmt --manifest-path "$manifest" --all -- --check
          for toolchain in $TOOLCHAINS; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/openraft-target-$toolchain"
            cargo +"$toolchain" test --locked --all-targets --manifest-path "$manifest" \
              2>&1 | tee "$RUNNER_TEMP/results/openraft-test-$toolchain.log"
            cargo +"$toolchain" clippy --locked --all-targets --manifest-path "$manifest" -- -D warnings \
              2>&1 | tee "$RUNNER_TEMP/results/openraft-clippy-$toolchain.log"
          done

      - name: Execute all 24 candidate entries serially
        shell: bash
        run: |
          set -euo pipefail
          manifest=probes/h02/openraft-tokio/Cargo.toml
          for toolchain in $TOOLCHAINS; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/openraft-target-$toolchain"
            for seed in $SEEDS; do
              suffix="${toolchain}-${seed#0x}"
              cargo +"$toolchain" run --quiet --locked --manifest-path "$manifest" \
                --bin heptabao-h02-openraft-inmemory-cluster -- --seed "$seed" \
                > "$RUNNER_TEMP/results/inmemory-$suffix.jsonl"
              cargo +"$toolchain" run --quiet --locked --manifest-path "$manifest" \
                --bin heptabao-h02-openraft-fault-lab -- --mode hostile-snapshot-parent --seed "$seed" \
                > "$RUNNER_TEMP/results/hostile-$suffix.json"
              cargo +"$toolchain" run --quiet --locked --manifest-path "$manifest" \
                --bin heptabao-h02-openraft-blocker-closure-lab -- --mode all --seed "$seed" \
                > "$RUNNER_TEMP/results/blocker-$suffix.json"
              cargo +"$toolchain" run --quiet --locked --manifest-path "$manifest" \
                --bin heptabao-h02-openraft-durable-store-lab -- --seed "$seed" \
                > "$RUNNER_TEMP/results/durable-$suffix.json"
              python3 - "$RUNNER_TEMP/results/hostile-$suffix.json" "$RUNNER_TEMP/results/blocker-$suffix.json" "$RUNNER_TEMP/results/durable-$suffix.json" <<'PY'
          import json, sys
          hostile, blocker, durable = [json.load(open(path, encoding="utf-8")) for path in sys.argv[1:]]
          assert hostile["status"] == "EXECUTED_PASS", hostile
          assert blocker["status"] == "EXECUTED_PASS", blocker
          assert durable["status"] == "EXECUTED_PASS", durable
          assert len(durable["cases"]) == 7, durable
          assert all(case["status"] == "PASS" for case in durable["cases"]), durable
          for value in (hostile, blocker, durable):
              assert value["qualification"] is False
              assert value["authority_effect"] == "NONE"
          assert durable["selection_effect"] == "NONE"
          PY
            done
          done
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Emit fail-closed exact-head result
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/results/exact-head-result.json" "$GITHUB_SHA" "$(git rev-parse 'HEAD^{tree}')" <<'PY'
          import json, sys
          value = {
              "schema": "heptabao.v1-2-1-exact-head-technical-result.v1",
              "source_commit": sys.argv[2],
              "source_tree": sys.argv[3],
              "environment": "github-hosted-ubuntu-24.04-arm",
              "toolchains": ["1.88.0", "1.98.0"],
              "seeds": ["0x5eed20260828cafe", "0x8badf00d12345678", "0xd15ea5e5cafef00d"],
              "status": "EXECUTED_PASS",
              "qualification": False,
              "compatibility_claim": False,
              "selected_candidates": [],
              "selection_effect": "NONE",
              "authority_effect": "NONE"
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(value, handle, sort_keys=True, indent=2)
              handle.write("\n")
          print(json.dumps(value, sort_keys=True))
          PY

      - name: Upload complete exact-head diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1-2-1-exact-head-arm-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: warn
          retention-days: 30
