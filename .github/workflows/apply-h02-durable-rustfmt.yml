name: apply-h02-durable-rustfmt

on:
  push:
    branches: ["codex/h02-durable-multiprocess-closure-v2"]
    paths: [".github/workflows/apply-h02-durable-rustfmt.yml"]

permissions:
  contents: write

concurrency:
  group: apply-h02-durable-rustfmt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-rustfmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install exact formatter
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Apply deterministic Rust formatting and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rustup run 1.98.0 cargo fmt \
            --manifest-path probes/h02/openraft-tokio/Cargo.toml --all
          git rm .github/workflows/apply-h02-durable-rustfmt.yml
          unexpected="$(git diff --name-only --diff-filter=ACMRTUXB | grep -Ev '^probes/h02/openraft-tokio/' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected rustfmt paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git add probes/h02/openraft-tokio
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(h02): apply exact Rust formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
