name: execute-v1.3.1-final-repository-closure-windows2022-v1

on:
  push:
    branches:
      - "exec/v1-3-1-final-repository-closure-windows2022-v1"

permissions:
  contents: write

concurrency:
  group: execute-v1.3.1-final-repository-closure-windows2022-v1
  cancel-in-progress: true

env:
  TARGET_BRANCH: codex/plan-v1.3-gap-closure-v2
  EXPECTED_TARGET_HEAD: e3f351b23ba0ca51125ad3d5aad7273fe6b623fe

jobs:
  close:
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout exact audited executor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Bind target lease and preserve patch programs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_TARGET_HEAD"
          cp bootstrap/v1.3.1-final-repository-closure/patch.py "$RUNNER_TEMP/patch.py"
          cp bootstrap/v1.3.1-final-repository-closure/patch_e3f_delta.py "$RUNNER_TEMP/patch_e3f_delta.py"
          cp bootstrap/v1.3.1-final-repository-closure/normalize_patch_programs.py "$RUNNER_TEMP/normalize_patch_programs.py"
          cp bootstrap/v1.3.1-final-repository-closure/patch_gate_delta.py "$RUNNER_TEMP/patch_gate_delta.py"
          sha256sum \
            "$RUNNER_TEMP/patch.py" \
            "$RUNNER_TEMP/patch_e3f_delta.py" \
            "$RUNNER_TEMP/normalize_patch_programs.py" \
            "$RUNNER_TEMP/patch_gate_delta.py"
          git config core.autocrlf false
          git checkout --force --detach "$EXPECTED_TARGET_HEAD"
          git reset --hard "$EXPECTED_TARGET_HEAD"
          git clean -ffdx
          git checkout-index -f -a
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Apply final repository-controlled closure
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/normalize_patch_programs.py" \
            "$RUNNER_TEMP/patch.py" "$RUNNER_TEMP/patch_e3f_delta.py"
          python "$RUNNER_TEMP/patch.py"
          python "$RUNNER_TEMP/patch_e3f_delta.py"
          python "$RUNNER_TEMP/patch_gate_delta.py"
          git diff --check
          test -z "$(git diff --name-only -- '.github/workflows/**')"

      - name: Execute plan and Python regression gates
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python scripts/validate_plan_v2.py
          python scripts/validate_plan_v2_extensions.py
          python scripts/validate_plan_v1_2.py
          python scripts/validate_plan_v1_2_1.py
          python scripts/validate_plan_v1_2_2.py
          python scripts/validate_plan_v1_3.py
          python scripts/validate_plan_v1_3_1.py
          python scripts/validate_h01_h02_next_v1.py
          python scripts/validate_h02_candidate_adapters_v1.py
          python scripts/validate_h02_openraft_inmemory_cluster_v1.py
          python scripts/validate_h02_openraft_fault_lab_v1.py
          python scripts/validate_h02_blocker_closure_v1.py
          python scripts/validate_h02_exact_head_matrix_contract_v1.py
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/plan -p 'test_*.py' -v

      - name: Format test and lint root and OpenRaft graphs
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          manifest=probes/h02/openraft-tokio/Cargo.toml
          cargo +1.98.0 fmt --manifest-path "$manifest" --all
          for toolchain in 1.88.0 1.98.0; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/openraft-target-$toolchain"
            cargo +"$toolchain" test --locked --all-targets --manifest-path "$manifest"
            cargo +"$toolchain" clippy --locked --all-targets --manifest-path "$manifest" -- -D warnings
          done
          git diff --check

      - name: Commit ordinary source and fast-forward target
        run: |
          set -euo pipefail
          git add -A
          test -z "$(git diff --cached --name-only -- '.github/workflows/**')"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(v1.3.1): close final repository-controlled gaps"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_TARGET_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
