name: exec V1.5.0 prospective source preflight

on:
  push:
    branches:
      - exec/v1.5.0-source-preflight-v1

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: exec-v1.5.0-source-preflight-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout immutable preflight controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Execute versioned source-preflight controller
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .exec/run_v1_5_0_source_preflight.sh
