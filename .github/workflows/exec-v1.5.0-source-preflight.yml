name: exec V1.5.0 prospective source preflight

on:
  push:
    branches:
      - exec/v1.5.0-source-preflight-v1

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: exec-v1.5.0-source-preflight-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-slim
    timeout-minutes: 240
    steps:
      - name: Checkout immutable preflight controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Ensure Rustup on slim image
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
            sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Execute versioned source-preflight controller
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .exec/run_v1_5_0_source_preflight.sh
