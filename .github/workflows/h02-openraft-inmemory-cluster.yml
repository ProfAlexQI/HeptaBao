name: h02-openraft-inmemory-cluster

on:
  pull_request:
    paths:
      - "planning/HEPTABAO_H02_OPENRAFT_INMEMORY_CLUSTER_V1.yaml"
      - "schemas/heptabao_h02_openraft_cluster_evidence_v1.schema.json"
      - "scripts/h02_openraft_inmemory_cluster_evidence_v1.py"
      - "scripts/validate_h02_openraft_inmemory_cluster_v1.py"
      - "tests/platform/test_h02_openraft_inmemory_cluster_v1.py"
      - "probes/h02/openraft-tokio/**"
      - ".github/workflows/h02-openraft-inmemory-cluster.yml"
  push:
    branches: ["codex/h02-openraft-inmemory-cluster-v1"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h02-openraft-inmemory-cluster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt
      - run: python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
      - run: python scripts/validate_h02_openraft_inmemory_cluster_v1.py
      - run: python -m unittest tests/platform/test_h02_openraft_inmemory_cluster_v1.py -v

  cluster-matrix:
    needs: validate-plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85.0", "1.98.0"]
        seed:
          - "0x5eed20260828cafe"
          - "0x8badf00d12345678"
          - "0xd15ea5e5cafef00d"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
      - name: Install exact Rust toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          set -euo pipefail
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup target add x86_64-unknown-linux-gnu --toolchain "$TOOLCHAIN"
          rustup run "$TOOLCHAIN" rustc --version --verbose
          rustup run "$TOOLCHAIN" cargo --version --verbose
      - name: Execute exact cluster twice and retain every outcome
        id: execute
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
          SEED: ${{ matrix.seed }}
        run: |
          set -u
          mkdir -p evidence "$RUNNER_TEMP/h02-openraft"
          cp -a probes/h02/openraft-tokio/. "$RUNNER_TEMP/h02-openraft/"
          manifest="$RUNNER_TEMP/h02-openraft/Cargo.toml"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/h02-openraft-target-${TOOLCHAIN}"
          status=0
          rustup run "$TOOLCHAIN" cargo generate-lockfile --manifest-path "$manifest" >evidence/cargo-generate-lockfile.log 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then
            rustup run "$TOOLCHAIN" cargo test --locked --all-targets --manifest-path "$manifest" >evidence/cargo-test.log 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            rustup run "$TOOLCHAIN" cargo run --quiet --locked --manifest-path "$manifest" --bin heptabao-h02-openraft-inmemory-cluster -- --seed "$SEED" >evidence/cluster-output.jsonl 2>evidence/cluster-stderr.log || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            rustup run "$TOOLCHAIN" cargo run --quiet --locked --manifest-path "$manifest" --bin heptabao-h02-openraft-inmemory-cluster -- --seed "$SEED" >evidence/cluster-replay.jsonl 2>evidence/cluster-replay-stderr.log || status=$?
          fi
          if [ -f "$RUNNER_TEMP/h02-openraft/Cargo.lock" ]; then
            cp "$RUNNER_TEMP/h02-openraft/Cargo.lock" evidence/Cargo.lock
          fi
          cp "$manifest" evidence/Cargo.toml
          printf '%s\n' "$status" > evidence/execution-exit-code.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build fail-closed evidence
        if: ${{ always() }}
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
          SEED: ${{ matrix.seed }}
          EXECUTION_EXIT_CODE: ${{ steps.execute.outputs.exit_code || '125' }}
        run: |
          set -euo pipefail
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          environment_id="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_NAME}-${TOOLCHAIN}-${SEED}"
          touch evidence/cluster-output.jsonl evidence/cluster-replay.jsonl evidence/Cargo.lock
          python scripts/h02_openraft_inmemory_cluster_evidence_v1.py collect \
            --adapter-output evidence/cluster-output.jsonl \
            --replay-output evidence/cluster-replay.jsonl \
            --execution-exit-code "$EXECUTION_EXIT_CODE" \
            --seed "$SEED" \
            --toolchain "$TOOLCHAIN" \
            --manifest evidence/Cargo.toml \
            --cargo-lock evidence/Cargo.lock \
            --source-commit "$GITHUB_SHA" \
            --source-tree "$tree_sha" \
            --branch "$branch" \
            --clean-tree \
            --environment-id "$environment_id" \
            --executor-kind github-hosted \
            --runner-id github-api-enrichment-pending \
            --runner-name "$RUNNER_NAME" \
            --output evidence/cluster-evidence.json
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          value = json.load(open('evidence/cluster-evidence.json', encoding='utf-8'))
          schema = json.load(open('schemas/heptabao_h02_openraft_cluster_evidence_v1.schema.json', encoding='utf-8'))
          errors = list(Draft202012Validator(schema).iter_errors(value))
          if errors:
              raise SystemExit([error.message for error in errors])
          assert value['qualification'] is False
          assert value['selection_effect'] == 'NONE'
          assert value['promotion_effect'].startswith('BLOCK_')
          assert value['authority_effect'] == 'NONE'
          print(value['status'], value['promotion_effect'])
          PY
      - name: Upload evidence before final gate
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h02-openraft-inmemory-${{ matrix.toolchain }}-${{ matrix.seed }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Require executed pass without qualification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          value = json.load(open('evidence/cluster-evidence.json', encoding='utf-8'))
          assert value['status'] == 'EXECUTED_PASS', value['status']
          assert value['scope']['real_full_snapshot_rpc'] is True
          assert value['qualification'] is False
          assert value['selection_effect'] == 'NONE'
          assert value['authority_effect'] == 'NONE'
          print('real in-memory cluster evidence passed; qualification=false selection=0 authority=NONE')
          PY

  authority-sentinel:
    needs: [validate-plan, cluster-matrix]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep all authority closed
        env:
          VALIDATE_RESULT: ${{ needs.validate-plan.result }}
          MATRIX_RESULT: ${{ needs.cluster-matrix.result }}
        run: |
          set -euo pipefail
          printf 'validate=%s\nmatrix=%s\n' "$VALIDATE_RESULT" "$MATRIX_RESULT"
          test "$VALIDATE_RESULT" = success
          test "$MATRIX_RESULT" = success
          echo 'OpenRaft cluster evidence collected; qualification=false selection=0 authority=NONE.'
