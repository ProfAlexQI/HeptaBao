name: v1.4.1-converge-final-source

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - codex/v1.4-durable-single-node-foundation-v1
    paths:
      - .github/workflows/v1.4.1-converge-final-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  converge-verify-publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact source and branch
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "${{ github.event.pull_request.head.ref }}" = "codex/plan-v1.4-full-gap-closure-v1"

