name: materialize-v1.3.1-final-closure-slim

on:
  push:
    branches:
      - "exec/v1-3-1-materialize-final-closure-slim-v1"

permissions:
  contents: write

concurrency:
  group: materialize-v1.3.1-final-closure-slim
  cancel-in-progress: true

env:
  TARGET_BRANCH: codex/plan-v1.3.1-final-repository-closure-v1
  EXPECTED_TARGET_HEAD: 352a5397d36a93e33715148de4616c5e43bc2bf1
  EXECUTOR_COMMIT: 171124f7e6dfbcccec23025f9ef69026a1118d17

jobs:
  materialize:
    runs-on: ubuntu-slim
    timeout-minutes: 45
    steps:
      - name: Checkout exact transport source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact Python validation dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Bind immutable target and executor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TARGET_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_TARGET_HEAD"
          git cat-file -e "$EXECUTOR_COMMIT^{commit}"
          mkdir -p "$RUNNER_TEMP/final-closure"
          for file in \
            patch.py \
            patch_e3f_delta.py \
            normalize_patch_programs.py \
            patch_gate_delta.py \
            patch_final_delta.py
          do
            git show "$EXECUTOR_COMMIT:bootstrap/v1.3.1-final-repository-closure/$file" \
              > "$RUNNER_TEMP/final-closure/$file"
          done
          sha256sum "$RUNNER_TEMP/final-closure"/*.py
          git checkout --force --detach "$EXPECTED_TARGET_HEAD"
          git reset --hard "$EXPECTED_TARGET_HEAD"
          git clean -ffdx
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Apply exact locally preflighted closure
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/final-closure"
          python3 "$root/normalize_patch_programs.py" \
            "$root/patch.py" \
            "$root/patch_e3f_delta.py" \
            "$root/patch_gate_delta.py"
          python3 "$root/patch.py"
          python3 "$root/patch_e3f_delta.py"
          python3 "$root/patch_gate_delta.py"
          python3 "$root/patch_final_delta.py"
          git diff --check
          test -z "$(git diff --name-only -- '.github/workflows/**')"

      - name: Execute complete semantic and Python gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python3 scripts/validate_plan_v2.py
          python3 scripts/validate_plan_v2_extensions.py
          python3 scripts/validate_plan_v1_2.py
          python3 scripts/validate_plan_v1_2_1.py
          python3 scripts/validate_plan_v1_2_2.py
          python3 scripts/validate_plan_v1_3.py
          python3 scripts/validate_plan_v1_3_1.py
          python3 scripts/validate_h01_h02_next_v1.py
          python3 scripts/validate_h02_candidate_adapters_v1.py
          python3 scripts/validate_h02_openraft_inmemory_cluster_v1.py
          python3 scripts/validate_h02_openraft_fault_lab_v1.py
          python3 scripts/validate_h02_blocker_closure_v1.py
          python3 scripts/validate_h02_exact_head_matrix_contract_v1.py
          python3 -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python3 -m unittest discover -s tests/platform -p 'test_*.py' -v
          python3 -m unittest discover -s tests/plan -p 'test_*.py' -v
          git diff --check

      - name: Commit ordinary source and fast-forward isolated target
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          test -z "$(git diff --cached --name-only -- '.github/workflows/**')"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(v1.3.1): close final repository-controlled gaps"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_TARGET_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
