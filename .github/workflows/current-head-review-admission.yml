name: current-head review admission

# This is a repository-change admission receipt, not a qualification or release
# authority. Technical workflows complete first; two eligible reviewers then
# approve that unchanged head; a metadata-only edit installs the exact V2 digest
# marker. Missing or stale markers fail rather than skip. Native protected-branch
# review rules and the final merge controller remain mandatory for later review
# dismissal or change-request invalidation.
on:
  pull_request:
    branches:
      - integration/v1.4.4-technical-candidate
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - edited
      - review_requested
      - review_request_removed

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  current-head-review-admission:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout the exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind checkout to the live event tuple
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Evaluate the complete repository-change review packet
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/current_head_review_admission_v2.py
          python3 scripts/current_head_review_admission_v2.py \
            --repository "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --event-head-sha "$EVENT_HEAD_SHA" \
            --event-base-sha "$EVENT_BASE_SHA" \
            --output "$RUNNER_TEMP/current-head-review-admission-v2.json"
          cat "$RUNNER_TEMP/current-head-review-admission-v2.json"
          {
            echo '## Current-head repository-change review admission V2'
            echo
            echo '- exact marker: present and current'
            echo '- two exact-head reviewer decisions: admitted'
            echo '- approvals submitted after all four technical workflow families'
            echo '- live collaborator permissions and CODEOWNERS policy: admitted'
            echo '- prospective merge signature, ordered parents and tree: admitted'
            echo '- qualification/release/production authority: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
