name: apply-h02-candidate-binding-contract

on:
  push:
    branches: ["codex/h02-durable-multiprocess-closure-v2"]
    paths: [".github/workflows/apply-h02-candidate-binding-contract.yml"]

permissions:
  contents: write

concurrency:
  group: apply-h02-candidate-binding-contract
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/h02-durable-multiprocess-closure-v2
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt
      - run: python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
      - name: Patch candidate binding and negative tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              assert count == 1, f"{label}: expected one match, found {count}"
              return text.replace(old, new, 1)

          harness_path = Path("scripts/h02_candidate_adapter_harness_v1.py")
          harness = harness_path.read_text(encoding="utf-8")
          harness = replace_once(
              harness,
              '        "support_dependencies": ["openraft-memstore", "serde_json", "tokio", "validit"],\n',
              '''        "support_dependencies": [
                      "futures",
                      "openraft-macros",
                      "openraft-memstore",
                      "openraft-rt",
                      "openraft-rt-tokio",
                      "serde",
                      "serde_json",
                      "tokio",
                  ],
                  "source_overrides": {
                      "validit": {
                          "git": "https://github.com/drmingdrmer/validit.git",
                          "rev": "7016fa5e072a86092928144b3a3040381e6964e9",
                      },
                  },
          ''',
              "openraft profile",
          )
          helper = '''def _source_override_binding(path: Path, package: str, spec: Any) -> dict[str, Any]:
              if not isinstance(spec, dict):
                  raise Failure(f"{path}: source override {package!r} must be an inline table")
              allowed_keys = {"git", "rev"}
              unexpected_keys = sorted(set(spec) - allowed_keys)
              if unexpected_keys:
                  raise Failure(
                      f"{path}: source override {package!r} has unapproved keys: {unexpected_keys!r}"
                  )
              git = str(spec.get("git", ""))
              rev = str(spec.get("rev", ""))
              if not git.startswith("https://") or git.endswith("/"):
                  raise Failure(f"{path}: source override {package!r} must use an exact HTTPS Git URL")
              if len(rev) != 40 or any(character not in "0123456789abcdef" for character in rev):
                  raise Failure(f"{path}: source override {package!r} must use a full lowercase commit SHA")
              return {"package": package, "git": git, "rev": rev}


          '''
          harness = replace_once(
              harness,
              "def manifest_binding(\n",
              helper + "def manifest_binding(\n",
              "source override helper insertion",
          )
          old_binding = '''    expected_packages = {candidate_package, *support_dependencies}
              actual_packages = set(dependencies)
          '''
          new_binding = '''    expected_overrides_raw = profile.get("source_overrides", {})
              if not isinstance(expected_overrides_raw, dict):
                  raise Failure(f"{path}: expected source override profile must be a mapping")
              expected_overrides = {
                  str(package): _source_override_binding(path, str(package), spec)
                  for package, spec in sorted(expected_overrides_raw.items())
              }
              patch_tables = document.get("patch", {})
              if not isinstance(patch_tables, dict):
                  raise Failure(f"{path}: patch tables must be a mapping")
              if expected_overrides:
                  if set(patch_tables) != {"crates-io"}:
                      raise Failure(
                          f"{path}: source override registry drift: {sorted(patch_tables)!r}"
                      )
                  crates_io = patch_tables.get("crates-io", {})
                  if not isinstance(crates_io, dict):
                      raise Failure(f"{path}: patch.crates-io must be a mapping")
                  if set(crates_io) != set(expected_overrides):
                      missing = sorted(set(expected_overrides) - set(crates_io))
                      unexpected = sorted(set(crates_io) - set(expected_overrides))
                      raise Failure(
                          f"{path}: source override drift: missing={missing!r} unexpected={unexpected!r}"
                      )
                  source_overrides = {
                      str(package): _source_override_binding(path, str(package), spec)
                      for package, spec in sorted(crates_io.items())
                  }
                  for package, expected in expected_overrides.items():
                      if source_overrides[package] != expected:
                          raise Failure(
                              f"{path}: source override {package!r} drift: "
                              f"{source_overrides[package]!r} != {expected!r}"
                          )
              else:
                  if patch_tables:
                      raise Failure(f"{path}: unbound patch tables are forbidden")
                  source_overrides = {}

              expected_packages = {candidate_package, *support_dependencies}
              actual_packages = set(dependencies)
          '''
          harness = replace_once(harness, old_binding, new_binding, "manifest override binding")
          harness = replace_once(
              harness,
              '        "direct_dependencies": dependency_profile,\n        "toolchain": toolchain,\n',
              '        "direct_dependencies": dependency_profile,\n        "source_overrides": source_overrides,\n        "toolchain": toolchain,\n',
              "binding digest source overrides",
          )
          harness_path.write_text(harness, encoding="utf-8")

          tests_path = Path("tests/platform/test_h02_candidate_adapter_harness_v1.py")
          tests = tests_path.read_text(encoding="utf-8")
          old_specs = '''SUPPORT_DEPENDENCY_SPECS = {
              "jobserver": 'jobserver = "=0.1.32"',
              "openraft-memstore": 'openraft-memstore = "=0.10.0-alpha.33"',
              "serde_json": 'serde_json = "=1.0.145"',
              "tokio": (
                  'tokio = { version = "=1.53.1", default-features = false, '
                  'features = ["macros", "process", "rt-multi-thread", "sync", "time"] }'
              ),
              "validit": 'validit = "=0.2.6"',
              "zeroize": 'zeroize = "=1.8.2"',
          }
          '''
          new_specs = '''SUPPORT_DEPENDENCY_SPECS = {
              "futures": 'futures = "=0.3.34"',
              "jobserver": 'jobserver = "=0.1.32"',
              "openraft-macros": 'openraft-macros = "=0.10.0-alpha.33"',
              "openraft-memstore": 'openraft-memstore = "=0.10.0-alpha.33"',
              "openraft-rt": 'openraft-rt = "=0.10.0-alpha.33"',
              "openraft-rt-tokio": 'openraft-rt-tokio = "=0.10.0-alpha.33"',
              "serde": 'serde = { version = "=1.0.229", features = ["derive"] }',
              "serde_json": 'serde_json = "=1.0.145"',
              "tokio": (
                  'tokio = { version = "=1.53.1", default-features = false, '
                  'features = ["macros", "process", "rt-multi-thread", "sync", "time"] }'
              ),
              "zeroize": 'zeroize = "=1.8.2"',
          }
          '''
          tests = replace_once(tests, old_specs, new_specs, "support dependency specs")
          old_workspace = '''    for dependency in profile["support_dependencies"]:
                  lines.append(SUPPORT_DEPENDENCY_SPECS[dependency])
              lines.extend(["", "[workspace]", ""])
          '''
          new_workspace = '''    for dependency in profile["support_dependencies"]:
                  lines.append(SUPPORT_DEPENDENCY_SPECS[dependency])
              source_overrides = profile.get("source_overrides", {})
              if source_overrides:
                  lines.extend(["", "[patch.crates-io]"])
                  for dependency, spec in sorted(source_overrides.items()):
                      lines.append(
                          f'{dependency} = {{ git = {json.dumps(spec["git"])}, '
                          f'rev = {json.dumps(spec["rev"])} }}'
                      )
              lines.extend(["", "[workspace]", ""])
          '''
          tests = replace_once(tests, old_workspace, new_workspace, "synthetic source override")
          test_case = '''    def test_source_override_drift_rejected(self):
                  with tempfile.TemporaryDirectory() as temporary:
                      root = Path(temporary)
                      manifest = make_repo(root, "openraft")
                      expected = mod.PROFILES["openraft"]["source_overrides"]["validit"]["rev"]
                      manifest.write_text(
                          manifest.read_text(encoding="utf-8").replace(expected, "0" * 40, 1),
                          encoding="utf-8",
                      )
                      with self.assertRaises(mod.Failure):
                          mod.manifest_binding(
                              root,
                              mod.PROFILES["openraft"],
                              "1.88.0",
                              "x86_64-unknown-linux-gnu",
                          )

          '''
          tests = replace_once(
              tests,
              "    def test_meta_mismatch_rejected(self):\n",
              test_case + "    def test_meta_mismatch_rejected(self):\n",
              "source override negative test",
          )
          tests_path.write_text(tests, encoding="utf-8")
          PY
          python -m py_compile scripts/h02_candidate_adapter_harness_v1.py tests/platform/test_h02_candidate_adapter_harness_v1.py
          python scripts/validate_h02_candidate_adapters_v1.py
          python -m unittest tests/platform/test_h02_candidate_adapter_harness_v1.py -v
          git diff --check
      - name: Commit tested contract and remove maintenance workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-h02-candidate-binding-contract.yml
          git add scripts/h02_candidate_adapter_harness_v1.py tests/platform/test_h02_candidate_adapter_harness_v1.py .github/workflows/apply-h02-candidate-binding-contract.yml
          git config user.name "heptabao-closure-bot"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git commit -m "fix(h02): bind candidate source overrides separately"
          git push origin HEAD:codex/h02-durable-multiprocess-closure-v2
