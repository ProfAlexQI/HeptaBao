name: v1.3.1-org-migration-transport

on:
  push:
    branches:
      - "codex/v1.3.1-org-migration-transport-20260831"

permissions:
  contents: write

concurrency:
  group: v1.3.1-org-migration-transport-20260831
  cancel-in-progress: false

env:
  BASE_SHA: 866ceaec435b3da9f759d8dcb582252f0c48e5c4
  EXPECTED_TREE: 964be2e7a10d5efc255580bdbef82de79a38b1f0
  PATCH_GZIP_SHA256: 1f75bdb29e60bf94f187d819836b2fd4ce12c29438bba163cc88d5bf3a0e2735
  PATCH_SHA256: 607bae18f45a0d4e6a3ed68e33b115bd982b0361757a0ad377c030f5bb093882
  RESULT_BRANCH: codex/v1.3.1-org-migration-result-20260831

jobs:
  apply-verified-tree:
    if: ${{ github.repository == 'TrillionniumFoundation/HeptaBao' && github.actor == 'ProfHepta' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact transport commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind transport parent and payload
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/codex/v1.3.1-org-migration-transport-20260831"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "77eb9c49bb1a6172a14792bc342c292ff40b217a"
          test "$(sha256sum .github/transport/v1.3.1-org-migration.patch.gz | awk '{print $1}')" = "$PATCH_GZIP_SHA256"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Apply payload and verify exact result tree
        id: build
        shell: bash
        run: |
          set -euo pipefail
          worktree="$RUNNER_TEMP/heptabao-org-migration"
          patch="$RUNNER_TEMP/v1.3.1-org-migration.patch"
          git worktree add --detach "$worktree" "$BASE_SHA"
          gzip -dc .github/transport/v1.3.1-org-migration.patch.gz > "$patch"
          test "$(sha256sum "$patch" | awk '{print $1}')" = "$PATCH_SHA256"
          cd "$worktree"
          git apply --check "$patch"
          git apply --index "$patch"
          git diff --cached --check
          tree="$(git write-tree)"
          test "$tree" = "$EXPECTED_TREE"
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"

      - name: Validate complete repository-controlled source surface
        shell: bash
        run: |
          set -euo pipefail
          worktree="$RUNNER_TEMP/heptabao-org-migration"
          cd "$worktree"
          python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python3 scripts/validate_plan_v1_3_1.py
          python3 scripts/validate_v1_3_1_final_closure_v1.py
          python3 -m unittest discover -s tests/oracle -p 'test_*.py'
          python3 -m unittest discover -s tests/platform -p 'test_*.py'
          python3 -m unittest discover -s tests/plan -p 'test_*.py'
          python3 -m compileall -q scripts tests
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 fmt --manifest-path probes/h02/openraft-tokio/Cargo.toml --all -- --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Publish one-parent implementation commit to isolated result branch
        shell: bash
        env:
          RESULT_TREE: ${{ steps.build.outputs.tree }}
        run: |
          set -euo pipefail
          test "$RESULT_TREE" = "$EXPECTED_TREE"
          worktree="$RUNNER_TEMP/heptabao-org-migration"
          cd "$worktree"
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          message_file="$RUNNER_TEMP/implementation-message.txt"
          {
            printf '%s\n' 'fix(v1.3.1): bind exact closure to organization repository identity'
            printf '\n'
            printf '%s\n' 'Migrate the current V1.3.1 technical evidence contract from the historical ProfHepta/HeptaBao namespace to TrillionniumFoundation/HeptaBao, keep the historical identity explicit, separate the human PR ratifier from the organization repository owner, and close the observed H02 rustfmt drift.'
            printf '\n'
            printf '%s\n' 'The exact result tree is verified before publication. This implementation commit grants no qualification, compatibility claim, candidate selection, production authority, migration authority, release authority, or other operational authority.'
            printf '\n'
            printf '%s\n' 'qualification=false' 'compatibility_claim=false' 'selection_effect=NONE' 'authority_effect=NONE'
          } > "$message_file"
          commit="$(git commit-tree "$RESULT_TREE" -p "$BASE_SHA" < "$message_file")"
          test "$(git rev-parse "$commit^{tree}")" = "$EXPECTED_TREE"
          test "$(git rev-parse "$commit^")" = "$BASE_SHA"
          cd "$GITHUB_WORKSPACE"
          git push --force origin "$commit:refs/heads/$RESULT_BRANCH"
          printf 'implementation_commit=%s\nresult_tree=%s\n' "$commit" "$RESULT_TREE" >> "$GITHUB_STEP_SUMMARY"
