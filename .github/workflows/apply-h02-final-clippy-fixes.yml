name: apply-h02-final-clippy-fixes

on:
  push:
    branches: ["codex/h02-durable-multiprocess-closure-v2"]
    paths: [".github/workflows/apply-h02-final-clippy-fixes.yml"]

permissions:
  contents: write

concurrency:
  group: apply-h02-final-clippy-fixes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact Clippy fixes, format, and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("probes/h02/openraft-tokio/src/bin/inmemory_cluster/cluster.rs"): [
                  ("0x4150_504c_59", "0x0041_5050_4c59"),
                  ("0x4348_414f_53", "0x0043_4841_4f53"),
              ],
              Path("probes/h02/openraft-tokio/src/bin/durable_store_lab/store.rs"): [
                  ("Ok(self.state.lock().await.vote.clone())", "Ok(self.state.lock().await.vote)"),
                  ("state.vote = Some(vote.clone());", "state.vote = Some(*vote);"),
              ],
              Path("probes/h02/openraft-tokio/src/bin/durable_store_lab.rs"): [
                  (
                      "let mut serials = vec![seed ^ 11, seed.rotate_left(7) ^ 12, seed.rotate_left(19) ^ 13];",
                      "let mut serials = [seed ^ 11, seed.rotate_left(7) ^ 12, seed.rotate_left(19) ^ 13];",
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected exactly one {old!r}, found {count}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup run 1.98.0 cargo fmt \
            --manifest-path probes/h02/openraft-tokio/Cargo.toml --all
          git rm .github/workflows/apply-h02-final-clippy-fixes.yml
          unexpected="$(git diff --name-only --diff-filter=ACMRTUXB | grep -Ev '^probes/h02/openraft-tokio/(src/bin/inmemory_cluster/cluster.rs|src/bin/durable_store_lab/store.rs|src/bin/durable_store_lab.rs)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'unexpected paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git add probes/h02/openraft-tokio
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(h02): clear remaining OpenRaft Clippy gates"
          git push origin "HEAD:${GITHUB_REF_NAME}"
