name: v1.4.2-bootstrap-test-fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - codex/plan-v1.4-full-gap-closure-v1
    paths:
      - .github/workflows/v1.4.2-bootstrap-test-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-verify-publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact staged head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact staged source
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test "${{ github.event.pull_request.head.ref }}" = "codex/plan-v1.4.2-recovery-foundation-v1"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf '%s\n' "$expected" >"$RUNNER_TEMP/source-head.txt"

      - name: Install exact Python dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install dependencies and extract audited bootstrap scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/v1.4.2-bootstrap-exact-candidate.yml')
              .read_text(encoding='utf-8')
          )
          steps = workflow['jobs']['construct-verify-publish']['steps']
          required = {
              'materialize': 'Verify and materialize exact 18-path candidate',
              'delta': 'Verify exact final Git delta',
              'current': 'Validate current exact V1.4.2 candidate',
              'frozen': 'Replay frozen V1.4.1 Python and Rust gates',
              'rust': 'Test and strictly lint current V1.4.2 workspace',
              'publish': 'Confirm non-authority and fast-forward publish',
          }
          by_name = {step.get('name'): step for step in steps}
          root = Path(os.environ['RUNNER_TEMP'])
          for key, name in required.items():
              step = by_name.get(name)
              if not isinstance(step, dict) or not isinstance(step.get('run'), str):
                  raise SystemExit(f'missing audited bootstrap script: {name}')
              (root / f'v142-{key}.sh').write_text(
                  step['run'],
                  encoding='utf-8',
              )
          PY

      - name: Materialize digest-bound candidate and repair Drop-safe tests
        shell: bash
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/v142-materialize.sh"
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/heptabao-recovery-core/src/lib.rs')
          source = path.read_text(encoding='utf-8')
          repairs = [
              (
                  '''        let mut target = MemoryTarget {
                      occupied: true,
                      ..MemoryTarget::default()
                  };''',
                  '''        let mut target = MemoryTarget::default();
                  target.occupied = true;''',
                  'occupied target',
              ),
              (
                  '''        let mut target = MemoryTarget {
                      outcome_unknown: true,
                      ..MemoryTarget::default()
                  };''',
                  '''        let mut target = MemoryTarget::default();
                  target.outcome_unknown = true;''',
                  'unknown-outcome target',
              ),
          ]
          for before, after, label in repairs:
              if source.count(before) != 1:
                  raise SystemExit(f'{label} test shape drifted')
              source = source.replace(before, after, 1)
          path.write_text(source, encoding='utf-8')
          PY
          rm -f .github/workflows/v1.4.2-bootstrap-test-fix.yml
          test ! -e .github/workflows/v1.4.2-bootstrap-exact-candidate.yml
          test ! -e .github/workflows/v1.4.2-bootstrap-test-fix.yml
          test ! -e .bootstrap/v1.4.2

      - name: Format and freeze exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(v1.4.2): add anchored recovery and key lifecycle foundation"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Verify exact 18-path final delta
        shell: bash
        run: bash "$RUNNER_TEMP/v142-delta.sh"

      - name: Validate current V1.4.2 source and regressions
        shell: bash
        run: bash "$RUNNER_TEMP/v142-current.sh"

      - name: Replay frozen V1.4.1 Python and Rust gates
        shell: bash
        run: bash "$RUNNER_TEMP/v142-frozen.sh"

      - name: Test and strictly lint current V1.4.2 workspace
        shell: bash
        run: bash "$RUNNER_TEMP/v142-rust.sh"

      - name: Confirm non-authority and fast-forward publish
        shell: bash
        run: bash "$RUNNER_TEMP/v142-publish.sh"

      - name: Emit exact rescue result
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## V1.4.2 exact clean candidate published'
            echo
            echo "- commit: `$(git rev-parse HEAD)`"
            echo "- tree: `$(git rev-parse HEAD^{tree})`"
            echo '- exact additive paths: 18'
            echo '- current and frozen Python regressions: PASS'
            echo '- current and frozen Rust 1.98 gates: PASS'
            echo '- bootstrap inputs and write workflows: absent'
            echo '- authority effect: NONE'
          } >>"$GITHUB_STEP_SUMMARY"
