name: HeptaBao verified V1.9 source reconstruction
on:
  push:
    branches: [exec/v1.9.0-verified-publish-20260905]
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      CARGO_TARGET_DIR: ${{ runner.temp }}/heptabao-verification-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Reconstruct verify and transfer source
        shell: bash
        run: bash .exec/verified/publish.sh
      - name: Preserve exact-source evidence and failed diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heptabao-verified-v190-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/heptabao-publication-evidence
          if-no-files-found: error
          retention-days: 7
