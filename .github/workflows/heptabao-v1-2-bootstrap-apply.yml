name: heptabao-v1-2-bootstrap-apply

on:
  push:
    branches: ["codex/heptabao-plan-v1-2-closure"]
    paths:
      - ".github/workflows/heptabao-v1-2-bootstrap-apply.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heptabao-v1-2-bootstrap-apply
  cancel-in-progress: false

jobs:
  apply-validated-transition:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact bootstrap head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact source and assemble audited bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          cat bootstrap/v1.2/closure.b64.part* | base64 --decode > "$RUNNER_TEMP/heptabao_v1_2_closure.zip"
          echo "0f1b0a564b2c3ffced4e0f96661af8817b8fd57a38d0206dd0fbbbafe40ded1f  $RUNNER_TEMP/heptabao_v1_2_closure.zip" | sha256sum --check -
          rm -rf "$RUNNER_TEMP/closure"
          mkdir -p "$RUNNER_TEMP/closure"
          unzip -q "$RUNNER_TEMP/heptabao_v1_2_closure.zip" -d "$RUNNER_TEMP/closure"
          test -f "$RUNNER_TEMP/closure/heptabao_v1_2_closure/apply_heptabao_v1_2_closure.py"

      - name: Install plan validation dependencies
        run: python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt

      - name: Apply exact-base V1.2 transition
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/closure/heptabao_v1_2_closure/apply_heptabao_v1_2_closure.py" . --allow-compatible-drift

      - name: Remove one-shot bootstrap surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap/v1.2
          rm -f .github/workflows/heptabao-v1-2-bootstrap-apply.yml
          rm -f .github/workflows/heptabao-source-export-v1.yml

      - name: Validate final tree
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_plan_v1_2.py
          python3 scripts/validate_h02_candidate_adapters_v1.py
          python3 scripts/validate_h02_openraft_inmemory_cluster_v1.py
          python3 scripts/validate_h02_openraft_fault_lab_v1.py
          python3 scripts/validate_h02_blocker_closure_v1.py
          python3 -m unittest \
            tests.plan.test_validate_plan_v1_2 \
            tests.platform.test_h02_candidate_adapter_harness_v1 \
            -v
          git diff --check

      - name: Commit deterministic transition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs(plan): deepen V1.2 and close deterministic H02 blockers"
          git push origin HEAD:codex/heptabao-plan-v1-2-closure
