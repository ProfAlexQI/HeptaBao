name: materialize-v1.3-macos

on:
  push:
    branches:
      - "exec/v1-3-materialize-macos-v1"

permissions:
  contents: write

concurrency:
  group: materialize-v1.3-macos
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout exact macOS transport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Bind, verify and materialize V1.3
        shell: bash
        env:
          TARGET_BRANCH: codex/plan-v1.3-foundation-closure-v1
          EXPECTED_TARGET_HEAD: 42841e6e6d753b2031b74888992ec167e66aafd1
          PAYLOAD_SHA256: 99bea9f712ecd6dcc587b80a8d774e091f6e79184ca105c74a36d65ed8d12e05
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_TARGET_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_TARGET_HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import tarfile
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "v13-macos"
          root.mkdir(parents=True, exist_ok=True)
          parts = sorted(Path("bootstrap/v1.3-overlay").glob("part-*.b64"))
          assert len(parts) == 25, [str(path) for path in parts]
          encoded = b"".join(
              path.read_bytes().replace(b"\r", b"").replace(b"\n", b"")
              for path in parts
          )
          payload = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(payload).hexdigest() == os.environ["PAYLOAD_SHA256"]
          archive = root / "overlay.tar.xz"
          archive.write_bytes(payload)
          with tarfile.open(archive, "r:xz") as tar:
              members = tar.getmembers()
              assert members
              for member in members:
                  target = (root / member.name).resolve()
                  assert target == root.resolve() or root.resolve() in target.parents
                  assert not member.issym() and not member.islnk()
              tar.extractall(root, filter="data")

          overlay = root / "overlay"
          manifest = json.loads((root / "OVERLAY_MANIFEST.json").read_text(encoding="utf-8"))
          assert manifest["schema"] == "heptabao.v1-3-pr40-overlay-manifest.v1"
          assert manifest["exact_base"] == {
              "branch": "codex/plan-v1.2.1-final-gap-closure-v1",
              "commit": "cedb6c95a5323f7004551087d75e2f57a1ec484a",
              "pull_request": 40,
              "tree": "e0032b54bad2048802cd61f6bbc7d6d1f9ce4003",
          }
          assert manifest["qualification"] is False
          assert manifest["compatibility_claim"] is False
          assert manifest["selected_candidates"] == []
          assert manifest["selection_effect"] == "NONE"
          assert manifest["authority_effect"] == "NONE"
          assert manifest["deletions"] == []
          assert len(manifest["entries"]) == 61
          expected = set()
          for entry in manifest["entries"]:
              relative = Path(entry["path"])
              assert not relative.is_absolute() and ".." not in relative.parts
              assert relative.as_posix() not in expected
              expected.add(relative.as_posix())
              source = overlay / relative
              data = source.read_bytes()
              assert len(data) == entry["bytes"]
              assert hashlib.sha256(data).hexdigest() == entry["sha256"]
              destination = Path.cwd() / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              temporary = destination.with_name(f".{destination.name}.v13.tmp")
              temporary.write_bytes(data)
              os.replace(temporary, destination)
              destination.chmod(0o755 if entry["executable"] else 0o644)
          actual = {
              path.relative_to(overlay).as_posix()
              for path in overlay.rglob("*")
              if path.is_file()
          }
          assert actual == expected
          PY
          rm -rf bootstrap/v1.3-overlay
          rm -f .github/workflows/materialize-v1.3-exact-overlay.yml
          rm -f .github/workflows/materialize-v1.3-macos.yml
          git add -A
          git diff --cached --check
          test -z "$(git ls-files 'bootstrap/v1.3-overlay/*')"
          test -z "$(git ls-files '.github/workflows/materialize-v1.3-*.yml')"

      - name: Validate exact materialized source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python3 scripts/validate_plan_v2.py
          python3 scripts/validate_plan_v2_extensions.py
          python3 scripts/validate_plan_v1_2.py
          python3 scripts/validate_plan_v1_2_1.py
          python3 scripts/validate_plan_v1_2_2.py
          python3 scripts/validate_plan_v1_3.py
          python3 scripts/validate_h01_h02_next_v1.py
          python3 scripts/validate_h02_candidate_adapters_v1.py
          python3 scripts/validate_h02_openraft_inmemory_cluster_v1.py
          python3 scripts/validate_h02_openraft_fault_lab_v1.py
          python3 scripts/validate_h02_blocker_closure_v1.py
          python3 scripts/validate_h02_exact_head_matrix_contract_v1.py
          python3 -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python3 -m unittest discover -s tests/platform -p 'test_*.py' -v
          python3 -m unittest discover -s tests/plan -p 'test_*.py' -v
          python3 scripts/validate_rust_source_surface_v1.py \
            crates/heptabao-authbus-contracts/src/lib.rs \
            crates/heptabao-p0-server/src/lib.rs \
            crates/heptabao-p0-server/src/main.rs \
            crates/heptabao-protocol/src/lib.rs
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          from jsonschema import Draft202012Validator

          for path in Path("schemas").glob("*.schema.json"):
              Draft202012Validator.check_schema(json.loads(path.read_text(encoding="utf-8")))
          blocker = json.loads(Path("schemas/heptabao_h02_blocker_closure_evidence_v1.schema.json").read_text())
          cluster = json.loads(Path("schemas/heptabao_h02_openraft_cluster_evidence_v1.schema.json").read_text())
          assert blocker["properties"]["execution"]["properties"]["toolchain"]["enum"] == ["1.88.0", "1.98.0"]
          assert cluster["properties"]["environment"]["properties"]["rust_toolchain"]["enum"] == ["1.88.0", "1.98.0"]
          patterns = [
              re.compile(r"(?mi)^\s*contents\s*:\s*write\s*$"),
              re.compile(r"(?mi)^\s*persist-credentials\s*:\s*true\s*$"),
              re.compile(r"(?mi)^\s*git\s+(?:commit|push|rebase|merge)\b"),
          ]
          findings = []
          for path in sorted(Path(".github/workflows").glob("*.y*ml")):
              text = path.read_text(encoding="utf-8")
              if any(pattern.search(text) for pattern in patterns):
                  findings.append(str(path))
          assert findings == [], findings
          PY
          git diff --cached --check
          git write-tree | tee "$RUNNER_TEMP/v13-macos/materialized-tree.txt"

      - name: Commit and exact-lease fast-forward PR branch
        shell: bash
        env:
          TARGET_BRANCH: codex/plan-v1.3-foundation-closure-v1
          EXPECTED_TARGET_HEAD: 42841e6e6d753b2031b74888992ec167e66aafd1
        run: |
          set -euo pipefail
          expected_tree="$(cat "$RUNNER_TEMP/v13-macos/materialized-tree.txt")"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$EXPECTED_TARGET_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(plan): materialize V1.3 protocol Authbus and P0 foundation"
          test "$(git rev-parse 'HEAD^{tree}')" = "$expected_tree"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
