name: v1.3.1-exact-slim-wrapper

on:
  push:
    branches:
      - "exec/v1-3-1-exact-slim-v1"

permissions:
  contents: read

concurrency:
  group: v1.3.1-exact-slim-wrapper
  cancel-in-progress: true

env:
  SOURCE_SHA: 124fbdc86fe8a883fe31acadfa88fe3acf7c1c56
  SOURCE_TREE: 462ca63b107eb0fbfbd8c7a04633be1c2116767f

jobs:
  exact-source-root-and-p0:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Checkout execution wrapper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind wrapper and detach exact PR source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$SOURCE_TREE"
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA" "$GITHUB_SHA")
          test "${#changed[@]}" = 1
          test "${changed[0]}" = ".github/workflows/v1.3.1-exact-slim-wrapper.yml"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/heptabao-v1.3.1-slim"
          printf 'repository=%s\nwrapper=%s\nsource_commit=%s\nsource_tree=%s\nrunner=%s\nos=%s\narch=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$SOURCE_SHA" "$SOURCE_TREE" \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" \
            | tee "$RUNNER_TEMP/heptabao-v1.3.1-slim/source-binding.txt"

      - name: Install exact Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error \
              https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
            sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Format test and lint complete root workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Execute P0 exact-source socket contract
        shell: bash
        env:
          HEPTABAO_P0_BIND: 127.0.0.1:0
          HEPTABAO_P0_DEV_TOKEN: v1-3-1-development-root-token-000001
          HEPTABAO_P0_DEV_UNSEAL_KEY: v1-3-1-development-unseal-key-00001
          HEPTABAO_P0_AUDIT_PATH: ${{ runner.temp }}/heptabao-v1.3.1-slim/p0-audit.log
        run: |
          set -euo pipefail
          stderr="$RUNNER_TEMP/heptabao-v1.3.1-slim/p0.stderr"
          cargo +1.98.0 run --quiet --locked -p heptabao-p0-server 2>"$stderr" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          python3 - "$stderr" "$HEPTABAO_P0_AUDIT_PATH" <<'PY'
          import re
          import socket
          import sys
          import time
          from pathlib import Path

          stderr_path = Path(sys.argv[1])
          audit_path = Path(sys.argv[2])
          address = None
          for _ in range(600):
              text = stderr_path.read_text(encoding="utf-8", errors="replace") if stderr_path.exists() else ""
              match = re.search(r"listening on (127\.0\.0\.1:\d+)", text)
              if match:
                  address = match.group(1)
                  break
              time.sleep(0.1)
          assert address is not None, stderr_path.read_text(encoding="utf-8", errors="replace")
          host, port_text = address.rsplit(":", 1)
          port = int(port_text)

          def exchange(raw: bytes, timeout: float = 10.0) -> bytes:
              with socket.create_connection((host, port), timeout=timeout) as stream:
                  stream.settimeout(timeout)
                  stream.sendall(raw)
                  chunks = []
                  while True:
                      block = stream.recv(8192)
                      if not block:
                          break
                      chunks.append(block)
                  return b"".join(chunks)

          def parse_response(raw: bytes):
              head, body = raw.split(b"\r\n\r\n", 1)
              lines = head.split(b"\r\n")
              status = int(lines[0].split(b" ", 2)[1])
              headers = {}
              for line in lines[1:]:
                  name, value = line.split(b":", 1)
                  headers[name.strip().lower()] = value.strip()
              assert int(headers[b"content-length"]) == len(body), raw
              return status, headers, body

          def request(method, target, body=b"", token=None, request_id=None):
              headers = [f"{method} {target} HTTP/1.1", f"Host: {address}"]
              if token is not None:
                  headers.append(f"X-Vault-Token: {token}")
              if request_id is not None:
                  headers.append(f"X-HeptaBao-Request-Id: {request_id}")
              if body:
                  headers.append(f"Content-Length: {len(body)}")
              return parse_response(exchange(("\r\n".join(headers) + "\r\n\r\n").encode() + body))

          assert request("GET", "/v1/sys/health")[0] == 501
          assert request("POST", "/v1/sys/init", b"{}")[0] == 200
          assert request(
              "POST",
              "/v1/sys/unseal",
              b'{"key":"v1-3-1-development-unseal-key-00001"}',
          )[0] == 200
          token = "v1-3-1-development-root-token-000001"
          status, headers, body = request(
              "POST",
              "/v1/secret/exact-head",
              b'{"value":"development-only"}',
              token=token,
          )
          assert status == 204 and headers[b"content-length"] == b"0" and body == b""
          status, _, body = request("GET", "/v1/secret/exact-head", token=token)
          assert status == 200 and b"development-only" in body
          assert parse_response(exchange(
              b"GET /v1/sys/health HTTP/1.1\r\nHost: attacker.invalid\r\n\r\n"
          ))[0] == 400
          request_id = "client-request-id-000000000001"
          assert request("GET", "/v1/sys/health", request_id=request_id)[0] == 200
          assert request("GET", "/v1/sys/health", request_id=request_id)[0] == 409

          started = time.monotonic()
          with socket.create_connection((host, port), timeout=3) as stream:
              stream.settimeout(8)
              stream.sendall(f"GET /v1/sys/health HTTP/1.1\r\nHost:".encode())
              chunks = []
              while True:
                  block = stream.recv(8192)
                  if not block:
                      break
                  chunks.append(block)
          assert parse_response(b"".join(chunks))[0] == 408
          assert time.monotonic() - started < 8
          for _ in range(100):
              if audit_path.exists() and audit_path.stat().st_size:
                  break
              time.sleep(0.05)
          audit = audit_path.read_text(encoding="utf-8")
          for marker in [
              "host-listener-mismatch",
              "client-request-id-replayed",
              "request-read-deadline-exceeded",
          ]:
              assert marker in audit, (marker, audit)
          print("P0 slim exact-source socket contract PASS")
          PY

      - name: Install Python validation dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Validate V1.3.1 and all Python suites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python3 scripts/validate_plan_v2.py
          python3 scripts/validate_plan_v2_extensions.py
          python3 scripts/validate_plan_v1_2.py
          python3 scripts/validate_plan_v1_2_1.py
          python3 scripts/validate_plan_v1_2_2.py
          python3 scripts/validate_plan_v1_3.py
          python3 scripts/validate_plan_v1_3_1.py
          python3 scripts/validate_h01_h02_next_v1.py
          python3 scripts/validate_h02_candidate_adapters_v1.py
          python3 scripts/validate_h02_openraft_inmemory_cluster_v1.py
          python3 scripts/validate_h02_openraft_fault_lab_v1.py
          python3 scripts/validate_h02_blocker_closure_v1.py
          python3 scripts/validate_h02_exact_head_matrix_contract_v1.py
          python3 -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python3 -m unittest discover -s tests/platform -p 'test_*.py' -v
          python3 -m unittest discover -s tests/plan -p 'test_*.py' -v

      - name: Upload exact-source evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1.3.1-exact-source-slim-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/heptabao-v1.3.1-slim/
          if-no-files-found: error
          retention-days: 30

      - name: Retain non-authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_plan_v1_3_1.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "V1.3.1 exact source root/P0/Python PASS; H02 and independent/external closure remain separate; qualification=false authority=NONE"
