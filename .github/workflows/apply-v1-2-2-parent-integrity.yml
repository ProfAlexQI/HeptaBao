name: apply-v1-2-2-parent-integrity

on:
  push:
    branches: ["codex/tmp-v1.2.2-parent-integrity-v1"]
    paths:
      - ".github/workflows/apply-v1-2-2-parent-integrity.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v1-2-2-parent-integrity
  cancel-in-progress: true

jobs:
  materialize-format-and-remove-transition:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind source and apply deterministic closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 668cfa2f6d6cee8d3cde239ca02890973374809a HEAD
          test "$(git hash-object probes/h02/openraft-tokio/src/bin/durable_store_lab/store.rs)" = a4f90d29f981175637668f7fd44e758d6aa9c63c
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -m py_compile scripts/apply_v1_2_2_parent_integrity.py
          python3 scripts/apply_v1_2_2_parent_integrity.py
          rm -f scripts/apply_v1_2_2_parent_integrity.py
          rm -f .github/workflows/apply-v1-2-2-parent-integrity.yml
          git diff --check

      - name: Format exact OpenRaft source
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --manifest-path probes/h02/openraft-tokio/Cargo.toml --all
          cargo +1.98.0 fmt --manifest-path probes/h02/openraft-tokio/Cargo.toml --all -- --check
          git diff --check

      - name: Run dependency-free closure checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/validate_h02_blocker_closure_v1.py \
            scripts/validate_plan_v1_2_2.py
          python3 - <<'PY'
          from pathlib import Path
          files = {
              "store": Path("probes/h02/openraft-tokio/src/bin/durable_store_lab/store.rs"),
              "plan": Path("planning/HEPTABAO_H02_OS_DURABLE_CLOCK_BLOCKER_CLOSURE_V1.yaml"),
              "register": Path("planning/HEPTABAO_BLOCKER_REGISTER_V1.yaml"),
              "validator": Path("scripts/validate_h02_blocker_closure_v1.py"),
              "durability": Path("docs/storage/HEPTABAO_DURABILITY_AND_CRASH_CONSISTENCY_CONTRACT_V1.md"),
          }
          tokens = {
              "store": [
                  "durable write parent directory",
                  "durable replacement parent directory",
                  "durable current generation",
                  "active_log_persist_does_not_recreate_deleted_store_root",
                  "active_state_persist_does_not_recreate_deleted_store_root",
                  "legacy_log_adoption_rejects_unresolved_data_temporary_file",
                  "legacy_state_adoption_rejects_unresolved_data_temporary_file",
              ],
              "plan": [
                  "active_persistence_requires_existing_real_parent: true",
                  "legacy_data_temporary_artifacts_rejected: true",
              ],
              "register": [
                  "active persistence refuses missing, symlinked or non-directory parent paths",
                  "legacy adoption rejects unresolved marker, raft-log and state-bundle temporary artifacts",
              ],
              "validator": [
                  "active_log_persist_does_not_recreate_deleted_store_root",
                  "legacy_state_adoption_rejects_unresolved_data_temporary_file",
              ],
              "durability": [
                  "Active-parent integrity and legacy temporary-state rejection",
              ],
          }
          for key, path in files.items():
              text = path.read_text(encoding="utf-8")
              for token in tokens[key]:
                  assert token in text, (path, token)
          authority = Path("planning/AUTHORITY_FLAGS_V2.yaml").read_text(encoding="utf-8")
          assert "production_authority: false" in authority
          assert "migration_authority: false" in authority
          assert "release_authority: false" in authority
          PY

      - name: Commit materialized source without transition files
        shell: bash
        run: |
          set -euo pipefail
          test ! -e scripts/apply_v1_2_2_parent_integrity.py
          test ! -e .github/workflows/apply-v1-2-2-parent-integrity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(h02): fail closed on durable parent loss and legacy temp state"
          git push origin HEAD:codex/tmp-v1.2.2-parent-integrity-v1
