name: h02-durable-store-macos-v2

on:
  push:
    branches: ["codex/h02-durable-multiprocess-closure-v2"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h02-durable-store-macos-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  VALIDIT_REV: "7016fa5e072a86092928144b3a3040381e6964e9"

jobs:
  macos-arm64-smoke:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/results"
          printf 'repository=%s\nref=%s\ngithub_sha=%s\nsource_commit=%s\nsource_tree=%s\nrunner_name=%s\nos=%s\narch=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_SHA" "$(git rev-parse HEAD)" \
            "$(git rev-parse 'HEAD^{tree}')" "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" \
            | tee "$RUNNER_TEMP/results/source-binding.txt"
          uname -a | tee "$RUNNER_TEMP/results/uname.txt"
      - name: Install Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup run 1.98.0 rustc --version --verbose | tee "$RUNNER_TEMP/results/rustc-1.98.0.txt"
          rustup run 1.98.0 cargo --version --verbose | tee "$RUNNER_TEMP/results/cargo-1.98.0.txt"
      - name: Compile and execute one durable seed
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/openraft-durable"
          cp -a probes/h02/openraft-tokio "$probe"
          manifest="$probe/Cargo.toml"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/target"
          shasum -a 256 "$manifest" | tee "$RUNNER_TEMP/results/manifest.sha256"
          rm -f "$probe/Cargo.lock"
          rustup run 1.98.0 cargo generate-lockfile --manifest-path "$manifest" \
            2>&1 | tee "$RUNNER_TEMP/results/generate-lock.log"
          shasum -a 256 "$probe/Cargo.lock" | tee "$RUNNER_TEMP/results/Cargo.lock.sha256"
          rustup run 1.98.0 cargo metadata --locked --format-version 1 \
            --manifest-path "$manifest" >"$RUNNER_TEMP/results/metadata.json"
          python3 - "$RUNNER_TEMP/results/metadata.json" "$VALIDIT_REV" <<'PY'
          import json
          import sys

          metadata = json.load(open(sys.argv[1], encoding="utf-8"))
          revision = sys.argv[2]
          packages = [package for package in metadata["packages"] if package["name"] == "validit"]
          assert len(packages) == 1, packages
          source = packages[0].get("source") or ""
          assert source.startswith("git+https://github.com/drmingdrmer/validit.git?"), source
          assert f"rev={revision}" in source, source
          assert source.endswith(f"#{revision}"), source
          PY
          rustup run 1.98.0 cargo fmt --manifest-path "$manifest" --all --check \
            2>&1 | tee "$RUNNER_TEMP/results/fmt.log"
          rustup run 1.98.0 cargo test --locked --all-targets --manifest-path "$manifest" \
            2>&1 | tee "$RUNNER_TEMP/results/test.log"
          rustup run 1.98.0 cargo clippy --locked --all-targets --manifest-path "$manifest" -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/results/clippy.log"
          output="$RUNNER_TEMP/results/durable.json"
          rustup run 1.98.0 cargo run --quiet --locked --manifest-path "$manifest" \
            --bin heptabao-h02-openraft-durable-store-lab -- --seed 0x5eed20260828cafe >"$output"
          python3 - "$output" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          value = json.load(open(sys.argv[1], encoding="utf-8"))
          assert value["status"] == "EXECUTED_PASS", value
          assert len(value["cases"]) == 7, value
          assert all(case["status"] == "PASS" for case in value["cases"]), value
          assert value["scope"]["raft_log_storage_implemented"] is True
          assert value["scope"]["raft_state_machine_implemented"] is True
          assert value["scope"]["full_cluster_disk_restart"] is True
          assert value["qualification"] is False
          assert value["selection_effect"] == "NONE"
          assert value["authority_effect"] == "NONE"
          print(json.dumps({"head_sha": sys.argv[2], "status": value["status"]}, sort_keys=True))
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Upload complete diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h02-durable-store-macos-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: warn
          retention-days: 30
