name: v1.4.1-finalize-source

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - codex/v1.4-durable-single-node-foundation-v1
    paths:
      - .github/workflows/v1.4.1-finalize-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact source and branch
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "${{ github.event.pull_request.head.ref }}" = "codex/plan-v1.4-full-gap-closure-v1"

      - name: Idempotently apply the bounded journal repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          journal = Path('crates/heptabao-single-node-journal/src/lib.rs')
          source = journal.read_text(encoding='utf-8')
          followed = '            let metadata = entry.metadata().map_err(FileJournalError::Io)?;'
          no_follow = (
              '            let metadata = fs::symlink_metadata(entry.path())\n'
              '                .map_err(FileJournalError::Io)?;'
          )
          if followed in source:
              source = source.replace(followed, no_follow, 1)
          if no_follow not in source:
              raise SystemExit('no-follow directory metadata contract is absent')
          symlink_call = 'fs::symlink_metadata(entry.path())?.file_type().is_symlink()'
          source = source.replace(symlink_call, 'metadata.file_type().is_symlink()')

          old_call = (
              '            let sequence = parse_entry_file_name(name)?\n'
              '                .ok_or(FileJournalError::UnexpectedEntry)?;'
          )
          new_call = (
              '            let sequence = parse_entry_file_name(name)\n'
              '                .map_err(|_| FileJournalError::CorruptJournal)?\n'
              '                .ok_or(FileJournalError::UnexpectedEntry)?;'
          )
          if old_call in source:
              source = source.replace(old_call, new_call, 1)
          if new_call not in source:
              raise SystemExit('provider-neutral entry-name call is absent')

          old_signature = (
              'fn parse_entry_file_name(name: &str) -> '
              'Result<Option<JournalSequence>, FileJournalError<io::Error>> {'
          )
          new_signature = (
              'fn parse_entry_file_name(name: &str) -> '
              'Result<Option<JournalSequence>, DecodeError> {'
          )
          if old_signature in source:
              pattern = re.compile(
                  r'fn parse_entry_file_name\(name: &str\).*?\n}\n\nfn encode_marker',
                  re.DOTALL,
              )
              replacement = '''fn parse_entry_file_name(name: &str) -> Result<Option<JournalSequence>, DecodeError> {
                  let Some(digits) = name
                      .strip_prefix("entry-")
                      .and_then(|value| value.strip_suffix(".hbj"))
                  else {
                      return Ok(None);
                  };
                  if digits.len() != 20 || !digits.bytes().all(|byte| byte.is_ascii_digit()) {
                      return Err(DecodeError::InvalidLength);
                  }
                  let value = digits
                      .parse::<u64>()
                      .map_err(|_| DecodeError::InvalidSequence)?;
                  let sequence =
                      JournalSequence::new(value).map_err(|_| DecodeError::InvalidSequence)?;
                  if entry_file_name(sequence) != name {
                      return Err(DecodeError::InvalidSequence);
                  }
                  Ok(Some(sequence))
              }

              fn encode_marker'''
              source, count = pattern.subn(replacement, source, count=1)
              if count != 1:
                  raise SystemExit('entry-name helper transformation failed')
          if new_signature not in source:
              raise SystemExit('provider-neutral entry-name helper is absent')
          if 'entry.metadata()' in source:
              raise SystemExit('directory enumeration still follows symlinks')
          journal.write_text(source, encoding='utf-8')

          core = Path('crates/heptabao-journaled-core/src/lib.rs')
          source = core.read_text(encoding='utf-8')
          generic_marker = 'fn detail_code<S, B, J>('
          if generic_marker in source:
              source, call_count = re.subn(
                  r'detail_code\(([^)\n]+)\)\?',
                  r'detail_code(\1).map_err(JournaledCoreError::OperationContract)?',
                  source,
              )
              if call_count < 4:
                  raise SystemExit(f'detail-code call count drifted: {call_count}')
              pattern = re.compile(
                  r'fn detail_code<S, B, J>\(.*?\n}\n\n#\[derive\(Clone, Debug, Eq, PartialEq\)\]',
                  re.DOTALL,
              )
              replacement = '''fn detail_code(value: &str) -> Result<StableDetailCode, OperationContractError> {
                  StableDetailCode::new(value.to_owned())
              }

              #[derive(Clone, Debug, Eq, PartialEq)]'''
              source, count = pattern.subn(replacement, source, count=1)
              if count != 1:
                  raise SystemExit('generic detail-code helper transformation failed')
          required = 'fn detail_code(value: &str) -> Result<StableDetailCode, OperationContractError>'
          if required not in source or generic_marker in source:
              raise SystemExit('narrow detail-code helper is absent')
          core.write_text(source, encoding='utf-8')
          PY

      - name: Install exact Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Format test and strictly lint exact source
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Remove every temporary export and materializer workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/v1.4.1-source-export.yml \
            .github/workflows/v1.4.1-rust-materializer.yml \
            .github/workflows/v1.4.1-rust-materializer-v2.yml \
            .github/workflows/v1.4.1-final-source-materializer.yml \
            .github/workflows/v1.4.1-finalize-source.yml

      - name: Publish verified development source and cleanup
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test -n "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(.github/workflows/v1\.4\.1-(source-export|rust-materializer|rust-materializer-v2|final-source-materializer|finalize-source)\.yml|crates/heptabao-(journal-api|single-node-journal|operation-ledger|journaled-core)/src/lib\.rs)$' || true)"
          test -z "$unexpected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(v1.4.1): finalize Rust 1.98-verified journal ledger source"
          git push origin HEAD:codex/plan-v1.4-full-gap-closure-v1
