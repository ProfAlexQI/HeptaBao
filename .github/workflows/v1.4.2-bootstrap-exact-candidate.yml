name: v1.4.2-bootstrap-exact-candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - codex/plan-v1.4-full-gap-closure-v1
    paths:
      - .bootstrap/v1.4.2/**
      - .github/workflows/v1.4.2-bootstrap-exact-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v1.4.2-bootstrap-exact-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  construct-verify-publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact staged head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact source branch
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "${{ github.event.pull_request.head.ref }}" = "codex/plan-v1.4.2-recovery-foundation-v1"
          printf '%s\n' "$expected" >"$RUNNER_TEMP/source-head.txt"

      - name: Verify and materialize exact 18-path candidate
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/heptabao-v1.4.2-candidate.tar.gz"
          cat \
            .bootstrap/v1.4.2/part-00.b64 \
            .bootstrap/v1.4.2/part-01.b64 \
            .bootstrap/v1.4.2/part-02.b64 \
            .bootstrap/v1.4.2/part-03.b64 \
            .bootstrap/v1.4.2/part-04.b64 \
            .bootstrap/v1.4.2/part-05.b64 \
            .bootstrap/v1.4.2/part-06.b64 \
            .bootstrap/v1.4.2/part-07.b64 \
            | tr -d '\r\n' \
            | base64 --decode >"$archive"
          echo "04f68f0b9d72f7aa790aa056060bd500e5e3727ed0186cfe0a8918134a0cb2e1  $archive" \
            | sha256sum --check --strict
          python - "$archive" <<'PY'
          import os
          import stat
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          expected = {
              'Cargo.toml',
              'Cargo.lock',
              'crates/heptabao-key-lifecycle/Cargo.toml',
              'crates/heptabao-key-lifecycle/src/lib.rs',
              'crates/heptabao-rollback-anchor/Cargo.toml',
              'crates/heptabao-rollback-anchor/src/lib.rs',
              'crates/heptabao-recovery-core/Cargo.toml',
              'crates/heptabao-recovery-core/src/lib.rs',
              'docs/plan/HEPTABAO_PLAN_V1_4_2_KEY_LIFECYCLE_ROLLBACK_AND_RECOVERY.md',
              'docs/recovery/HEPTABAO_ANCHORED_RECOVERY_CONTRACT_V1.md',
              'planning/HEPTABAO_BLOCKER_REGISTER_V1_4_2.yaml',
              'planning/HEPTABAO_NORMATIVE_DOCUMENT_MANIFEST_V1_4_2.yaml',
              'planning/HEPTABAO_V1_4_2_ANCHORED_RECOVERY_STATUS.yaml',
              'schemas/heptabao_normative_document_manifest_v1_4_2.schema.json',
              'scripts/validate_plan_v1_4_2.py',
              'scripts/validate_v1_4_2_inherited_surface.py',
              'tests/plan/test_plan_v1_4_2.py',
              '.github/workflows/plan-v1.4.2-anchored-recovery.yml',
          }
          root = Path.cwd().resolve()
          archive = Path(sys.argv[1])
          with tarfile.open(archive, 'r:gz') as handle:
              members = handle.getmembers()
              names = [member.name for member in members]
              if len(names) != len(expected) or set(names) != expected:
                  raise SystemExit(f'archive member set drifted: {names!r}')
              if len(names) != len(set(names)):
                  raise SystemExit('archive contains duplicate paths')
              total = 0
              for member in members:
                  pure = PurePosixPath(member.name)
                  if pure.is_absolute() or '..' in pure.parts or '.' in pure.parts:
                      raise SystemExit(f'unsafe archive path: {member.name!r}')
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f'archive member is not a regular file: {member.name!r}')
                  if member.size < 0 or member.size > 64 * 1024 * 1024:
                      raise SystemExit(f'archive member size is invalid: {member.name!r}')
                  total += member.size
              if total > 128 * 1024 * 1024:
                  raise SystemExit('archive expands beyond the bounded candidate budget')
              by_name = {member.name: member for member in members}
              for name in sorted(expected):
                  target = root.joinpath(*PurePosixPath(name).parts)
                  resolved_parent = target.parent.resolve()
                  if root != resolved_parent and root not in resolved_parent.parents:
                      raise SystemExit(f'candidate target escapes repository: {name!r}')
                  current = root
                  for part in PurePosixPath(name).parts[:-1]:
                      current = current / part
                      if current.exists():
                          mode = os.lstat(current).st_mode
                          if stat.S_ISLNK(mode) or not stat.S_ISDIR(mode):
                              raise SystemExit(f'unsafe candidate parent: {current}')
                      else:
                          current.mkdir()
                  stream = handle.extractfile(by_name[name])
                  if stream is None:
                      raise SystemExit(f'cannot read archive member: {name!r}')
                  data = stream.read()
                  if len(data) != by_name[name].size:
                      raise SystemExit(f'truncated archive member: {name!r}')
                  target.write_bytes(data)
          PY
          python - <<'PY_REPAIR'
          from pathlib import Path

          validator = Path('scripts/validate_plan_v1_4_2.py')
          source = validator.read_text(encoding='utf-8')
          before = '            "candidate.apply(&event)",'
          after = '            ".apply(&event)",'
          if source.count(before) != 1:
              raise SystemExit('key lifecycle validator anchor drifted')
          validator.write_text(source.replace(before, after, 1), encoding='utf-8')
          PY_REPAIR
          rm -rf .bootstrap/v1.4.2
          rm -f .github/workflows/v1.4.2-bootstrap-exact-candidate.yml
          test ! -e .bootstrap/v1.4.2
          test ! -e .github/workflows/v1.4.2-bootstrap-exact-candidate.yml

      - name: Install exact Python dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install exact Rust 1.98 toolchain and freeze candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo +1.98.0 fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(v1.4.2): add anchored recovery and key lifecycle foundation"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Verify exact final Git delta
        shell: bash
        run: |
          set -euo pipefail
          baseline="6b2c11d46c65603f1a1e8ded742335990b61a79b"
          git diff --name-status --no-renames "$baseline" HEAD >"$RUNNER_TEMP/v1.4.2-delta.tsv"
          python - "$RUNNER_TEMP/v1.4.2-delta.tsv" <<'PY'
          import sys
          from pathlib import Path

          expected = {
              'Cargo.toml': 'M',
              'Cargo.lock': 'M',
              'crates/heptabao-key-lifecycle/Cargo.toml': 'A',
              'crates/heptabao-key-lifecycle/src/lib.rs': 'A',
              'crates/heptabao-rollback-anchor/Cargo.toml': 'A',
              'crates/heptabao-rollback-anchor/src/lib.rs': 'A',
              'crates/heptabao-recovery-core/Cargo.toml': 'A',
              'crates/heptabao-recovery-core/src/lib.rs': 'A',
              'docs/plan/HEPTABAO_PLAN_V1_4_2_KEY_LIFECYCLE_ROLLBACK_AND_RECOVERY.md': 'A',
              'docs/recovery/HEPTABAO_ANCHORED_RECOVERY_CONTRACT_V1.md': 'A',
              'planning/HEPTABAO_BLOCKER_REGISTER_V1_4_2.yaml': 'A',
              'planning/HEPTABAO_NORMATIVE_DOCUMENT_MANIFEST_V1_4_2.yaml': 'A',
              'planning/HEPTABAO_V1_4_2_ANCHORED_RECOVERY_STATUS.yaml': 'A',
              'schemas/heptabao_normative_document_manifest_v1_4_2.schema.json': 'A',
              'scripts/validate_plan_v1_4_2.py': 'A',
              'scripts/validate_v1_4_2_inherited_surface.py': 'A',
              'tests/plan/test_plan_v1_4_2.py': 'A',
              '.github/workflows/plan-v1.4.2-anchored-recovery.yml': 'A',
          }
          actual = {}
          for line in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              status, path = line.split('\t', 1)
              if path in actual:
                  raise SystemExit(f'duplicate Git delta path: {path}')
              actual[path] = status
          if actual != expected:
              raise SystemExit(f'V1.4.2 final Git delta drifted: {actual!r}')
          PY

      - name: Validate current exact V1.4.2 candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_plan_v1_4_2.py
          python scripts/validate_v1_4_2_inherited_surface.py
          python -m unittest discover -s tests/plan -p 'test_plan_v1_4_2.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v

      - name: Replay frozen V1.4.1 Python and Rust gates
        shell: bash
        run: |
          set -euo pipefail
          baseline="6b2c11d46c65603f1a1e8ded742335990b61a79b"
          historical_root="$RUNNER_TEMP/v1.4.1-baseline"
          cleanup() {
            git worktree remove --force "$historical_root" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "$historical_root" "$baseline"
          (
            cd "$historical_root"
            python scripts/validate_plan_v1_4_1.py
            python scripts/validate_v1_4_1_inherited_surface.py
            python -m unittest discover -s tests/plan -p 'test_plan_v1_4_1.py' -v
            python -m unittest discover -s tests/platform -p 'test_*.py' -v
            python -m unittest discover -s tests/oracle -p 'test_*.py' -v
            cargo +1.98.0 fmt --all -- --check
            cargo +1.98.0 test --locked --workspace --all-targets
            cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          )
          cleanup
          trap - EXIT

      - name: Test and strictly lint current V1.4.2 workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 metadata --locked --no-deps --format-version 1 \
            >"$RUNNER_TEMP/v1.4.2-cargo-metadata.json"
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Confirm non-authority and fast-forward publish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          status = yaml.safe_load(
              Path('planning/HEPTABAO_V1_4_2_ANCHORED_RECOVERY_STATUS.yaml')
              .read_text(encoding='utf-8')
          )
          expected = {
              'qualification': False,
              'compatibility_claim': False,
              'selected_candidates': [],
              'selection_effect': 'NONE',
              'production_authority': False,
              'migration_authority': False,
              'release_authority': False,
              'authority_effect': 'NONE',
          }
          if status.get('claims') != expected:
              raise SystemExit('V1.4.2 authority boundary drifted')
          PY
          source_head="$(cat "$RUNNER_TEMP/source-head.txt")"
          remote_head="$(git ls-remote origin refs/heads/codex/plan-v1.4.2-recovery-foundation-v1 | cut -f1)"
          test "$remote_head" = "$source_head"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin HEAD:codex/plan-v1.4.2-recovery-foundation-v1

      - name: Emit exact bootstrap result
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## V1.4.2 exact candidate published'
            echo
            echo "- commit: `$(git rev-parse HEAD)`"
            echo "- tree: `$(git rev-parse HEAD^{tree})`"
            echo '- exact additive paths: 18'
            echo '- current and frozen Python regressions: PASS'
            echo '- current and frozen Rust 1.98 gates: PASS'
            echo '- bootstrap files and write workflow: absent'
            echo '- authority effect: NONE'
          } >>"$GITHUB_STEP_SUMMARY"
