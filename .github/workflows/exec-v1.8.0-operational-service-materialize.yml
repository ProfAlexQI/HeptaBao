name: exec V1.8.0 operational service materializer

on:
  push:
    branches: [exec/v1.8.0-operational-service-materializer-v1]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: exec-v1.8.0-operational-service-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout execution controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Freeze generator and admit exact merged V1.7.0 predecessor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREDECESSOR_PR: "66"
          EXPECTED_PREDECESSOR_BRANCH: codex/plan-v1.7.0-service-ha-plugin-compatibility-v1
          INTEGRATION_BRANCH: integration/v1.4.4-technical-candidate
        run: |
          set -euo pipefail
          cp .exec/materialize_v1_8_0.py "$RUNNER_TEMP/materialize_v1_8_0.py"
          cp .exec/patch_v1_8_0.py "$RUNNER_TEMP/patch_v1_8_0.py"
          python "$RUNNER_TEMP/patch_v1_8_0.py" "$RUNNER_TEMP/materialize_v1_8_0.py"
          python -m py_compile "$RUNNER_TEMP/materialize_v1_8_0.py"

          pr_json="$RUNNER_TEMP/predecessor-pr.json"
          reviews_json="$RUNNER_TEMP/predecessor-reviews.json"
          runs_json="$RUNNER_TEMP/predecessor-runs.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PREDECESSOR_PR" > "$pr_json"
          test "$(jq -r .state "$pr_json")" = closed
          test "$(jq -r .merged "$pr_json")" = true
          test "$(jq -r .base.ref "$pr_json")" = "$INTEGRATION_BRANCH"
          test "$(jq -r .head.ref "$pr_json")" = "$EXPECTED_PREDECESSOR_BRANCH"
          reviewed_head="$(jq -r .head.sha "$pr_json")"
          merge_sha="$(jq -r .merge_commit_sha "$pr_json")"
          base_sha="$(jq -r .base.sha "$pr_json")"
          test "$reviewed_head" != null
          test "$merge_sha" != null
          test "$base_sha" != null

          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PREDECESSOR_PR/reviews?per_page=100" > "$reviews_json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$reviewed_head&per_page=100" > "$runs_json"
          HEAD_SHA="$reviewed_head" REVIEWS_JSON="$reviews_json" RUNS_JSON="$runs_json" python3 - <<'PY'
          import json, os
          from pathlib import Path

          required_reviewers = {'ProfHepta', 'Tomasrgbsf'}
          required_runs = {
              'HeptaBao V1.7.0 service HA plugin compatibility',
              'HeptaBao V1.6.0 runtime recovery operations',
              'HeptaBao V1.5.0 control-plane vertical slice',
              'HeptaBao V1.4.7 post-merge truth and external admission',
              'HeptaBao V1.4.6 authoritative recovery closure',
              'plan-v1.4.5-security-invariant-closure',
              'plan-v1.4.4-module-documentation',
          }
          head = os.environ['HEAD_SHA']
          reviews = json.loads(Path(os.environ['REVIEWS_JSON']).read_text(encoding='utf-8'))
          latest_reviews = {}
          for review in sorted(reviews, key=lambda item: item.get('submitted_at') or ''):
              login = (review.get('user') or {}).get('login')
              if login:
                  latest_reviews[login] = review
          waiting = []
          for login in sorted(required_reviewers):
              review = latest_reviews.get(login)
              if not review or review.get('state') != 'APPROVED' or review.get('commit_id') != head:
                  waiting.append(login)
          if waiting:
              raise SystemExit('predecessor lacks exact-head approvals: ' + ', '.join(waiting))
          blocking = sorted(login for login, review in latest_reviews.items() if review.get('commit_id') == head and review.get('state') == 'CHANGES_REQUESTED')
          if blocking:
              raise SystemExit('predecessor has current-head change requests: ' + ', '.join(blocking))

          runs = json.loads(Path(os.environ['RUNS_JSON']).read_text(encoding='utf-8'))['workflow_runs']
          latest_runs = {}
          for run in sorted(runs, key=lambda item: item['id']):
              latest_runs[run['name']] = run
          missing = required_runs - set(latest_runs)
          if missing:
              raise SystemExit('predecessor lacks workflow families: ' + ', '.join(sorted(missing)))
          bad = []
          for name in sorted(required_runs):
              run = latest_runs[name]
              if run.get('head_sha') != head or run.get('status') != 'completed' or run.get('conclusion') != 'success':
                  bad.append(f"{name}:{run.get('head_sha')}:{run.get('status')}:{run.get('conclusion')}")
          if bad:
              raise SystemExit('predecessor workflow admission failed: ' + '; '.join(bad))
          print('predecessor exact-head reviews and workflow families: PASS')
          PY

          git fetch --no-tags origin "refs/heads/$INTEGRATION_BRANCH:refs/remotes/origin/$INTEGRATION_BRANCH"
          integration_sha="$(git rev-parse "refs/remotes/origin/$INTEGRATION_BRANCH")"
          test "$integration_sha" = "$merge_sha"
          git fetch --no-tags origin "$reviewed_head" "$merge_sha" "$base_sha"
          read -r observed_merge parent_one parent_two extra <<<"$(git rev-list --parents -n 1 "$merge_sha")"
          test "$observed_merge" = "$merge_sha"
          test "$parent_one" = "$base_sha"
          test "$parent_two" = "$reviewed_head"
          test -z "${extra:-}"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$merge_sha" --jq .commit.verification.verified)" = true

          git switch --detach "$merge_sha"
          git switch -C codex/plan-v1.8.0-operational-service-v1
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'predecessor_pr=%s\nreviewed_head=%s\nmerge_commit=%s\nmerge_tree=%s\n' "$PREDECESSOR_PR" "$reviewed_head" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"

      - name: Install exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Materialize source and documentation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python "$RUNNER_TEMP/materialize_v1_8_0.py" .
          python scripts/render_module_source_truth_v1_8_0.py --check
          git diff --check

      - name: Validate all current and inherited Python contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_plan_v1_8_0.py
          python scripts/validate_plan_v1_7_0.py
          python scripts/validate_plan_v1_6_0.py
          python scripts/validate_plan_v1_5_0.py
          python scripts/validate_plan_v1_4_7.py
          python scripts/validate_plan_v1_4_6.py
          python scripts/validate_plan_v1_4_5.py
          python scripts/validate_module_documentation_v1_4_4.py
          python -m unittest discover -s tests/plan -p 'test_*.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python -m compileall -q scripts tests
          python scripts/build_release_bundle_v1_8.py --output "$RUNNER_TEMP/release-one.tar.gz"
          python scripts/build_release_bundle_v1_8.py --output "$RUNNER_TEMP/release-two.tar.gz"
          cmp "$RUNNER_TEMP/release-one.tar.gz" "$RUNNER_TEMP/release-two.tar.gz"

      - name: Install exact Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustc +1.98.0 --version --verbose
          cargo +1.98.0 --version --verbose

      - name: Validate locked 42-crate workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Export validated candidate workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v1.8.0-candidate-workflow-${{ github.run_id }}
          path: .github/workflows/plan-v1.8.0-operational-service.yml
          if-no-files-found: error
          retention-days: 7

      - name: Publish clean candidate by fast-forward only
        shell: bash
        env:
          CANDIDATE_BRANCH: codex/plan-v1.8.0-operational-service-v1
        run: |
          set -euo pipefail
          test ! -e .exec
          test ! -e .github/workflows/exec-v1.8.0-operational-service-materialize.yml
          candidate_workflow=.github/workflows/plan-v1.8.0-operational-service.yml
          test -f "$candidate_workflow"
          workflow_digest="$(sha256sum "$candidate_workflow" | awk '{print $1}')"
          git config user.name "HeptaBao execution controller"
          git config user.email "heptabao-exec@users.noreply.github.com"
          git add --all
          git reset -- "$candidate_workflow"
          rm "$candidate_workflow"
          git commit -m "feat(v1.8.0): add operational service vertical slice"
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          remote_head="$(git ls-remote --heads origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')"
          test -n "$remote_head"
          git merge-base --is-ancestor "$remote_head" "$candidate_sha"
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          {
            echo '## V1.8.0 clean candidate published'
            echo
            echo "- prior reserved ref: \`$remote_head\`"
            echo "- commit: \`$candidate_sha\`"
            echo "- tree: \`$candidate_tree\`"
            echo "- validated candidate workflow SHA-256: \`$workflow_digest\`"
            echo '- workspace crates: 42'
            echo '- inherited Python, deterministic bundle and Rust 1.98 gates: PASS'
            echo '- workflow artifact exported for separate contents-API admission'
            echo '- authority effect: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
