name: exec-v1-2-2-cf429-exact-macos

on:
  push:
    branches: ["exec/v1-2-2-cf429-exact-macos-v1"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exec-v1-2-2-cf429-exact-macos-v1
  cancel-in-progress: false

env:
  TARGET_SHA: "cf429f9e03581aea4b290d8bba9cb2854308d017"
  TARGET_TREE: "cd417687c1349b09caf0c2704cb5ebcdbcb44588"
  TOOLCHAINS: "1.88.0 1.98.0"
  SEEDS: "0x5eed20260828cafe 0x8badf00d12345678 0xd15ea5e5cafef00d"

jobs:
  exact-target-macos:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout exact immutable target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/results"
          printf 'repository=%s\nworkflow_sha=%s\ntarget_sha=%s\ntarget_tree=%s\nrunner=%s\nos=%s\narch=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$TARGET_SHA" "$TARGET_TREE" \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" \
            | tee "$RUNNER_TEMP/results/source-binding.txt"

      - name: Install Python dependencies and validate contracts
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Run current semantic and regression gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python3 scripts/validate_plan_v1_2.py
          python3 scripts/validate_plan_v1_2_1.py
          python3 scripts/validate_h02_exact_head_matrix_contract_v1.py
          python3 scripts/validate_h02_openraft_inmemory_cluster_v1.py
          python3 scripts/validate_h02_openraft_fault_lab_v1.py
          python3 scripts/validate_h02_blocker_closure_v1.py
          python3 scripts/validate_h02_pr40_reconciliation_v1.py
          python3 scripts/validate_plan_v1_2_2.py
          python3 -m unittest discover -s tests/platform -p 'test_*.py' -v
          python3 -m unittest discover -s tests/plan -p 'test_*.py' -v

      - name: Install exact Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          for toolchain in $TOOLCHAINS; do
            rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
            rustup run "$toolchain" rustc --version --verbose \
              | tee "$RUNNER_TEMP/results/rustc-$toolchain.txt"
            rustup run "$toolchain" cargo --version --verbose \
              | tee "$RUNNER_TEMP/results/cargo-$toolchain.txt"
          done

      - name: Format, test and lint exact graphs
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets \
            2>&1 | tee "$RUNNER_TEMP/results/root-test.log"
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings \
            2>&1 | tee "$RUNNER_TEMP/results/root-clippy.log"

          manifest=probes/h02/openraft-tokio/Cargo.toml
          cargo +1.98.0 fmt --manifest-path "$manifest" --all -- --check
          shasum -a 256 "$manifest" probes/h02/openraft-tokio/Cargo.lock \
            | tee "$RUNNER_TEMP/results/openraft-source-digests.txt"
          cargo +1.88.0 metadata --locked --format-version 1 --manifest-path "$manifest" \
            > "$RUNNER_TEMP/results/openraft-metadata.json"
          for toolchain in $TOOLCHAINS; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/openraft-compile-$toolchain"
            cargo +"$toolchain" test --locked --all-targets --manifest-path "$manifest" \
              2>&1 | tee "$RUNNER_TEMP/results/openraft-test-$toolchain.log"
            cargo +"$toolchain" clippy --locked --all-targets --manifest-path "$manifest" -- -D warnings \
              2>&1 | tee "$RUNNER_TEMP/results/openraft-clippy-$toolchain.log"
          done

      - name: Execute cross-platform candidate cases
        shell: bash
        run: |
          set -euo pipefail
          manifest=probes/h02/openraft-tokio/Cargo.toml
          for toolchain in $TOOLCHAINS; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/openraft-runtime-$toolchain"
            for seed in $SEEDS; do
              suffix="${toolchain}-${seed#0x}"
              cargo +"$toolchain" run --quiet --locked --manifest-path "$manifest" \
                --bin heptabao-h02-openraft-inmemory-cluster -- --seed "$seed" \
                > "$RUNNER_TEMP/results/inmemory-$suffix.json"
              cargo +"$toolchain" run --quiet --locked --manifest-path "$manifest" \
                --bin heptabao-h02-openraft-fault-lab -- --seed "$seed" \
                > "$RUNNER_TEMP/results/hostile-$suffix.json"
              cargo +"$toolchain" run --quiet --locked --manifest-path "$manifest" \
                --bin heptabao-h02-openraft-durable-store-lab -- --seed "$seed" \
                > "$RUNNER_TEMP/results/durable-$suffix.json"
            done
          done
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "results"
          files = sorted(root.glob("inmemory-*.json")) + sorted(root.glob("hostile-*.json")) + sorted(root.glob("durable-*.json"))
          assert len(files) == 18, [path.name for path in files]
          for path in files:
              value = json.loads(path.read_text(encoding="utf-8"))
              status = value.get("status")
              assert status == "EXECUTED_PASS", (path.name, status, value)
              assert value.get("qualification") is False
              assert value.get("selection_effect") == "NONE"
              assert value.get("authority_effect") == "NONE"
          print("18/18 macOS cross-platform candidate executions passed")
          PY

      - name: Upload complete diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1-2-2-cf429-exact-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results/
          if-no-files-found: error
          retention-days: 30

      - name: Recheck immutable target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
